  /v1/sick-leave/{id}/certificate:
    post:
      description: Stores the certificate (a photo or e-MC of up to 5 MB) as a restricted document of the person, seen by the HR officer and the HR administrator only, and records who issued it. The person gives their own; the people team may give it for them. It is given once (NM_LEAVE_CONFLICT). It is audited.
      operationId: addSickCertificate
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
        - description: The notification.
          in: path
          name: id
          required: true
          schema:
            description: The notification.
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e90
            format: uuid
            type: string
        - description: "A key you choose (a UUID is best) that makes the request safe to send again for 24 hours: a repeat from the same person returns the first answer with `Idempotent-Replayed: true`, the same key with a different request returns 422, and two identical requests at once run once. An operation whose answer may carry pay, a bank account or an NRIC does not store its answer: a repeat of one that returned a body answers 409, and the result is read from the record."
          example: 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
          in: header
          name: Idempotency-Key
          schema:
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
            maxLength: 255
            minLength: 0
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInputBody"
        required: true
      responses:
