  /internal/v1/proposals:
    post:
      description: "Makes a proposal of a catalogue task type for the turn's person (AI-P3), the AI's only write. The turn's token may propose only while the organisation has a task type on (ai.task_types), and does nothing else. The API keeps it as a Draft, checks the AI switch, that the task type is on, its payload against the task type's schema and limits, and that the person may do it themselves; screens what the model wrote; then dry-runs it as the person in a unit of work it rolls back and keeps the impact and the versions it read. It answers Pending, waiting for a person, or Invalid with why. A revision names the proposal it replaces: the person's own, of the same task type, still waiting; once the revision is Pending, that one is Superseded and its approval request void, in the same transaction. Nothing changes until a person approves it, and the approval and the execution are never the AI's."
      operationId: proposeAITask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIPropose"
        required: true
      responses:
