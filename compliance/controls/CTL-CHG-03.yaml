section: "F.4"
control: "SAST, dependency, container and secret scans; critical findings block"
mapping: "ISO 8.25, 8.28, 8.8; SOC2 CC7.1; CE"
automated_check: "CI gates"
frequency: "CI"
evidence: "Scan reports"
owner: Owner
checks:
