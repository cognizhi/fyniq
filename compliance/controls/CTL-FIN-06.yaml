# CTL-FIN-06: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-06
section: "F.1"
control: "Statutory parameter packs are sourced, dual-approved and pinned-tested"
mapping: "IRAS; CPF Act; SOC2 PI1"
automated_check: "CI fails if the current year's pack is missing, unsourced or fails pinned tests"
frequency: "CI, E (January)"
evidence: "Pack record; test report"
owner: Controller
checks:
  - frequency: CI
    status: running
    how: "test TestTheShippedPacksLoadAndPassTheirPinnedTests"
    evidence: "every shipped pack version loads with its sources and passes its pinned cases (QA-ENG-08); CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestPackActivationWaitsForASecondApprover"
    evidence: "a pack version activates only on a second person's approval (SOD-10); CI artefact test-report (90 days)"
  - frequency: E
    status: running
    how: "check parameters.packs-current"
    evidence: "a pack in force past its review date, or a later version loaded and not yet activated, warns (C.2 #16); the check's latest result for each organisation, on Checks"
