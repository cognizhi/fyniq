# CTL-DP-07: PRD-001 Appendix F (F.5). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-DP-07
section: "F.5"
control: "Resource locations restricted to Singapore (except documented transfers)"
mapping: "PDPA transfer limitation; ISO 5.23"
automated_check: "Org policy `gcp.resourceLocations`; endpoint restrictions"
frequency: "D"
evidence: "Policy snapshot"
owner: DPO
checks:
  - frequency: D
    status: cloud
    how: "tofu org-policy/the_policies_of_section_12_4"
    evidence: "the organisation policy restricts resource locations to Singapore; read in the cloud [live-verify]"
  - frequency: D
    status: running
    how: "attestation transfers"
    evidence: "the documented transfers: each of Fyniq's flows that leaves Singapore, and each of the company's own, with its recipient, countries, basis, assessment, evidence and next review; on Compliance › Data protection and Reviews and attestations"
