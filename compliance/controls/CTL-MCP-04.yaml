# CTL-MCP-04: PRD-001 Appendix F (F.7a). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-MCP-04
section: "F.7a"
control: "Tokens audience-bound, ≤ 60 min, revoked within 60 s on role change or kill switch (AI-36, AI-38)"
mapping: "ASVS V10 (OAuth); SOC2 CC6.1"
automated_check: "QA-MCP-01 revocation timing test"
frequency: "CI"
evidence: "Test report"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestAnMCPCallReachesTheDataOnlyAsTheDelegatedPerson"
    evidence: "an MCP token is audience-bound and checked on every call; a revoked token, an API-audience token and the MCP token at the API are refused; the person's opt-out stops the very next call; delegated tokens live at most 5 minutes; CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestAnOptOutRevokesTheAIAppsTokensAndNothingElse"
    evidence: "an opt-out revokes the access and refresh tokens the person's AI apps hold, at the pinned Hydra, and no other token; CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestOnlyATokenForThisServerIsAccepted"
    evidence: "only a token for the MCP server alone, of an agent-class client, live now and consented within 90 days is accepted; CI artefact test-report (90 days)"
