# sg-cpf@2026.2: sg-cpf@2026.1 with the first and second years of permanent residence, the graduated range of monthly total
# wages from $50 to $750, and the Ordinary Wage maximum of each band (PRD-001 §10.6, ENG-30; p1-statutory-packs 4.1).
# Never edit this version once it is active anywhere: a correction is sg-cpf@2026.3 (fyniq-sg-statutory).
id = "sg-cpf@2026.2"
title = "Singapore CPF contributions: the rates by age band for citizens and permanent residents in each year of residence, the graduated range from $50 to $750 a month, and the wage ceilings"
effective_from = "2026-01-01"
supersedes = "sg-cpf@2026.1"
review_date = "2027-01-31"
verifier = "Claude Code against the CPF Board's rate tables for 1 January 2026 and 1 January 2027 on 18 Nov 2026 (p1-statutory-packs), and the pages of 8 Nov 2026 (p1-planning); the accountant's review is pending (FR-UX-41)"
conditions = "Wages earned in a month by a Singapore citizen or permanent resident of the private sector. Group sc_spr3: citizens and permanent residents from the third year, and a first- or second-year permanent resident whose employer and who jointly apply, and the CPF Board approves, to contribute at full rates. Groups spr1_gg and spr2_gg: a first- or second-year permanent resident at the graduated rates of the employer and the employee; spr1_fg and spr2_fg: at full employer and graduated employee rates, after the CPF Board approves the joint application. The age band is the employee's age as the CPF Board counts it for the month: new rates apply from the first day of the month after the 55th, 60th, 65th or 70th birthday. Total wages are the Ordinary Wages (capped at the monthly ceiling) and Additional Wages (capped by the annual salary ceiling less the year's Ordinary Wages subject to CPF): wages of $50 or less carry nothing, above $50 to $500 the flat rate of the wages, all of it the employer's, above $500 to $750 the flat rate of the wages plus the slope of the wages above $500, the slope being the employee's share, and above $750 the rates of the rates table. The total contribution rounds to the nearest dollar (50 cents up) and the employee's share down, the employer's being the difference; that is the pay run's, not this pack's"

