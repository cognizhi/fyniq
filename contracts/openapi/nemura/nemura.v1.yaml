            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkingPattern"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Set a person's working pattern
      tags:
        - Leave
  /v1/policy:
    get:
      description: Returns the company's leave policy in force on a day (today when none is given) and the pack version it was checked against. Whoever sees the settings. It changes nothing.
      operationId: getPolicy
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
        - description: The day to show the policy on; today when empty.
          explode: false
          in: query
          name: as_of
          schema:
            description: The day to show the policy on; today when empty.
            examples:
              - "2026-12-01"
            format: date
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: The company's leave policy
      tags:
        - Packs
    put:
      description: "Starts the company's leave policy on a day, ending the one in force. It is checked rule by rule against the statute of the pack in force: a policy that gives less on any rule is refused (NM_POLICY_BELOW_STATUTE) with every rule it breaks; one that gives more says so. The HR administrator or the Owner. It is audited."
      operationId: setPolicy
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPolicyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPolicyOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Set the company's leave policy
      tags:
        - Packs
  /v1/session:
    get:
      description: Returns the person the session cookie names, the organisation they are in, the roles they hold today and the page they land on. Roles are read again on each request, so a change is seen at once. It changes nothing; without a valid session it is NM_UNAUTHENTICATED.
      operationId: getSession
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Who is signed in
      tags:
        - Session
  /v1/session/step-up:
    post:
      description: Returns the options the browser passes to navigator.credentials.get to confirm it is the person, and keeps a one-time challenge for five minutes. It needs a session; without a registered passkey it is NM_NO_PASSKEY. Nothing changes until the answer is sent to POST /v1/session/step-up/confirm.
      operationId: beginStepUp
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Start confirming the session with a passkey
      tags:
        - Session
  /v1/session/step-up/confirm:
    post:
      description: "Checks the browser's answer to the step-up challenge: one of the person's live passkeys signed exactly that challenge, for this site, with the person verified, and its counter did not go back. The session is then confirmed for five minutes, which approvals need. The challenge is used once, whatever the answer."
      operationId: confirmStepUp
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Confirm the session with a passkey
      tags:
        - Session
  /v1/sign-in:
    get:
      description: Lists the sign-in providers people may use, in order, and whether first-run setup is done. It needs no sign-in, shows nothing of any organisation and changes nothing; a browser signs in by going to /auth/signin with a provider's ID.
      operationId: getSignIn
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: What the sign-in page shows
      tags:
        - Sign-in
servers:
  - description: Nemura's origin with /api (one origin serves the web app and the API), or the api service itself in make dev.
    url: "{origin}"
    variables:
      origin:
        default: http://localhost:8180/api
        description: http://localhost:8180/api behind Nemura's edge (PEOPLE=yes make up); http://localhost:8087 for the api service
tags:
  - description: What the service is and the error codes it returns (NM-ARC-03).
    name: Platform
  - description: Systems that call Nemura's API on their own, registered by the Owner with a key pair they hold (NM-ARC-06).
    name: API clients
  - description: "What the sign-in page shows: the providers on offer and whether first-run setup is done."
    name: Sign-in
  - description: "The people record: the directory everyone sees, and each person's record, job history and legal classification (NM-PPL-01, NM-PPL-06, NM-PPL-08)."
    name: People
  - description: "Each optional feature of an organisation: on, off or held by another system (NM-FEAT-01 to 05)."
    name: Features
  - description: Country packs with their sources, the company's policy on top and the people checks (NM-PACK-01 to 08).
    name: Packs
  - description: Working patterns, leave balances and the ledger behind them (NM-LV-01, NM-LV-02, NM-LV-13, NM-TIM-01).
    name: Leave
  - description: Who is signed in, the roles they hold now and where they land (NM-ROLE-01, NM-ROLE-02).
    name: Session
