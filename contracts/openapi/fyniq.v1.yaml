# The contract of Fyniq's public API (PRD-001 §8.18, ADR-T1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        active:
          description: An inactive account takes no new postings.
          examples:
            - true
          type: boolean
        cash_flow_line:
          description: Its line in the cash-flow statement, for balance-sheet accounts.
          examples:
            - Payables & accruals
          type: string
        code:
          description: The account code.
          examples:
            - "6100"
          type: string
        control:
          description: Has a sub-ledger (AR, AP, a director's account).
          examples:
            - false
          type: boolean
        currency:
          description: A bank account's currency.
          examples:
            - SGD
          type: string
        default_gst_code:
          description: The GST code a line on it starts with.
          examples:
            - TX
          type: string
        function:
          description: The function its costs belong to.
          enum:
            - COGS
            - R&D
            - S&M
            - G&A
            - Other
          examples:
            - G&A
          type: string
        group:
          description: "A group account is a heading: postings go to the accounts under it."
          examples:
            - false
          type: boolean
        guidance:
          description: Shown when someone picks the account.
          examples:
            - Office rent, co-working memberships and short-term space.
          type: string
        id:
          description: The account's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          format: uuid
          type: string
        money_account:
          description: A bank, cash, card or wallet account money moves through.
          examples:
            - false
          type: boolean
        name:
          description: The account name.
          examples:
            - Rent
          type: string
        parent_id:
          description: The group account it sits under, or null.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d61
          format: uuid
          type:
            - string
            - "null"
        payroll_cost:
          description: Carries payroll cost (FR-PRJ-12, FR-PAY-13).
          examples:
            - false
          type: boolean
        report_group:
          description: Where the statements show it.
          examples:
            - Premises & office
          type: string
        role:
          description: A role the rules treat specially, such as share-capital.
          examples:
            - share-capital
          type: string
        type:
          description: The account type.
          enum:
            - asset
            - liability
            - equity
            - revenue
            - expense
          examples:
            - expense
          type: string
        version:
          description: The record's version; it also makes the ETag.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - code
        - name
        - type
        - parent_id
        - group
        - active
        - version
        - money_account
        - control
        - payroll_cost
      type: object
    AccountChanges:
      additionalProperties: false
      properties:
        active:
          description: false blocks new postings (FR-COA-04); a system account stays active.
          examples:
            - false
          type: boolean
        cash_flow_line:
          description: Its cash-flow line.
          examples:
            - Payables & accruals
          maxLength: 60
          type: string
        control:
          description: "Changes only with an approval, which arrives with the approval engine: refused until then."
          examples:
            - false
          type: boolean
        currency:
          description: A bank account's currency; "" clears it.
          examples:
            - USD
          type: string
        default_gst_code:
          description: The GST code a line on it starts with; "" clears it.
          examples:
            - TX
          type: string
        function:
          description: COGS, R&D, S&M, G&A or Other; "" clears it.
          examples:
            - G&A
          type: string
        group:
          description: Whether it is a heading; an account with postings stays a leaf.
          examples:
            - false
          type: boolean
        guidance:
          description: Shown when someone picks the account; "" clears it.
          examples:
            - Office rent and co-working memberships.
          maxLength: 500
          type: string
        money_account:
          description: A bank, cash, card or wallet account.
          examples:
            - true
          type: boolean
        name:
          description: Its name.
          examples:
            - Rent & co-working
          maxLength: 200
          type: string
        parent_id:
          description: The group account it sits under; "" moves it to the top.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d61
          type: string
        payroll_cost:
          description: "Changes only with an approval, like the control flag: refused until then."
          examples:
            - false
          type: boolean
        report_group:
          description: Where the statements show it.
          examples:
            - Premises & office
          maxLength: 60
          type: string
      type: object
    AccountDraft:
      additionalProperties: false
      properties:
        cash_flow_line:
          description: Its cash-flow line, for balance-sheet accounts.
          examples:
            - Payables & accruals
          maxLength: 60
          type: string
        code:
          description: "Its code: 1 to 20 letters, digits, dots or hyphens; it never changes."
          examples:
            - "6115"
          maxLength: 20
          type: string
        control:
          description: Has a sub-ledger.
          examples:
            - false
          type: boolean
        currency:
          description: A bank account's currency.
          examples:
            - SGD
          type: string
        default_gst_code:
          description: The GST code a line on it starts with.
          examples:
            - TX
          type: string
        function:
          description: COGS, R&D, S&M, G&A or Other.
          examples:
            - G&A
          type: string
        group:
          description: "A group account is a heading: postings go only to the accounts under it."
          examples:
            - false
          type: boolean
        guidance:
          description: Shown when someone picks the account.
          examples:
            - Hot-desk and co-working memberships.
          maxLength: 500
          type: string
        money_account:
          description: A bank, cash, card or wallet account money moves through.
          examples:
            - false
          type: boolean
        name:
          description: Its name.
          examples:
            - Co-working memberships
          maxLength: 200
          type: string
        parent_id:
          description: The group account it sits under (FR-COA-05).
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d61
          type: string
        payroll_cost:
          description: Carries payroll cost.
          examples:
            - false
          type: boolean
        report_group:
          description: Where the statements show it.
          examples:
            - Premises & office
          maxLength: 60
          type: string
        role:
          description: "A system role (FR-COA-03); it never changes. Usually left empty: the standard chart sets them."
          examples:
            - suspense
          type: string
        type:
          description: asset, liability, equity, revenue or expense; it never changes.
          examples:
            - expense
          type: string
      required:
        - code
        - name
        - type
      type: object
    AccountPage:
      additionalProperties: false
      properties:
        items:
          description: The accounts on this page, by code.
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
        next_cursor:
          description: Send it as cursor for the next page; absent on the last page.
          examples:
            - eyJhZnRlciI6IjYxMDAifQ
          type: string
      required:
        - items
      type: object
    BulkResult:
      additionalProperties: false
      properties:
        etag:
          description: The saved record's ETag, for If-Match; absent when the item was refused or previewed.
          examples:
            - "\"1-draft\""
          type: string
        id:
          description: The saved record's ID; absent when the item was refused or previewed.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d70
          format: uuid
          type: string
        index:
          description: The item's position in the request, from 0.
          examples:
            - 0
          format: int64
          type: integer
        problem:
          $ref: "#/components/schemas/Problem"
          description: Why the item was refused (RFC 9457), with its stable code; absent when it was saved or previewed.
        status:
          description: "What the item's own request would have answered: 201 saved, 200 previewed (nothing saved), or the status of its problem."
          examples:
            - 201
          format: int64
          type: integer
      required:
        - index
        - status
      type: object
    BulkResults:
      additionalProperties: false
      properties:
        refused:
          description: How many items were refused; each has its problem in results.
          examples:
            - 2
          format: int64
          type: integer
        results:
          description: One result per item, in the order sent; an item is never left out.
          items:
            $ref: "#/components/schemas/BulkResult"
          type:
            - array
            - "null"
        saved:
          description: How many items were saved (or, in a preview, would be).
          examples:
            - 998
          format: int64
          type: integer
      required:
        - results
        - saved
        - refused
      type: object
    ChartLoaded:
      additionalProperties: false
      properties:
        accounts:
          description: How many accounts the chart now holds.
          examples:
            - 86
          format: int64
          type: integer
      required:
        - accounts
      type: object
    Contact:
      additionalProperties: false
      properties:
        active:
          description: An inactive contact is kept for its history and offered for nothing new.
          examples:
            - true
          type: boolean
        address:
          description: Its address.
          examples:
            - "1 Raffles Place, #20-01, Singapore 048616"
          type: string
        billing_email:
          description: Where invoices go.
          examples:
            - accounts@northwind.example
          type: string
        country:
          description: Its country, ISO 3166 two-letter code.
          examples:
            - SG
          type: string
        currency:
          description: The currency it trades in.
          examples:
            - SGD
          type: string
        customer:
          description: "A customer: invoices go to it."
          examples:
            - true
          type: boolean
        default_account_id:
          description: The category its lines start with.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          format: uuid
          type: string
        default_gst_code:
          description: The GST code its lines start with.
          examples:
            - SR
          type: string
        id:
          description: The contact's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4db0
          format: uuid
          type: string
        legal_name:
          description: Its legal name.
          examples:
            - Northwind Analytics Pte. Ltd.
          type: string
        payment_terms_days:
          description: Days until its documents fall due.
          examples:
            - 30
          format: int64
          type: integer
        peppol_id:
          description: Its Peppol participant ID for InvoiceNow.
          examples:
            - 0195:SGUEN202312345K
          type: string
        phone:
          description: Its phone number.
          examples:
            - +65 6123 4567
          type: string
        possible_duplicates:
          description: "Other contacts with the same name, UEN or tax ID, or email (FR-CT-04): review them, and merge or tell them apart."
          items:
            $ref: "#/components/schemas/PossibleDuplicate"
          type:
            - array
            - "null"
        remittance_email:
          description: Where remittance advice goes.
          examples:
            - payments@northwind.example
          type: string
        uen_or_tax_id:
          description: Its UEN, or a foreign contact's tax ID.
          examples:
            - 202312345K
          type: string
        vendor:
          description: "A vendor: bills come from it."
          examples:
            - false
          type: boolean
        version:
          description: The contact's version; it also makes the ETag.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - legal_name
        - customer
        - vendor
        - active
        - version
        - possible_duplicates
      type: object
    ContactChanges:
      additionalProperties: false
      properties:
        active:
          description: false keeps it for its history and offers it for nothing new.
          examples:
            - false
          type: boolean
        address:
          description: Its address.
          examples:
            - "1 Raffles Place, #20-01, Singapore 048616"
          maxLength: 500
          type: string
        billing_email:
          description: Where invoices go.
          examples:
            - accounts@northwind.example
          maxLength: 254
          type: string
        country:
          description: ISO 3166 two-letter code.
          examples:
            - SG
          type: string
        currency:
          description: ISO 4217 code.
          examples:
            - USD
          type: string
        customer:
          description: A customer.
          examples:
            - true
          type: boolean
        default_account_id:
          description: The default category; "" clears it.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          type: string
        default_gst_code:
          description: The default GST code.
          examples:
            - SR
          type: string
        legal_name:
          description: Its legal name.
          examples:
            - Northwind Analytics Pte. Ltd.
          maxLength: 200
          type: string
        payment_terms_days:
          description: 0 to 365 days; -1 clears them.
          examples:
            - 45
          format: int64
          type: integer
        peppol_id:
          description: Its Peppol participant ID.
          examples:
            - 0195:SGUEN202312345K
          maxLength: 70
          type: string
        phone:
          description: Its phone number.
          examples:
            - +65 6123 4567
          maxLength: 40
          type: string
        remittance_email:
          description: Where remittance advice goes.
          examples:
            - payments@northwind.example
          maxLength: 254
          type: string
        uen_or_tax_id:
          description: Its UEN or tax ID.
          examples:
            - 202312345K
          maxLength: 30
          type: string
        vendor:
          description: A vendor.
          examples:
            - true
          type: boolean
      type: object
    ContactDraft:
      additionalProperties: false
      properties:
        address:
          description: Its address.
          examples:
            - "1 Raffles Place, #20-01, Singapore 048616"
          maxLength: 500
          type: string
        billing_email:
          description: Where invoices go.
          examples:
            - accounts@northwind.example
          maxLength: 254
          type: string
        country:
          description: ISO 3166 two-letter code.
          examples:
            - SG
          type: string
        currency:
          description: ISO 4217 code.
          examples:
            - SGD
          type: string
        customer:
          description: A customer.
          examples:
            - true
          type: boolean
        default_account_id:
          description: "The default category: an active account that takes postings."
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          type: string
        default_gst_code:
          description: The default GST code.
          examples:
            - SR
          type: string
        legal_name:
          description: Its legal name.
          examples:
            - Northwind Analytics Pte. Ltd.
          maxLength: 200
          type: string
        payment_terms_days:
          description: 0 to 365 days.
          examples:
            - 30
          format: int64
          type: integer
        peppol_id:
          description: Its Peppol participant ID.
          examples:
            - 0195:SGUEN202312345K
          maxLength: 70
          type: string
        phone:
          description: Its phone number.
          examples:
            - +65 6123 4567
          maxLength: 40
          type: string
        remittance_email:
          description: Where remittance advice goes.
          examples:
            - payments@northwind.example
          maxLength: 254
          type: string
        uen_or_tax_id:
          description: Its UEN or tax ID.
          examples:
            - 202312345K
          maxLength: 30
          type: string
        vendor:
          description: A vendor; at least one of customer and vendor.
          examples:
            - false
          type: boolean
      required:
        - legal_name
      type: object
    ContactPage:
      additionalProperties: false
      properties:
        items:
          description: The contacts on this page.
          items:
            $ref: "#/components/schemas/Contact"
          type:
            - array
            - "null"
        next_cursor:
          description: Send it as cursor for the next page; absent on the last page.
          examples:
            - eyJhZnRlciI6IjAxOTI4ZjZlIn0
          type: string
      required:
        - items
      type: object
    Entry:
      additionalProperties: false
      properties:
        id:
          description: The entry's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d80
          format: uuid
          type: string
        ledger_revision:
          description: The organisation's ledger revision this entry made (ENG-46).
          examples:
            - 42
          format: int64
          type: integer
        lines:
          description: Its lines.
          items:
            $ref: "#/components/schemas/EntryLine"
          type:
            - array
            - "null"
        memo:
          description: The entry's memo.
          examples:
            - October rent accrual
          type: string
        period_id:
          description: The accounting period it falls in.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d90
          format: uuid
          type: string
        posting_date:
          description: The date it posts on.
          examples:
            - "2026-10-31"
          format: date
          type: string
        posting_identity:
          description: "What was posted, under which rule: the same thing never posts twice."
          examples:
            - manual_journal:01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d70:v1:journal@1
          type: string
        recorded_at:
          description: When it was recorded.
          examples:
            - "2026-10-31T09:30:00Z"
          format: date-time
          type: string
        reverses_entry_id:
          description: For a reversal, the entry it reverses.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d81
          format: uuid
          type: string
        rule_version:
          description: The posting rule and its version (ENG-03).
          examples:
            - journal@1
          type: string
      required:
        - id
        - ledger_revision
        - posting_date
        - period_id
        - posting_identity
        - rule_version
        - recorded_at
        - lines
      type: object
    EntryLine:
      additionalProperties: false
      properties:
        account_id:
          description: The account posted to.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          format: uuid
          type: string
        amount:
          $ref: "#/components/schemas/Money"
          description: "In the line's currency: debit positive, credit negative."
        base_amount:
          $ref: "#/components/schemas/Money"
          description: In the base currency, computed once at posting (RND-FX).
        description:
          description: What the line is for.
          examples:
            - October office rent
          type: string
        fx_rate:
          description: Base currency per unit of the line's currency (1 for the base currency).
          examples:
            - "1"
          type: string
        fx_rate_source:
          description: Where the rate came from.
          examples:
            - base
          type: string
        line_no:
          description: The line's number in the entry.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - line_no
        - account_id
        - amount
        - fx_rate
        - fx_rate_source
        - base_amount
      type: object
    FieldProblem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - LEDGER-04
          type: string
        field:
          description: "The JSON path of the field: in the request body (body.…), the query (query.…), a header (header.…), or the saved record a command acts on."
          examples:
            - lines[0].account_id
          type: string
        fix:
          description: How to fix it.
          examples:
            - Choose an account from the chart of accounts
          type: string
        message:
          description: What is wrong with it.
          examples:
            - the account does not exist in this organisation
          type: string
      required:
        - code
        - field
        - message
        - fix
      type: object
    GSTPeriod:
      additionalProperties: false
      properties:
        ends_on:
          description: Its last day.
          examples:
            - "2026-06-30"
          format: date
          type: string
        starts_on:
          description: Its first day.
          examples:
            - "2026-04-01"
          format: date
          type: string
      required:
        - starts_on
        - ends_on
      type: object
    GSTRegistration:
      additionalProperties: false
      properties:
        accounting_basis:
          description: "invoice: cash basis under IRAS's Cash Accounting Scheme is offered once its rules are pinned (ENG-45)."
          examples:
            - invoice
          type: string
        deregistered_from:
          description: The first day it is no longer registered; absent while the registration lasts.
          examples:
            - "2028-01-01"
          format: date
          type: string
        gst_number:
          description: The GST registration number on IRAS's notice of registration.
          examples:
            - 202312345K
          type: string
        id:
          description: The registration's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4da0
          format: uuid
          type: string
        quarter_start_month:
          description: "Quarters start in this month of the year and every third after it: 1 (January, April, July, October), 2 or 3."
          examples:
            - 1
          format: int64
          maximum: 3
          minimum: 1
          type: integer
        recorded_at:
          description: When this version was recorded.
          examples:
            - "2026-10-19T09:30:00Z"
          format: date-time
          type: string
        registered_from:
          description: The first day the organisation is registered.
          examples:
            - "2026-04-01"
          format: date
          type: string
        return_frequency:
          description: How often GST returns are filed.
          enum:
            - quarterly
            - monthly
          examples:
            - quarterly
          type: string
        version:
          description: The registration's version; it also makes the ETag.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - registered_from
        - gst_number
        - return_frequency
        - quarter_start_month
        - accounting_basis
        - version
        - recorded_at
      type: object
    GSTRegistrationChanges:
      additionalProperties: false
      properties:
        accounting_basis:
          description: invoice.
          examples:
            - invoice
          type: string
        deregistered_from:
          description: The first day it is no longer registered, YYYY-MM-DD; "" clears it.
          examples:
            - "2028-01-01"
          type: string
        gst_number:
          description: The GST registration number.
          examples:
            - 202312345K
          maxLength: 20
          type: string
        quarter_start_month:
          description: 1, 2 or 3.
          examples:
            - 1
          format: int64
          type: integer
        registered_from:
          description: The first day the organisation is registered, YYYY-MM-DD.
          examples:
            - "2026-04-01"
          type: string
        return_frequency:
          description: quarterly or monthly.
          examples:
            - monthly
          type: string
      type: object
    GSTRegistrationDraft:
      additionalProperties: false
      properties:
        accounting_basis:
          description: "invoice (when left out): the only basis offered until the Cash Accounting Scheme's rules are pinned (ENG-45)."
          examples:
            - invoice
          type: string
        deregistered_from:
          description: The first day it is no longer registered, if known.
          examples:
            - "2028-01-01"
          format: date
          type: string
        gst_number:
          description: The GST registration number on IRAS's notice of registration.
          examples:
            - 202312345K
          maxLength: 20
          type: string
        quarter_start_month:
          description: "1 (when left out), 2 or 3: quarters start in this month and every third after it."
          examples:
            - 1
          format: int64
          type: integer
        registered_from:
          description: The first day the organisation is registered.
          examples:
            - "2026-04-01"
          format: date
          type: string
        return_frequency:
          description: quarterly (when left out) or monthly.
          examples:
            - quarterly
          type: string
