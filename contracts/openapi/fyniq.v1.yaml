            maxLength: 255
            minLength: 1
            pattern: ^[\x21-\x7E]+$
            type: string
        - description: "return=preview runs every check of the command and answers with what it would return, saving nothing (FR-INT-14): no Idempotency-Key is claimed, and IDs in the answer are not kept."
