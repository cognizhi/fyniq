# sg-people@2026.1: the first version of Singapore's people pack, read from MOM's pages on 2026-11-19 (PRD-002 NM-PACK-06; p1-nemura-records-packs slice 4).
# Every value is RESEARCHED, not verified: nobody on the publisher's side has yet checked the page a second time (NM-PACK-07, owner decision O2, 19 Nov 2026).
# A company's calculation that needs one asks for a recorded decision on first use; the publishers verify the values before the first paid person (CTL-NM-07).
# effective_from of a row is this version's first day, not the day the rule began: MOM's pages do not say when a rule began.
# Never edit this version once it is active anywhere: a correction is sg-people@2026.2.
id = "sg-people@2026.1"
title = "Singapore people facts: annual and sick leave days, public holidays for 2026 and 2027, childcare leave, when salary is paid, how long employment records are kept, and the retirement and re-employment ages by birth cohort"
effective_from = "2026-01-01"
review_date = "2027-01-31"
verifier = "none yet: the values were read from the official pages by Claude Code on 2026-11-19 and are researched (p1-nemura-records-packs; owner decision O2)"
conditions = "Employees covered by the Employment Act, in Singapore. A public holiday on an employee's rest day makes their next working day a paid holiday, and one on a non-working day gives another day off or an extra day's pay (MOM); this table lists the gazetted dates. From 1 January 2029 MOM says the retirement and re-employment ages rise to 65 and 70; MOM's page does not say which birth cohorts, so no row is written for it yet. Maternity, paternity and shared parental leave, Part IV hours and the key employment terms arrive in a later version."

[[sources]]
id = "mom-annual-leave"
title = "MOM: Annual leave, eligibility and entitlement"
url = "https://www.mom.gov.sg/employment-practices/leave/annual-leave/eligibility-and-entitlement"
section = "Eligibility and entitlement"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "If you are covered by the Employment Act and have worked for at least 3 months, you are entitled to annual leave. The table gives 7 days in the 1st year, increasing by one day each year to 14 days in the 8th year and thereafter."

[[sources]]
id = "mom-sick-leave"
title = "MOM: Sick leave, eligibility and entitlement"
url = "https://www.mom.gov.sg/employment-practices/leave/sick-leave/eligibility-and-entitlement"
section = "The example table of paid sick leave by months of service"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "3 months: 5 days outpatient, 15 hospitalisation; 4: 8 and 30; 5: 11 and 45; 6 and thereafter: 14 and 60."

[[sources]]
id = "mom-public-holidays"
title = "MOM: Public holidays"
url = "https://www.mom.gov.sg/employment-practices/public-holidays"
section = "The public holidays of 2026 and 2027"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "2027: 1 January, Friday, New Year's Day; 6 and 7 February, Saturday and Sunday, Chinese New Year; 26 March, Friday, Good Friday; 1 May, Saturday, Labour Day; 9 August, Monday, National Day; 25 December, Saturday, Christmas Day."

[[sources]]
id = "mom-childcare-leave"
title = "MOM: Childcare leave, eligibility and entitlement"
url = "https://www.mom.gov.sg/employment-practices/leave/childcare-leave/eligibility-and-entitlement"
section = "Eligibility and entitlement"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "Eligible working parents of Singapore citizen children are entitled to 6 days of paid childcare leave per year. If your youngest Singaporean child is between 7 and 12 years old, you could be eligible for 2 days of extended childcare leave. If your child is not a Singapore citizen, you and your spouse are each entitled to 2 days of childcare leave."

[[sources]]
id = "mom-paying-salary"
title = "MOM: Paying salary"
url = "https://www.mom.gov.sg/employment-practices/salary/paying-salary"
section = "When to pay salary"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "Within 7 days after the end of the salary period. For overtime work, within 14 days after the end of the salary period."

[[sources]]
id = "mom-employment-records"
title = "MOM: Employment records"
url = "https://www.mom.gov.sg/employment-practices/employment-records"
section = "How long to keep records"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "For current employees: Latest two years. For ex-employees: Last two years, to be kept for one year after the employee leaves employment."

[[sources]]
id = "mom-re-employment"
title = "MOM: Responsible re-employment"
url = "https://www.mom.gov.sg/employment-practices/re-employment"
section = "Retirement and re-employment ages"
kind = "official guidance"
retrieved = "2026-11-19"
quote = "From 1 July 2026, the minimum retirement age is 64 years. The re-employment age was raised from 68 to 69 from 1 July 2026. Born 1 July 1958 to 30 June 1960: retirement 62; 1 July 1960 to 30 June 1963: 63; from 1 July 1963: 64."

