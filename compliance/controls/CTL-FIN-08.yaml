# CTL-FIN-08: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-08
section: "F.1"
control: "Payments and payee bank changes are dual-controlled"
mapping: "COSO P8; SOC2 CC6.1"
automated_check: "Self-approval rejection test; nightly check that every released payment has two distinct approvers (rev 0.8: or is a founder break-glass release within FM-8's limits, with its post-review open or completed on time)"
frequency: "CI, N"
evidence: "Approval records"
owner: Controller
checks:
  - frequency: CI
    status: running
    how: "test TestAttackPaymentBatchesKeepTheirRelease"
    evidence: "the database refuses a payment batch released without a second person (FR-BNK-12, FM-1); CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestAChangeOfBankDetailsNeedsASecondPerson"
    evidence: "a payee's bank details change only on another person's approval; CI artefact test-report (90 days)"
  - frequency: N
    status: planned
    how: "verify payments.dual-control"
    arrives: "p1-compliance-center (slice 4)"
  - frequency: N
    status: running
    how: "check controls.break-glass-unreviewed"
    evidence: "every founder break-glass release is reviewed within 7 days of its end (FM-8, C.2 #53); the check's latest result for each organisation, on Checks"
