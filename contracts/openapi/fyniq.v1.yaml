    Money:
      additionalProperties: false
      allOf:
        - if:
            properties:
              currency:
                enum:
                  - JPY
                  - KRW
                  - VND
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})$
        - if:
            properties:
              currency:
                enum:
                  - AUD
                  - CAD
                  - CHF
                  - CNY
                  - EUR
                  - GBP
                  - HKD
                  - IDR
                  - INR
                  - MYR
                  - NZD
                  - PHP
                  - SGD
                  - THB
                  - TWD
                  - USD
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
        - if:
            properties:
              currency:
                enum:
                  - BHD
                  - KWD
                  - OMR
                  - TND
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,3})?$
        - if:
            properties:
              currency:
                enum:
                  - CLF
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,4})?$
      properties:
        amount:
          description: "An exact decimal: debits positive, credits negative; at most the currency's decimals."
          examples:
            - "1250.00"
          pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,4})?$
          type: string
        currency:
          description: The ISO 4217 currency code.
          examples:
            - SGD
          pattern: ^[A-Z]{3}$
          type: string
      required:
        - amount
        - currency
      type: object
