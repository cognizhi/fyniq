# The contract of Nemura's public API (PRD-002 NM-ARC-03, ADR-N1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    Code:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_NOT_FOUND
          type: string
        fix:
          description: The usual way to fix it.
          examples:
            - Choose a code from the catalogue.
          type: string
        status:
          description: The HTTP status the code comes with.
          examples:
            - 404
          format: int64
          type: integer
        title:
          description: A short summary that never changes between occurrences.
          examples:
            - Not found
          type: string
      required:
        - code
        - status
        - title
        - fix
      type: object
    ErrorsOutputBody:
      additionalProperties: false
      properties:
        codes:
          description: Every stable error code, in order.
          items:
            $ref: "#/components/schemas/Code"
          type:
            - array
            - "null"
      required:
        - codes
      type: object
    FieldProblem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_INVALID
          type: string
        field:
          description: "The JSON path of the field: in the request body (body.…), the query (query.…), the path (path.…) or a header (header.…)."
          examples:
            - path.code
          type: string
        fix:
          description: How to fix it.
          examples:
            - Error codes look like NM_NOT_FOUND.
          type: string
        message:
          description: What is wrong with it.
          examples:
            - is not an error code
          type: string
      required:
        - code
        - field
        - message
        - fix
      type: object
    InfoOutputBody:
      additionalProperties: false
      properties:
        service:
          description: The service this answers as.
          examples:
            - nemura-api
          type: string
        version:
          description: The build's version.
          examples:
            - 0.1.0
          type: string
      required:
        - service
        - version
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code (ENG-23).
          examples:
            - NM_NOT_FOUND
          type: string
        detail:
          description: What went wrong this time, in plain English.
          examples:
            - There is no error code NM_NOPE.
          type: string
        errors:
          description: Every invalid field, all at once.
          items:
            $ref: "#/components/schemas/FieldProblem"
          type:
            - array
            - "null"
        fix:
          description: How to fix it.
          examples:
            - Choose a code from the catalogue at GET /v1/errors.
          type: string
        status:
          description: The HTTP status code.
          examples:
            - 404
          format: int64
          type: integer
        title:
          description: A short summary of the problem type; it never changes between occurrences.
          examples:
            - Not found
          type: string
        type:
          description: A URI naming the problem; one per code.
          examples:
            - urn:nemura:problem:NM_NOT_FOUND
          format: uri
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        landing:
          description: "The page the person lands on: /people for the people team, /me for everyone else."
          examples:
            - /people
          type: string
        member_id:
          description: The person who is signed in.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e45
          format: uuid
          type: string
        organisation_id:
          description: The organisation the session is in.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e44
          format: uuid
          type: string
        roles:
          description: The roles the person holds today, from PRD-002 Appendix B.
          examples:
            - - hr_admin
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - organisation_id
        - member_id
        - roles
        - landing
      type: object
info:
  contact:
    name: Nemura
    url: https://github.com/cognizhi/fyniq
  description: |-
    Nemura's public API: the optional people platform of PRD-002. Its web app uses only this API (QA-API-03).

    Conventions (PRD-002 NM-ARC-03, PRD-001 §8.18.1):
    - Errors are RFC 9457 problem details (application/problem+json) with a stable code from the catalogue at GET /v1/errors, what is
      wrong, and how to fix it; validation errors list every invalid field at once.
    - Every POST that creates or changes state accepts an Idempotency-Key header: a repeat returns the original response, and the same
      key with a different request returns 422.
    - Versioned records return an ETag; commands that change one require If-Match and return 412 when the record changed since, 428
      without it.
    - Changes inside /v1 are additive: a field, an operation or an enum value may be added, and nothing is removed or changed in meaning.
    - Money is a decimal string with its currency, never a JSON number; dates are ISO 8601; IDs are UUIDv7 strings.
  license:
    identifier: MIT
    name: MIT
  title: Nemura API
  version: 0.1.0 # x-release-please-version
openapi: 3.1.0
paths:
  /v1/errors:
    get:
      description: Lists every stable error code the API returns, with its HTTP status, its title and the usual fix. It needs no sign-in and changes nothing; a code never changes meaning inside /v1.
      operationId: listErrorCodes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: The stable error codes
      tags:
        - Platform
  /v1/errors/{code}:
    get:
      description: Returns one error code of the catalogue with its status, title and usual fix. It needs no sign-in and changes nothing. An unknown code is NM_NOT_FOUND, and a value that is not shaped like a code is NM_INVALID.
      operationId: getErrorCode
      parameters:
        - description: A stable error code.
          in: path
          name: code
          required: true
          schema:
            description: A stable error code.
            examples:
              - NM_NOT_FOUND
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Code"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: One stable error code
      tags:
        - Platform
  /v1/info:
    get:
      description: "Names the service and its build. It needs no sign-in and changes nothing: a client uses it to check that it is talking to Nemura's API and which version."
      operationId: getInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: What this service is
      tags:
        - Platform
  /v1/session:
    get:
      description: Returns the person the session cookie names, the organisation they are in, the roles they hold today and the page they land on. Roles are read again on each request, so a change is seen at once. It changes nothing; without a valid session it is NM_UNAUTHENTICATED.
      operationId: getSession
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Who is signed in
      tags:
        - Session
servers:
  - description: Nemura's origin with /api (one origin serves the web app and the API), or the api service itself in make dev.
    url: "{origin}"
    variables:
      origin:
        default: http://localhost:8180/api
        description: http://localhost:8180/api behind Nemura's edge (PEOPLE=yes make up); http://localhost:8087 for the api service
tags:
  - description: What the service is and the error codes it returns (NM-ARC-03).
    name: Platform
  - description: Who is signed in, the roles they hold now and where they land (NM-ROLE-01, NM-ROLE-02).
    name: Session
