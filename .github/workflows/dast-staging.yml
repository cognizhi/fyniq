# DAST on staging (CTL-CHG-07, PRD-001 rev 0.246; p1-security-hardening design D9): each night, ZAP's baseline of
# staging's origin, as ci.yml's `make dast` scans the local stack on every pull request. Staging signs in through its
# identity provider, which ZAP cannot, so this scan is not signed in until a staging test identity exists
# [live-verify]. It waits for staging: until the repository variable STAGING_ORIGIN names it (https://…), the job is
# skipped. Its report is the evidence.
name: dast-staging

on:
  schedule:
    - cron: "37 18 * * *" # 02:37 in Singapore
  workflow_dispatch:

permissions: {}

concurrency:
  group: dast-staging
  cancel-in-progress: false

jobs:
  dast:
    name: DAST baseline on staging (CTL-CHG-07)
    if: vars.STAGING_ORIGIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
      - run: mise exec -- python3 scripts/dast.py --origin "$STAGING_ORIGIN" --anonymous
        env:
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-staging-report
          path: .data/dast/
          retention-days: 90
          if-no-files-found: ignore
