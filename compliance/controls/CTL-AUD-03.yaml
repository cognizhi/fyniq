# CTL-AUD-03: PRD-001 Appendix F (F.2). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-AUD-03
section: "F.2"
control: "Records retained ≥ 7 years after FY end; buckets retention-locked"
mapping: "ISO 5.33; IRAS; GST; Companies Act"
automated_check: "Daily: bucket `isLocked=true`, retention ≥ policy; (rev 0.8) for every object committed since the last run, retention mode Locked and retain-until ≥ the expiry computed from its record; no orphans; log buckets locked"
frequency: "D"
evidence: "Config snapshot"
owner: Owner
checks:
  - frequency: D
    status: cloud
    how: "tofu anchors/production_anchors_are_locked"
    evidence: "production's anchors bucket is retention-locked and encrypted under its own key; read in the cloud [live-verify]"
  - frequency: D
    status: running
    how: "verify records.retention"
    evidence: "the latest run for the organisation (fyniq.control_run): each file committed in the last day is in the records store in Locked mode, kept at least until its record's retain-until, and every file the store keeps has its record; the records bucket's Object Retention Lock is tofu evidence/the_records_bucket_locks_each_object [live-verify]"
