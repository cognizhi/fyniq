# CTL-FIN-11: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-11
section: "F.1"
control: "(rev 0.3) Founders' balances: settlements, conversions and waivers are approved by someone other than the beneficiary (FM-9) with the resolutions attached; share capital changes only through the register of share issues; per-person sub-ledgers agree"
mapping: "COSO P10; SOC2 PI1; Companies Act s63, s63B, s161, s162"
automated_check: "CI: approval-matrix and INV-13 trigger tests; nightly reconciliation of the per-person sub-ledgers to 2500 and 2120 (rev 0.11, INV-13); allotment-lodgement monitor"
frequency: "CI, N, E"
evidence: "Approval records, resolutions, lodgement evidence"
owner: Controller
checks:
  - frequency: CI
    status: running
    how: "test TestEveryApproverBenefits"
    evidence: "a settlement, conversion or waiver is approved by someone other than its beneficiary (FM-9); CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestAttackShareCapitalMovesOnlyWithTheRegister"
    evidence: "share capital moves only with the register of share issues (INV-13); CI artefact test-report (90 days)"
  - frequency: N
    status: running
    how: "check ledger.sub-ledgers"
    evidence: "each director's and shareholder's account against 2500 and 2120 (INV-13, C.2 #2); the check's latest result for each organisation, on Checks"
  - frequency: E
    status: running
    how: "check founders.conversion-registered"
    evidence: "every approved conversion is lodged with ACRA and registered on time (C.2 #22); the check's latest result for each organisation, on Checks"
