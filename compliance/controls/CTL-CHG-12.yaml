# CTL-CHG-12: PRD-001 Appendix F (F.4). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-CHG-12
section: "F.4"
control: "(rev 0.617) An independent penetration test within the last 12 months (before the first external customer is onboarded, SEC-25), with each Critical or High finding fixed and retested within its due date"
mapping: "ISO 8.8, 8.29; SOC2 CC4.1, CC7.1; CT"
automated_check: "The register of security assessments (Compliance › Security assessments), read by the verification `security-assessments`"
frequency: "Q, E (each assessment)"
evidence: "Register; the report's SHA-256"
owner: Owner
checks:
  - frequency: Q
    status: planned
    arrives: "p2-security-certification"
  - frequency: E
    status: planned
    arrives: "p2-security-certification"
