# CTL-FIN-10: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-10
section: "F.1"
control: "Monthly review of manual journals and unusual entries"
mapping: "ISA 240 expectations; COSO P16"
automated_check: "Report generated; sign-off due date monitored"
frequency: "M"
evidence: "Signed review"
owner: Controller
checks:
  - frequency: M
    status: running
    how: "check controls.accountant-review-overdue"
    evidence: "the external accountant reviews the books, their journals and unusual entries; in Founder mode FM-7 sets it each quarter, overdue 60 days after the quarter ends (C.2 #61); the check's latest result for each organisation, on Checks"
  - frequency: M
    status: running
    how: "attestation accountant-review"
    evidence: "the accountant's signed-off reviews, who signed and when; on Compliance › Reviews and attestations, each review on Accountant reviews"
