# CTL-AI-04: PRD-001 Appendix F (F.7). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-AI-04
section: "F.7"
control: "Catalogue changes dual-approved; excluded task types rejected"
mapping: "AG; ISO 8.32"
automated_check: "Catalogue tests"
frequency: "CI"
evidence: "Change records"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestNothingOnTheNeverListCanBeProposed"
    evidence: "every task type on §9.6's never-list is refused as the catalogue loads and again by name as a proposal is made; every task type of Appendix E passes; CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestEveryChangeToATaskTypeIsANewVersion"
    evidence: "the release's catalogue is pinned in contracts/ai/tasks.lock.json: a changed task type without a new version fails, and so does a version going back (CMP-AI-03); CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestTaskTypesAreOffUntilEnabledUnderDualControl"
    evidence: "every task type is off until an Owner turns it on with a second approver; a type the catalogue lacks is refused; turning types off takes effect at once (AI-32); CI artefact test-report (90 days)"
