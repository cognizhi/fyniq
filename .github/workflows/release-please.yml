# Opens and updates the release pull request from Conventional Commits on main;
# merging that pull request tags vX.Y.Z and publishes a GitHub release (PRD-001 §12.10).
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The job's own GITHUB_TOKEN gets nothing: release-please writes with the App's token instead.
    permissions: {}
    steps:
      # REL-06: an installation token of the organisation's GitHub App (cognizhi-release-bot), so
      # CI runs on the release pull request; GitHub starts no workflow for a GITHUB_TOKEN push.
      # The token covers this repository only, carries just the three scopes release-please
      # writes, and is revoked when the job ends.
      # actions/create-github-app-token v3.2.0, pinned by commit (SEC-28)
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          # The App ID (an organisation variable); the action also accepts the Client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # googleapis/release-please-action v5.0.0, pinned by commit (SEC-28)
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

  # P0 adds a job here, gated on needs.release-please.outputs.release_created,
  # that builds, signs and publishes the images tagged vX.Y.Z and sha-<git sha> (§12.9).
