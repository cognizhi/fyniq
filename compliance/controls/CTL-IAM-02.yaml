# CTL-IAM-02: PRD-001 Appendix F (F.3). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-IAM-02
section: "F.3"
control: "Quarterly access review; external users expire"
mapping: "ISO 5.18; SOC2 CC6.2–6.3; CT"
automated_check: "Review task generated; expired-but-active users = 0"
frequency: "Q, N"
evidence: "Signed review"
owner: Administrator
checks:
  - frequency: Q
    status: running
    how: "check controls.access-review-overdue"
    evidence: "an Owner attests the access review each quarter, overdue 14 days after it ends (FR-CTL-06, C.2 #7); the check's latest result for each organisation, on Checks"
  - frequency: Q
    status: running
    how: "attestation access-review"
    evidence: "the quarter's attestation, who gave it and when; on Compliance › Reviews and attestations, the report on Settings › Access review"
  - frequency: N
    status: running
    how: "check controls.external-users-past-expiry"
    evidence: "no external user stays a member past their end date (C.2 #6); the check's latest result for each organisation, on Checks"
