            examples:
              - nemura_session=…
            type: string
        - description: The client to revoke.
          in: path
          name: id
          required: true
          schema:
            description: The client to revoke.
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e60
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Revoke an API client
      tags:
        - API clients
