# CTL-DP-05: PRD-001 Appendix F (F.5). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-DP-05
section: "F.5"
control: "Data inventory, retention schedule and DPIAs current"
mapping: "PDPA accountability; ISO 5.34"
automated_check: "Review due date monitored"
frequency: "Q"
evidence: "Inventory version"
owner: DPO
checks:
  - frequency: Q
    status: running
    how: "attestation data-inventory"
    evidence: "the Compliance officer's quarterly review of the personal-data inventory, overdue 14 days after the quarter; on Compliance › Data protection and Reviews and attestations"
  - frequency: Q
    status: running
    how: "attestation dpia"
    evidence: "an approved impact assessment for each processing that needs one: payroll and the AI assistant once switched on, and the inventory's entries marked so; on Compliance › Data protection and Reviews and attestations"
