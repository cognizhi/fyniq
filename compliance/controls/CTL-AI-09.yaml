# CTL-AI-09: PRD-001 Appendix F (F.7). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-AI-09
section: "F.7"
control: "(rev 0.6) Scheduled agents stay inside their skill: tool calls only from the pinned allowlist, outputs only reports, tasks and proposals, schedule and enablement changes audited and dual-controlled, runs reproducible"
mapping: "AG (bound autonomy); OWASP LLM06 (excessive agency)"
automated_check: "CI: skill hash pinned and the never-list test per agent; nightly check that every run's tool calls are in its allowlist"
frequency: "CI, N"
evidence: "Run reports; pinned hashes"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestEveryChangeToASkillIsANewVersion"
    evidence: "each agent's skill is pinned by version and hash in agents/agents.lock.json, and a skill naming a write tool, an output beyond its report and catalogue task types, or a never-listed task type is refused as it loads (TestASkillBeyondItsBoundsIsRefused); CI artefact test-report (90 days)"
  - frequency: N
    status: running
    how: "verify ai.agent-runs"
    evidence: "the latest run in each organisation (fyniq.control_run), nightly: every scheduled agent's run that ended in the last day called only the read tools its pinned skill names and proposed only the task types its skill outputs, under its own agent; its tasks are its findings' by the database's rules, and schedule and enablement changes are dual-controlled settings, audited as such; each exception is listed by run (target 0)"
