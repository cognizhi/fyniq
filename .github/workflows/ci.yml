# Merge gates (PRD-001 §12.8, §16.2), one job per step of `make ci` (archtest checks it). Job names
# are required checks on main: rename only together with branch protection. The release path
# (signing, Artifact Registry, staging by digest) arrives with p0-infra-opentofu.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"   # weekly: rebuild the images and rescan everything with fresh vulnerability data (NFR-IMG-03)

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits (REL-01)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, pinned by commit (SEC-28)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title (squash merges use it)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          scripts/hooks/commit-msg "$RUNNER_TEMP/pr-title"
      - name: Commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"   # first push: check every commit reachable from HEAD
          else
            RANGE="$BASE..$HEAD"
          fi
          scripts/check-commits.sh "$RANGE"

  checks:
    name: Design tokens and configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make check

  test:
    name: Go, web and checks (make test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0   # the release tags: oasdiff compares the API contract with the last release (QA-API-02)
      # jdx/mise-action v5.1.2, pinned by commit (SEC-28): installs the toolchain of mise.toml
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: pnpm install --frozen-lockfile
      - run: make test 2>&1 | tee make-test.log   # bash -o pipefail: the job fails when make test does
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-report   # the evidence of the controls checked in make test (compliance/controls/)
          path: make-test.log
          retention-days: 90

  mutation:
    name: Mutation tests (make mutation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: make mutation   # QA-ENG-04: efficacy of at least 90% on money, rounding and the engine

  differential:
    name: Differential tests (make differential)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: make differential   # QA-ENG-02: 1,000 generated scenarios; a disagreement is shrunk and saved
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shrunk-scenario
          path: test/differential/golden/shrunk-*.json

  scan:
    name: Security scans (make scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0   # gitleaks scans the whole history
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: pnpm install --frozen-lockfile   # the npm licences
      - run: make scan   # SEC-21, CTL-CHG-03, CTL-CHG-11: a blocking finding without a waiver fails the merge
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-scan-reports   # the evidence (compliance-as-code)
          path: .data/scan/
          retention-days: 90

  infra:
    name: Infrastructure (make infra-check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: make infra-check   # OpenTofu: fmt, validate, tests on mock providers, the rules; no cloud credentials (NFR-PORT-05)

  images:
    name: Images and local mode (make images, QA-LOCAL-01)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: make images        # both flavours: budgets, non-root, no shell, no local adapter in release (§12.9)
      - run: make image-scan    # SBOM and grype per release image (SEC-21)
      - run: make image-sign    # push by digest to a throwaway registry, sign, attest the SBOM, verify (NFR-IMG-05, SEC-22)
      - run: scripts/local-smoke.sh   # QA-LOCAL-01: make up from the local images, no cloud credentials
        env:
          # Below the kernel's ephemeral range (32768-60999): image-sign's many loopback connections can hold
          # 55432 briefly, and PostgreSQL then cannot bind it (two of three runs of #71 failed that way).
          FYNIQ_PG_PORT: "25432"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-reports   # SBOMs, scans and signatures: the evidence (CTL-CHG-08, CTL-CHG-04)
          path: .data/images/
          retention-days: 90

  evals:
    name: AI evals (make evals)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make evals   # replay mode; the suites arrive in P1

  e2e:
    name: Web smoke test (make test-e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: pnpm install --frozen-lockfile
      - run: make test-e2e   # uses the runner's Google Chrome; no browser download

  local-mode:
    name: Local mode timings (make setup && make dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Only mise itself: `make setup` installs the toolchain inside the timed first run (DEV-01).
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install: false
          cache: false
      - run: scripts/devx-timing.sh
      - if: failure()
        run: tail -n 50 .data/devx-*.log .data/dev/*.log || true

  devcontainer:
    name: Dev container builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -f .devcontainer/Dockerfile -t fyniq-devcontainer .
      - run: docker run --rm fyniq-devcontainer bash -lc 'cd /tmp/toolchain && mise ls --current'
