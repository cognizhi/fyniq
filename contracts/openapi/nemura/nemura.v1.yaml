# The contract of Nemura's public API (PRD-002 NM-ARC-03, ADR-N1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    ChangeJobInputBody:
      additionalProperties: false
      properties:
        effective_from:
          description: The day the new job record starts; the current one ends that day.
          examples:
            - "2026-09-01"
          format: date
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: The new job record.
      required:
        - effective_from
        - job
      type: object
    Classification:
      additionalProperties: false
      properties:
        birth_date:
          description: Date of birth, for the retirement and re-employment cohort.
          examples:
            - "1980-03-04"
          format: date
          type: string
        contract_type:
          description: A contract of service (an employee) or for service (a contractor, who gets no statutory employee entitlement).
          enum:
            - service
            - for_service
          examples:
            - service
          type: string
        ea_covered:
          description: Whether the Employment Act covers the person.
          examples:
            - true
          type: boolean
        part_iv_class:
          description: The Part IV class, which needs Employment Act cover.
          enum:
            - none
            - workman
            - non_workman
          examples:
            - none
          type: string
        pr_start_date:
          description: "The day permanent residence began: for a permanent resident only."
          examples:
            - "2024-05-01"
          format: date
          type: string
        residency:
          description: Citizen, permanent resident or foreigner.
          enum:
            - citizen
            - permanent_resident
            - foreigner
          examples:
            - citizen
          type: string
      required:
        - contract_type
        - ea_covered
        - part_iv_class
        - residency
      type: object
    Client:
      additionalProperties: false
      properties:
        audience:
          description: "The audience its tokens name: the API's."
          examples:
            - nemura-api
          type: string
        client_id:
          description: The OAuth client ID the system signs in with at the token endpoint.
          examples:
            - 4f6c1b52-8d2a-4c93-9a43-0c2d7e9b1a11
          type: string
        id:
          description: The client's ID in Nemura.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e60
          format: uuid
          type: string
        name:
          description: The system that calls.
          examples:
            - Payroll bureau
          type: string
        scopes:
          description: What its tokens may do.
          examples:
            - - directory.read
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - scopes
        - client_id
        - audience
      type: object
    ClientsOutputBody:
      additionalProperties: false
      properties:
        clients:
          description: The organisation's live API clients.
          items:
            $ref: "#/components/schemas/Client"
          type:
            - array
            - "null"
      required:
        - clients
      type: object
    Code:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_NOT_FOUND
          type: string
        fix:
          description: The usual way to fix it.
          examples:
            - Choose a code from the catalogue.
          type: string
        status:
          description: The HTTP status the code comes with.
          examples:
            - 404
          format: int64
          type: integer
        title:
          description: A short summary that never changes between occurrences.
          examples:
            - Not found
          type: string
      required:
        - code
        - status
        - title
        - fix
      type: object
    ConfirmInputBody:
      additionalProperties: false
      properties:
        credential:
          additionalProperties: {}
          description: The PublicKeyCredential the browser returned for the step-up, as JSON.
          type: object
      required:
        - credential
      type: object
    ConfirmedOutputBody:
      additionalProperties: false
      properties:
        confirmed:
          description: "True: the session is confirmed with a passkey for the next five minutes."
          examples:
            - true
          type: boolean
      required:
        - confirmed
      type: object
    CreateClientInputBody:
      additionalProperties: false
      properties:
        algorithm:
          description: "The algorithm its assertions are signed with: ES256, RS256 or EdDSA."
          examples:
            - ES256
          type: string
        name:
          description: The system that will call Nemura.
          examples:
            - Payroll bureau
          maxLength: 100
          minLength: 1
          type: string
        public_key:
          additionalProperties: {}
          description: Its public key as a JWK (RFC 7517), never the private key.
          type: object
        scopes:
          description: What its tokens may do, from GET /v1/api-clients/scopes.
          examples:
            - - directory.read
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - scopes
        - algorithm
        - public_key
      type: object
    CreatePersonInputBody:
      additionalProperties: false
      properties:
        classification:
          $ref: "#/components/schemas/Classification"
          description: Their legal classification, from their start date.
        id:
          description: The new person's ID, chosen by the caller so a repeat is refused, not done twice.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: Their first job, from their start date.
        person:
          $ref: "#/components/schemas/PersonInput"
          description: Their own fields.
      required:
        - id
        - person
        - job
      type: object
    DirectoryEntry:
      additionalProperties: false
      properties:
        department:
          description: Their department on the day asked.
          examples:
            - Engineering
          type: string
        id:
          description: The person's ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        job_title:
          description: Their job title on the day asked.
          examples:
            - Engineer
          type: string
        manager_id:
          description: Their line manager's ID on the day asked.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e62
          format: uuid
          type: string
        manager_name:
          description: Their line manager's name.
          examples:
            - Ben Lim
          type: string
        name:
          description: The legal name.
          examples:
            - Ana Tan
          type: string
        preferred_name:
          description: The name they go by.
          examples:
            - Anna
          type: string
        work_email:
          description: Their work email.
          examples:
            - ana@acme.example
          type: string
      required:
        - id
        - name
      type: object
    DirectoryOutputBody:
      additionalProperties: false
      properties:
        people:
          description: Everyone who works for the organisation on the day, by name.
          items:
            $ref: "#/components/schemas/DirectoryEntry"
          type:
            - array
            - "null"
      required:
        - people
      type: object
    ErrorsOutputBody:
      additionalProperties: false
      properties:
        codes:
          description: Every stable error code, in order.
          items:
            $ref: "#/components/schemas/Code"
          type:
            - array
            - "null"
      required:
        - codes
      type: object
    Feature:
      additionalProperties: false
      properties:
        external_system:
          description: The system that holds its data, when external.
          examples:
            - Acme Payroll
          type: string
        id:
          description: The feature's key.
          examples:
            - leave
          type: string
        name:
          description: As the screen names it.
          examples:
            - Leave
          type: string
        needs:
          description: The features that must be on, or external, for this one to be on.
          items:
            type: string
          type:
            - array
            - "null"
        phase:
          description: When it is built; a feature of a later phase cannot be switched on yet.
          enum:
            - P1
            - P2
            - P3
          examples:
            - P1
          type: string
        state:
          description: On, off, or held by another system.
          enum:
            - "on"
            - "off"
            - external
          examples:
            - "on"
          type: string
      required:
        - id
        - name
        - phase
        - state
        - needs
      type: object
    FeaturesOutputBody:
      additionalProperties: false
      properties:
        features:
          description: Every optional feature, in the order the screen shows them. People records is always on and is not listed.
          items:
            $ref: "#/components/schemas/Feature"
          type:
            - array
            - "null"
      required:
        - features
      type: object
    FieldProblem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_INVALID
          type: string
        field:
          description: "The JSON path of the field: in the request body (body.…), the query (query.…), the path (path.…) or a header (header.…)."
          examples:
            - path.code
          type: string
        fix:
          description: How to fix it.
          examples:
            - Error codes look like NM_NOT_FOUND.
          type: string
        message:
          description: What is wrong with it.
          examples:
            - is not an error code
          type: string
      required:
        - code
        - field
        - message
        - fix
      type: object
    InfoOutputBody:
      additionalProperties: false
      properties:
        service:
          description: The service this answers as.
          examples:
            - nemura-api
          type: string
        version:
          description: The build's version.
          examples:
            - 0.1.0
          type: string
      required:
        - service
        - version
      type: object
    Item:
      additionalProperties: false
      properties:
        arrangement:
          description: How it will be handled instead.
          examples:
            - Approved in the old system until 31 Jan
          maxLength: 500
          type: string
        what:
          description: The outstanding thing, as the refusal named it.
          examples:
            - leave requests waiting for approval
          type: string
      required:
        - what
        - arrangement
      type: object
    Job:
      additionalProperties: false
      properties:
        department:
          description: The department.
          examples:
            - Engineering
          type: string
        effective_from:
          description: The day this job record starts.
          examples:
            - "2026-04-01"
          format: date
          type: string
        effective_to:
          description: The day it ends (the day the next starts); empty while current.
          examples:
            - "2026-09-01"
          format: date
          type: string
        employment_type:
          description: The kind of employment.
          enum:
            - full_time
            - part_time
            - contract
            - intern
          examples:
            - full_time
          type: string
        job_title:
          description: The job title.
          examples:
            - Senior Engineer
          type: string
        manager_id:
          description: The line manager's person ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e62
          format: uuid
          type: string
        worksite:
          description: The worksite's country code and optional region.
          examples:
            - SG
          type: string
      required:
        - effective_from
        - job_title
        - worksite
        - employment_type
      type: object
    JobInput:
      additionalProperties: false
      properties:
        department:
          description: The department.
          examples:
            - Engineering
          maxLength: 200
          type: string
        employment_type:
          description: The kind of employment.
          enum:
            - full_time
            - part_time
            - contract
            - intern
          examples:
            - full_time
          type: string
        job_title:
          description: The job title.
          examples:
            - Engineer
          maxLength: 200
          minLength: 1
          type: string
        manager_id:
          description: The line manager's person ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e62
          format: uuid
          type: string
        worksite:
          description: The worksite's country code and optional region.
          examples:
            - SG
          type: string
      required:
        - job_title
        - worksite
        - employment_type
      type: object
    PersonInput:
      additionalProperties: false
      properties:
        employment_start:
          description: The first day of employment.
          examples:
            - "2026-01-05"
          format: date
          type: string
        leaving_date:
          description: The last day, once it is known.
          examples:
            - "2026-12-31"
          format: date
          type: string
        leaving_reason:
          description: Why they left.
          examples:
            - Resigned
          maxLength: 500
          type: string
        legal_name:
          description: The legal name.
          examples:
            - Ana Tan
          maxLength: 200
          minLength: 1
          type: string
        phone:
          description: The phone number.
          examples:
            - +65 6000 0000
          maxLength: 40
          type: string
        preferred_name:
          description: The name they go by.
          examples:
            - Anna
          maxLength: 200
          type: string
        probation_end:
          description: The day probation ends.
          examples:
            - "2026-04-05"
          format: date
          type: string
        work_email:
          description: The work email.
          examples:
            - ana@acme.example
          maxLength: 254
          type: string
      required:
        - legal_name
        - employment_start
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code (ENG-23).
          examples:
            - NM_NOT_FOUND
          type: string
        detail:
          description: What went wrong this time, in plain English.
          examples:
            - There is no error code NM_NOPE.
          type: string
        errors:
          description: Every invalid field, all at once.
          items:
            $ref: "#/components/schemas/FieldProblem"
          type:
            - array
            - "null"
        fix:
          description: How to fix it.
          examples:
            - Choose a code from the catalogue at GET /v1/errors.
          type: string
        status:
          description: The HTTP status code.
          examples:
            - 404
          format: int64
          type: integer
        title:
          description: A short summary of the problem type; it never changes between occurrences.
          examples:
            - Not found
          type: string
        type:
          description: A URI naming the problem; one per code.
          examples:
            - urn:nemura:problem:NM_NOT_FOUND
          format: uri
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
    Provider:
      additionalProperties: false
      properties:
        id:
          description: The provider's ID, passed to /auth/signin.
          examples:
            - google
          type: string
        name:
          description: As the sign-in page names it.
          examples:
            - Google
          type: string
      required:
        - id
        - name
      type: object
    Record:
      additionalProperties: false
      properties:
        classification:
          $ref: "#/components/schemas/Classification"
          description: Their legal classification on the day asked; only the people team sees it.
        employment_start:
          description: The first day of employment.
          examples:
            - "2026-01-05"
          format: date
          type: string
        has_login:
          description: Whether the person has a login to Nemura.
          examples:
            - true
          type: boolean
        id:
          description: The person's ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        jobs:
          description: Their job history, oldest first.
          items:
            $ref: "#/components/schemas/Job"
          type:
            - array
            - "null"
        leaving_date:
          description: The last day, once it is known.
          examples:
            - "2026-12-31"
          format: date
          type: string
        leaving_reason:
          description: Why they left.
          examples:
            - Resigned
          type: string
        legal_name:
          description: The legal name.
          examples:
            - Ana Tan
          type: string
        phone:
          description: The phone number.
          examples:
            - +65 6000 0000
          type: string
        preferred_name:
          description: The name they go by.
          examples:
            - Anna
          type: string
        probation_end:
          description: The day probation ends.
          examples:
            - "2026-04-05"
          format: date
          type: string
        work_email:
          description: The work email.
          examples:
            - ana@acme.example
          type: string
      required:
        - id
        - legal_name
        - employment_start
        - has_login
        - jobs
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        credential:
          additionalProperties: {}
          description: The PublicKeyCredential the browser returned, as JSON.
          type: object
        name:
          description: What the person calls this passkey.
          examples:
            - My laptop
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
        - credential
      type: object
    RegisteredOutputBody:
      additionalProperties: false
      properties:
        id:
          description: The new passkey.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e50
          format: uuid
          type: string
      required:
        - id
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        landing:
          description: "The page the person lands on: /people for the people team, /me for everyone else."
          examples:
            - /people
          type: string
        member_id:
          description: The person who is signed in.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e45
          format: uuid
          type: string
        organisation_id:
          description: The organisation the session is in.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e44
          format: uuid
          type: string
        roles:
          description: The roles the person holds today, from PRD-002 Appendix B.
          examples:
            - - hr_admin
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - organisation_id
        - member_id
        - roles
        - landing
      type: object
    SetClassificationInputBody:
      additionalProperties: false
      properties:
        classification:
          $ref: "#/components/schemas/Classification"
          description: The new classification.
        effective_from:
          description: The day the new classification starts; the current one ends that day.
          examples:
            - "2026-09-01"
          format: date
          type: string
      required:
        - effective_from
        - classification
      type: object
    SetFeatureInputBody:
      additionalProperties: false
      properties:
        arrangements:
          description: A replacement arrangement for each outstanding thing, when the feature is switched off or handed to another system.
          items:
            $ref: "#/components/schemas/Item"
          type:
            - array
            - "null"
        external_system:
          description: "The system that holds the data: when the state is external, and only then."
          examples:
            - Acme Payroll
          maxLength: 100
          type: string
        state:
          description: The state to set.
          enum:
            - "on"
            - "off"
            - external
          examples:
            - "on"
          type: string
      required:
        - state
      type: object
    SignInOutputBody:
      additionalProperties: false
      properties:
        providers:
          description: The providers people may sign in with, in the order to offer them.
          items:
            $ref: "#/components/schemas/Provider"
          type:
            - array
            - "null"
        setup_done:
          description: "False until first-run setup has made the first organisation: the sign-in page then says Nemura is not set up."
          examples:
            - true
          type: boolean
      required:
        - providers
        - setup_done
      type: object
info:
  contact:
    name: Nemura
    url: https://github.com/cognizhi/fyniq
  description: |-
    Nemura's public API: the optional people platform of PRD-002. Its web app uses only this API (QA-API-03).

    Conventions (PRD-002 NM-ARC-03, PRD-001 §8.18.1):
    - Errors are RFC 9457 problem details (application/problem+json) with a stable code from the catalogue at GET /v1/errors, what is
      wrong, and how to fix it; validation errors list every invalid field at once.
    - Every POST that creates or changes state accepts an Idempotency-Key header: a repeat returns the original response, and the same
      key with a different request returns 422.
    - Versioned records return an ETag; commands that change one require If-Match and return 412 when the record changed since, 428
      without it.
    - Changes inside /v1 are additive: a field, an operation or an enum value may be added, and nothing is removed or changed in meaning.
    - Money is a decimal string with its currency, never a JSON number; dates are ISO 8601; IDs are UUIDv7 strings.
  license:
    identifier: MIT
    name: MIT
  title: Nemura API
  version: 0.1.0 # x-release-please-version
openapi: 3.1.0
paths:
  /v1/api-clients:
    get:
      description: "Lists the organisation's live API clients: name, scopes and OAuth client ID, never a key. Only the Owner. It changes nothing."
      operationId: listApiClients
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List the API clients
      tags:
        - API clients
    post:
      description: Registers a system that calls Nemura's API on its own with the client-credentials grant, signing in with the key pair it holds (private_key_jwt), for the API's audience and the scopes given. Only the Owner, confirmed with a passkey in the last five minutes. It is audited; the private key never reaches Nemura.
      operationId: createApiClient
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Register an API client
      tags:
        - API clients
  /v1/api-clients/{id}:
    delete:
      description: "Revokes a client: its tokens are deleted and it can sign in no more. Only the Owner, confirmed with a passkey in the last five minutes. It is audited. A client that is not registered is NM_NOT_FOUND."
      operationId: revokeApiClient
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
        - description: The client to revoke.
          in: path
          name: id
          required: true
          schema:
            description: The client to revoke.
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e60
            format: uuid
            type: string
      responses:
        "204":
