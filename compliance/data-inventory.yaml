# Fyniq's personal-data inventory (PRD-001 CMP-PD-02, rev 0.244; p1-pdpa-retention design D3): each class of personal
# data Fyniq holds, what it is, why, where, who reads it, how long it is kept, how it is protected and where it goes
# abroad. TestTheDataInventory keeps it complete: every column of the schema whose name looks personal is in a class or
# in not_personal, with why. The flows are how the data leaves Fyniq for a provider; each that leaves Singapore needs a
# current transfer assessment in the organisation's register (CMP-PD-06). The organisation adds what it processes
# outside Fyniq, and its own transfers, in the app.
schema: fyniq-data-inventory@1
classes:
  - key: members
    what: "Members' names, sign-in email addresses, roles, invitations and requests to join, and the email addresses notifications go to"
    why: "To let people sign in and do their work, to name who did what, and to tell them what waits for them"
    where: "The database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "Appendix D's Users, roles, team mode; every member sees colleagues' names; notifications reach their own member"
    retention: "While a member; their name stays in the records and the audit trail for the records' retention (retention.records_years)"
    protection: "The audit trail's personal values are shreddable per person and financial year (§11.8)"
    transfers: "Emails go through the deployment's email provider, and sign-in through its sign-in providers: the flows email and sign-in"
    columns: [app_user.display_name, user_identity.email, user_session.email, member_invitation.display_name, join_request.display_name,
      join_request.email, notification.email, notification_preference.email]
  - key: sign-in-security
    what: "Each sign-in's IP address and browser, sessions, passkeys and recovery codes"
    why: "To keep accounts secure and to investigate a security event"
    where: "The database, in Singapore; the IP address and browser beside the audit trail"
    who: "The member themselves; the audit trail's readers see security events (Appendix D's Audit trail)"
    retention: "IP addresses and browsers retention.security_events_days (400), then erased (AUD-06); sessions until they expire"
    protection: "Erased with a signed register entry; recovery codes and passkeys are kept only as hashes and public keys"
    transfers: "None"
    columns: [audit_request_detail.ip, audit_request_detail.user_agent, user_session.user_agent]
  - key: contacts
    what: "The names, email addresses, phone numbers and addresses of customers' and suppliers' contacts, and of contacts who are individuals"
    why: "To quote, invoice, pay and be paid, to remind and to keep the records the law requires"
    where: "The database, in Singapore; issued documents in the document store, in Singapore"
    who: "Appendix D's Contacts and items; the roles that send documents"
    retention: "The records' retention after the financial year's end (retention.records_years, 7 years), then purged with the documents"
    protection: "Mostly business contact information; an individual's values in the audit trail are shreddable (§11.8)"
    transfers: "Emails go through the deployment's email provider: the flow email"
    columns: [contact.legal_name, contact.address, contact.billing_email, contact.remittance_email, contact.phone, document_send.recipient,
      email_message.recipient, email_event.recipient, email_suppression.address]
  - key: email-in
    what: "The email addresses that send documents to the organisation's capture address"
    why: "To accept bills and receipts only from known senders"
    where: "The database, in Singapore"
    who: "Appendix D's Organisation integrations"
    retention: "While the sender is allowed"
    protection: "None beyond the database's"
    transfers: "None"
    columns: [capture_sender.address]
  - key: bank-accounts
    what: "The bank accounts Fyniq pays people to: claimants, and individual suppliers"
    why: "To repay expense claims and pay bills"
    where: "The database, in Singapore"
    who: "Appendix D's Vendor bank details and Payment batches; masked for everyone else"
    retention: "The records' retention"
    protection: "Sealed under the deployment's key (SEC-11), shown as the last four digits, proved by fingerprint in the audit trail (AUD-02)"
    transfers: "The bank file goes to the organisation's bank, in Singapore"
    columns: [payee_bank_account.number_sealed, payee_bank_account.number_last4, payee_bank_account.number_fingerprint]
  - key: consent
    what: "Who gave or withdrew consent for a purpose"
    why: "To use personal data for a purpose that needs consent only while it stands (CMP-PD-03)"
    where: "The database, in Singapore"
    who: "Appendix D's Data protection (PDPA)"
    retention: "The records' retention"
    protection: "None beyond the database's"
    transfers: "None"
    columns: [consent_record.person]
  - key: pdpa-requests
    what: "Access and correction requests: who asked, how to reach them, what they asked and how it was answered"
    why: "To answer each request within the law's time and to show it was (CMP-PD-04)"
    where: "The database, in Singapore"
    who: "Appendix D's Data protection (PDPA); a member sees their own"
    retention: "The records' retention"
    protection: "Read only by the Compliance officer, the Owner and the Auditor"
    transfers: "None"
    columns: [pd_request.requester, pd_request.subject, pd_request.details]
  - key: breaches
    what: "Personal-data breaches: what happened, how many people, the kinds of data involved, and each step taken"
    why: "To assess and report each breach within the law's time, and to show it was (CMP-PD-05)"
    where: "The database, in Singapore"
    who: "Appendix D's Data protection (PDPA)"
    retention: "The records' retention"
    protection: "Read only by the Compliance officer, the Owner and the Auditor"
    transfers: "None; a notifiable breach is reported to the PDPC outside Fyniq"
    columns: [pd_breach.description]
  - key: incidents
    what: "Security incidents: what happened and each step of the response, which may name the people involved"
    why: "To contain, assess, notify, recover and learn from each incident, and to show it was done (SEC-32)"
    where: "The database, in Singapore"
    who: "Appendix D's Compliance Center: kept by the DPO"
    retention: "The records' retention"
    protection: "Read only by the Compliance Center's readers; never a secret, a token, a full NRIC or a bank number (SEC-15)"
    transfers: "None"
    columns: [security_incident.summary, security_incident_step.note]
  - key: organisation-contacts
    what: "The company's own published contacts, its Data Protection Officer's name and email among them"
    why: "To print them on documents and give them to people who ask about their personal data (PDPA s11(5))"
    where: "The database, in Singapore"
    who: "Everyone who can read the organisation's profile"
    retention: "While they are the company's"
    protection: "Business contact information"
    transfers: "None"
    columns: [organisation.email, organisation.phone, organisation.dpo_name, organisation.dpo_email]
  - key: files
    what: "Receipts, bills and other files attached as evidence, which may show personal data"
    why: "To support each record, as the law requires"
    where: "The document store, in Singapore, each file retention-locked"
    who: "Appendix D's Evidence"
    retention: "Each file's retain-until, from the records' retention"
    protection: "A file that shows an NRIC or FIN in full is flagged when attached (FR-DOC-09)"
    transfers: "None"
    columns: [evidence.nric_flagged]
  - key: corporate-officers
    what: "The company's officers (directors, the secretary, the CEO and auditors): their names, the last 4 characters of an individual's identifier, the days they were appointed and ceased, whether a director is a nominee and for whom, and the member they sign in as; and the registers of nominee directors and shareholders: whom each acts for, since when and the days the company and ACRA were told; and the corporate documents drafted from Fyniq's templates (resolutions, notices, minutes), which name the directors, members and people present"
    why: "To keep the corporate profile ACRA's registers mirror, its lodgement deadlines, the company secretary's checks and the papers the company signs (FR-CS-01, FR-CS-05, FR-CS-06)"
    where: "The database, in Singapore, in the corporate_officer, nominee_entry and corporate_document documents' versions and the officers typed in from ACRA's business profile (acra_extract); their evidence (consents to act, nominees' notices, BizFile+ acknowledgements) in the document store"
    who: "Appendix D's Corporate profile and registers (rev 0.282): the Accountant prepares, the Owner and the Finance controller approve, the Auditor, the Tax agent and the Board viewer view, the DPO views masked; the AI within the user's rights"
    retention: "The records' retention (retention.records_years), as the registers ACRA keeps them for"
    protection: "Never a full NRIC or FIN: only its last 4 characters, refused in full by the database (FY353, FY354, FY356, SEC-15); the DPO reads the identifiers masked, and sees what each corporate document is, not its text; recorded versions never change"
    transfers: "None"
    columns: [document_version.payload]
  - key: workbook-migration
    what: "The finance workbook uploaded for the move to Fyniq: its employees' names, departments and monthly pay, and its contacts and records"
    why: "To import the books and prove the import against the workbook (FR-MIG-01, FR-MIG-02, §17.1)"
    where: "The staging store, in Singapore, under the migration's own prefix; archived under retention as M1's evidence at go-live (M6)"
    who: "Appendix D's Workbook import (migration): the Finance controller and the Accountant upload it; the Owner and the Auditor read the migration"
    retention: "Until go-live archives it under the records' retention (retention.records_years); the per-employee rows are never imported (rev 0.254)"
    protection: "Scanned for malware and hashed when uploaded (FR-DOC-08), marked payroll, and read only by the import's validation; the AI has no right on it"
    transfers: "None"
    columns: [migration_file.data_class]
  - key: ai-conversations
    what: "Members' questions to the assistant and its answers, the reads each made, and their ratings with the reasons given"
    why: "To answer each person in their own conversation, to keep the AI activity log (AI-12), and to review answers for the evals (QA-AI-05)"
    where: "The database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "Each member their own conversations; the AI activity log's readers the turns, the Owner and the DPO everyone's; the Owner and an Administrator the feedback they review"
    retention: "Until its person deletes it, or retention.ai_conversations_days after its last question, then purged daily (AI-P8)"
    protection: "NRIC and FIN numbers, bank account numbers, secrets and home addresses never reach a model, nor payroll unless the organisation allows it (AI-02, AI-20); a turn that read payroll is masked to a reader who may not see payroll"
    transfers: "Model calls only: the flow ai-models"
    columns: [ai_turn.question, ai_turn.answer, ai_feedback.reason]
  - key: ai-proposals
    what: "The changes the AI proposed: each task type's payload, the AI's rationale and evidence, the dry run, who it acted for, who decided and how it ran"
    why: "So a person approves exactly what executes, and each AI-proposed change keeps the record of its decision (AI-P3 to AI-P5, AI-12)"
    where: "The database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "Each member the proposals made for them and those they may approve; the Owner and the DPO every one"
    retention: "Kept with the organisation's records: nothing removes a proposal, as a decision's record (§9.5) [counsel to confirm]"
    protection: "Only catalogue task types, from what the AI read without NRIC and FIN numbers, bank account numbers, secrets and home addresses (AI-02, AI-20); the audit trail keeps the payload's hash, not the payload"
    transfers: "None"
    columns: [ai_proposal.payload, ai_proposal.rationale, ai_proposal.reason]
  - key: agent-runs
    what: "The scheduled agents' runs: what triggered each, the Owner it acted for, what it read, its findings, Fyniq's summary and the model's words"
    why: "To report on the company's obligations on a schedule and keep each run reproducible (AI-64, AI-65), and to see a run that failed or was late (AI-67)"
    where: "The database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "The Owner, the Company secretary and those its recipients name; the AI activity log's readers"
    retention: "Kept with the organisation's records: a run's report is its record (§9.12) [counsel to confirm]"
    protection: "A run reads as the Owner it acts for, within its agent's profile, without NRIC and FIN numbers, bank account numbers, secrets and home addresses, and payroll only when the organisation allows it (AI-02, AI-63); its findings name records, never their values"
    transfers: "Model calls only, when its model step runs: the flow ai-models"
    columns: [agent_run.findings, agent_run.summary, agent_run.model_text]
  - key: knowledge-base
    what: "The organisation's own knowledge base: the notes, policies and decisions its administrators write, and the pages, with every version and snapshot, the assistant reads to explain how the company decides things"
    why: "So the assistant answers how-to and policy questions from what the company decided, in words a person approved (AI-50, AI-56)"
    where: "The database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "The Owner and the Administrator write and publish; the Auditor reads; the assistant reads published pages only, within what the person asking may read (AI-54)"
    retention: "Kept with the organisation's records: a version and a snapshot are never changed or removed (AI-56) [counsel to confirm]"
    protection: "A note refuses what looks like an identity number, a bank account number or a secret; a page inherits the strictest data class of its sources and is read only by those who may read that class; nothing is published without a person's approval"
    transfers: "Model calls only, when the compiler runs: the flow ai-models"
    columns: [kb_note.body, kb_page_version.body]
  - key: compliance-tasks
    what: "The tasks the scheduled agents' findings and their approved proposals raise: what to do, by when, who owns it, who closed it and why"
    why: "So each finding has one task a named person sees through (AI-65)"
    where: "The database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "Those with a view of the AI company secretary's row; the Owner and the Administrator close them"
    retention: "Kept with the organisation's records: a closed task is the record of what was done [counsel to confirm]"
    protection: "A task names its finding and its owner, never an identity number or a bank account number"
    transfers: "None"
    columns: [compliance_task.title, compliance_task.detail, compliance_task.reason]
flows:
  - key: ai-models
    what: "The assistant's model calls to the organisation's AI connections: under preset A, the default at go-live, Claude on Google Cloud's Agent Platform in Singapore (asia-southeast1), under Google Cloud's terms (AI-05, ADR-T2)"
    data: "What a question reads of the books, as its person may read it, without NRIC and FIN numbers, bank account numbers, secrets and home addresses, and payroll only when the organisation allows it. The AI path covers model calls only"
    classes: [ai-conversations, contacts, members]
    cross_border: false
    note: "A route outside Singapore (preset B, or another provider's connection) needs a transfer assessment first (CMP-PD-06); the pre-go-live check (G4-087, docs/runbooks/ai-go-live.md) confirms the endpoint and the models [live-verify]"
  - key: sign-in
    what: "Sign-in through the deployment's sign-in providers: Google, Zoho or another OpenID Connect provider"
    data: "Members' names and sign-in email addresses, and each sign-in"
    classes: [members]
    cross_border: true
    note: "Zoho's sign-in runs in the United States (PRD-001 ADR-T2, option A); where each provider processes [live-verify]"
  - key: email
    what: "Email sent through the deployment's email providers: Zoho ZeptoMail or Resend"
    data: "Recipients' names and email addresses, and the messages: notifications, documents and reminders"
    classes: [members, contacts]
    cross_border: true
    note: "The email providers keep mail outside Singapore (FR-INT-21); where each processes [live-verify]"
not_personal:
  - column: ai_reservation.person
    why: "Names who an AI call ran for by user ID, or a system job, never by name: what a person's AI budget counts (AI-77)"
  - column: person_key.person
    why: "Names a member or contact by ID, never by name: whose key seals their values in the audit trail (§11.8)"
  - column: pd_transfer.recipient
    why: "The provider an overseas transfer goes to: an organisation"
  - column: claim_place.address
    why: "A place where claims are spent, such as a merchant"
  - column: private_endpoint.address
    why: "The private network address of a service an organisation runs, such as its ledger API (SEC-37): never a person's"
  - column: email_sender.address
    why: "The organisation's own sending address"
  - column: email_sender.display_name
    why: "The organisation's own sender name"
  - column: organisation.legal_name
    why: "The company's name"
  - column: organisation.registered_address
    why: "The company's registered office"
  - column: organisation.mailing_address
    why: "The company's mailing address"
  - column: organisation.bank_account_name
    why: "The company's own bank account"
  - column: organisation.bank_account_number
    why: "The company's own bank account"
not_held:
  - key: nric
    what: "NRIC and FIN numbers"
    why: "Fyniq collects none: payroll's live in Nemura (PRD-002). A holder record refuses one in full (FY285), and a file that shows one is flagged (FR-DOC-09)"
  - key: card-data
    what: "Payment card numbers and their security codes"
    why: "Card payments go through a provider's hosted pages, so Fyniq holds no card data (SEC-14)"
