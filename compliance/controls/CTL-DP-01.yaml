# CTL-DP-01: PRD-001 Appendix F (F.5). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-DP-01
section: "F.5"
control: "CMEK on database, storage and backups; key rotation"
mapping: "ISO 8.24; SOC2 C1"
automated_check: "Daily config check (`gcp.restrictNonCmekServices`)"
frequency: "D"
evidence: "Config snapshot"
owner: DPO
checks:
  - frequency: D
    status: cloud
    how: "tofu org-policy/the_policies_of_section_12_4"
    evidence: "the organisation policy requires customer-managed keys for the database and storage in staging and production; read in the cloud [live-verify]"
  - frequency: D
    status: cloud
    how: "tofu environment/the_data_is_encrypted_and_recoverable"
    evidence: "the database, its backups and the secrets are under customer-managed keys that rotate every 90 days; read in the cloud [live-verify]"
