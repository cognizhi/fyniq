                $ref: "#/components/schemas/OneTimeCode"
          description: Created
          headers:
            RateLimit:
              description: What is left of the limit (r) and the seconds until the window ends (t).
              schema:
                examples:
                  - "\"reads\";r=599;t=42"
                type: string
            RateLimit-Policy:
              description: "The client's limits a minute in this organisation: reads (GET) or writes (FR-INT-16; draft-ietf-httpapi-ratelimit-headers)."
              schema:
                examples:
                  - "\"reads\";q=600;w=60"
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: `API-AUTH-01` Sign-in required."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: `API-AUTH-02` Sent from another site; `API-AUTHZ-01` Not allowed for your roles; `API-AUTHZ-02` No organisation; `API-AUTHZ-03` Operation not authorised; `API-AUTHZ-04` A person must be signed in; `API-AUTHZ-05` Step-up required; `API-AUTHZ-06` Not a Super admin."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Conflict: `API-SUPERADMIN-02` Super admin change refused."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: `API-INPUT-02` A field is not valid."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Too Many Requests: `API-RATE-01` Too many requests."
          headers:
            RateLimit:
              description: What is left of the limit (r) and the seconds until the window ends (t).
              schema:
                examples:
                  - "\"reads\";r=599;t=42"
                type: string
            RateLimit-Policy:
              description: "The client's limits a minute in this organisation: reads (GET) or writes (FR-INT-16; draft-ietf-httpapi-ratelimit-headers)."
              schema:
                examples:
                  - "\"reads\";q=600;w=60"
                type: string
            Retry-After:
              description: Seconds to wait before sending the request again.
              schema:
                examples:
                  - "42"
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: `API-FAILURE-01` Something went wrong."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: `API-UNAVAILABLE-01` Not available here."
