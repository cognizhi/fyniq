[project]
name = "fyniq"
version = "0.0.0"
description = "The Python client of the Fyniq /v1 API (PRD-001 FR-INT-17), generated from contracts/openapi/fyniq.v1.yaml, with idempotency keys, retries, problem details, ETags, previews and cursor lists."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fyniq"]
