# The contract of Nemura's public API (PRD-002 NM-ARC-03, ADR-N1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    AIAnswer:
      additionalProperties: false
      properties:
        dropped:
          description: How many tools the model named that were refused.
          examples:
            - 0
          format: int64
          type: integer
        refused:
          description: "True when the question asks for something the assistant never does: it approves, changes, issues, pays and reads another person's records never."
          examples:
            - false
          type: boolean
        segments:
          description: The answer, sentence by sentence.
          items:
            $ref: "#/components/schemas/AISegment"
          type:
            - array
            - "null"
        tools:
          description: The read tools that ran, all as the person asking.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - segments
        - tools
        - refused
        - dropped
      type: object
    AIDecision:
      additionalProperties: false
      properties:
        approve:
          description: Approve the draft, or not.
          examples:
            - true
          type: boolean
        final_payload:
          additionalProperties: {}
          description: "The text to approve, after editing: it must fit the task's shape. Left out, the assistant's own text is approved."
          type: object
        reason:
          description: Required to reject.
          examples:
            - Not needed.
          maxLength: 500
          type: string
      required:
        - approve
      type: object
    AIDraft:
      additionalProperties: false
      properties:
        applied_at:
          description: When it was attached.
          examples:
            - "2026-11-20T10:00:00Z"
          format: date-time
          type: string
        id:
          description: The draft.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1fa0
          format: uuid
          type: string
        kind:
          description: A letter's fields or a reply's words.
          enum:
            - letter
            - flex_reply
          examples:
            - letter
          type: string
        payload:
          additionalProperties: {}
          description: The approved text, exactly as approved.
          type: object
        proposal_id:
          description: The proposal it came from.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1f80
          format: uuid
          type: string
      required:
        - id
        - proposal_id
        - kind
        - payload
        - applied_at
      type: object
    AIDraftInput:
      additionalProperties: false
      properties:
        request_id:
          description: "The request the draft is for: still open."
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1f90
          format: uuid
          type: string
        task_type:
          description: "What to draft: a letter for a letter request, or a reply to a flexible-work request."
          enum:
            - people.draft_letter
            - people.draft_fwa_reply
          examples:
            - people.draft_letter
          type: string
      required:
        - task_type
        - request_id
      type: object
    AIDraftResult:
      additionalProperties: false
      properties:
        proposal_id:
          description: The proposal, waiting for a person to decide it.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1f80
          format: uuid
          type: string
      required:
        - proposal_id
      type: object
    AIProposal:
      additionalProperties: false
      properties:
        asker:
          description: The person the assistant acted for.
          examples:
            - Ana Tan
          type: string
        asker_id:
          description: Their login, so a page does not offer them a decision they cannot make.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e45
          format: uuid
          type: string
        created_at:
          description: When it was proposed.
          examples:
            - "2026-11-20T10:00:00Z"
          format: date-time
          type: string
        decided_by:
          description: The human who decided it.
          examples:
            - Mei Tan
          type: string
        decision_reason:
          description: Their reason.
          examples:
            - Not needed.
          type: string
        expired:
          description: "True when it waited more than 72 hours without a decision: it cannot be approved."
          examples:
            - false
          type: boolean
        expires_at:
          description: When it expires.
          examples:
            - "2026-11-23T10:00:00Z"
          format: date-time
          type: string
        final_payload:
          additionalProperties: {}
          description: What the human approved, after editing.
          type: object
        id:
          description: The proposal.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1f80
          format: uuid
          type: string
        model_id:
          description: The route that made it.
          examples:
            - scripted
          type: string
        payload:
          additionalProperties: {}
          description: What the assistant proposed.
          type: object
        rationale:
          description: Why, in the assistant's words.
          examples:
            - Filled from the record.
          type: string
        state:
          description: Where it is.
          enum:
            - pending
            - approved
            - rejected
            - applied
          examples:
            - pending
          type: string
        task_type:
          description: What kind of draft.
          examples:
            - people.draft_letter
          type: string
        what:
          description: What it proposes.
          examples:
            - A letter from a template for a request, with the fields filled from the record
          type: string
      required:
        - id
        - task_type
        - what
        - asker
        - asker_id
        - payload
        - model_id
        - state
        - expired
        - created_at
        - expires_at
      type: object
    AISegment:
      additionalProperties: false
      properties:
        sources:
          description: "Where it comes from: your own record, a pack version and its official source, or a rule."
          items:
            type: string
          type:
            - array
            - "null"
        text:
          description: A sentence. Every figure in it came from a tool in this turn; one that did not is replaced by 'an unverified figure'.
          examples:
            - You have 8.50 days left.
          type: string
      required:
        - text
        - sources
      type: object
    AISettings:
      additionalProperties: false
      properties:
        catalogue:
          description: Every task type the assistant may propose.
          items:
            $ref: "#/components/schemas/AITask"
          type:
            - array
            - "null"
        enabled:
          description: "Whether the assistant is on: off until the Owner turns it on."
          examples:
            - false
          type: boolean
        own_pay:
          description: "Whether own-pay explanations are on. They need the Owner and a second approver, which arrives with the Fyniq link: always false until then."
          examples:
            - false
          type: boolean
        own_pay_note:
          description: Why own pay is off.
          examples:
            - Needs the Owner and a second approver.
          type: string
        route:
          description: "The model route: none, or local mode's scripted model. A real route needs processing evidenced in Singapore."
          enum:
            - none
            - scripted
          examples:
            - none
          type: string
        task_types:
          description: The task types the Owner turned on; each is off until then.
          items:
            type: string
          type:
            - array
            - "null"
        updated_at:
          description: When the Owner last changed them.
          examples:
            - "2026-11-20T10:00:00Z"
          format: date-time
          type: string
      required:
        - enabled
        - route
        - task_types
        - own_pay
        - own_pay_note
        - catalogue
      type: object
    AISettingsInput:
      additionalProperties: false
      properties:
        enabled:
          description: Turn the assistant on or off.
          examples:
            - true
          type: boolean
        own_pay:
          description: Refused until a second approver exists.
          examples:
            - false
          type: boolean
        route:
          description: The model route.
          enum:
            - none
            - scripted
          examples:
            - scripted
          type: string
        task_types:
          description: The task types to turn on.
          examples:
            - - people.draft_letter
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - enabled
        - route
        - task_types
      type: object
    AITask:
      additionalProperties: false
      properties:
        approver_roles:
          description: The roles that decide a proposal of it.
          items:
            type: string
          type:
            - array
            - "null"
        expiry_hours:
          description: How long a proposal waits for a human.
          examples:
            - 72
          format: int64
          type: integer
        id:
          description: The task type.
          examples:
            - people.draft_letter
          type: string
        tier:
          description: "Tier 1: routine and reversible."
          examples:
            - 1
          format: int64
          type: integer
        what:
          description: What it proposes.
          examples:
            - A letter from a template for a request, with the fields filled from the record
          type: string
      required:
        - id
        - what
        - tier
        - approver_roles
        - expiry_hours
      type: object
    AccrualCountOutputBody:
      additionalProperties: false
      properties:
        lines:
          description: How many people have days on the accrual.
          examples:
            - 3
          format: int64
          type: integer
      required:
        - lines
      type: object
    AccrualInputBody:
      additionalProperties: false
      properties:
        month:
          description: The month, as 2026-05.
          examples:
            - 2026-05
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          type: string
      required:
        - month
      type: object
    AccrualLine:
      additionalProperties: false
      properties:
        annual_left:
          description: All annual leave left, for the accountant's information.
          examples:
            - "18.00"
          type: string
        carried_days:
          description: "Carried-forward annual leave untaken at the month's end: what the accrual recognises by default."
          examples:
            - "4.00"
          type: string
        id:
          description: The line.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1ed0
          format: uuid
          type: string
        person_id:
          description: The person.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        person_name:
          description: Their name.
          examples:
            - Ben Lim
          type: string
        state:
          description: A draft waiting for approval, or approved and ready for the Fyniq link.
          enum:
            - draft
            - approved
          examples:
            - draft
          type: string
      required:
        - id
        - person_id
        - person_name
        - state
        - carried_days
        - annual_left
      type: object
    AccrualListOutputBody:
      additionalProperties: false
      properties:
        lines:
          description: The month's accrual by person.
          items:
            $ref: "#/components/schemas/AccrualLine"
          type:
            - array
            - "null"
      required:
        - lines
      type: object
    AddDependantInputBody:
      additionalProperties: false
      properties:
        adoption_intent:
          description: The formal intent to adopt, when there is no date of birth yet.
          examples:
            - false
          type: boolean
        birth_date:
          description: The child's date of birth.
          examples:
            - "2025-05-06"
          format: date
          type: string
        citizenship:
          description: The child's citizenship.
          enum:
            - citizen
            - permanent_resident
            - other
          examples:
            - citizen
          type: string
        declared_on:
          description: The day the employee made the declaration.
          examples:
            - "2026-01-02"
          format: date
          type: string
        effective_from:
          description: The day the record starts.
          examples:
            - "2026-01-02"
          format: date
          type: string
        relationship:
          description: How the child is related.
          enum:
            - child
            - adopted_child
            - stepchild
          examples:
            - child
          type: string
      required:
        - relationship
        - citizenship
        - declared_on
        - effective_from
      type: object
    AddDocumentInputBody:
      additionalProperties: false
      properties:
        content_base64:
          description: The file, base64, up to 5 MB.
          examples:
            - JVBERi0xLjQK
          type: string
        content_type:
          description: Its media type.
          examples:
            - application/pdf
          type: string
        doc_type:
          description: The kind of document.
          enum:
            - contract
            - kets
            - letter
            - pass_copy
            - certificate
            - other
          examples:
            - contract
          type: string
        retention_class:
          description: The retention rule it falls under (a key of the retention schedule).
          examples:
            - employment-records
          type: string
        title:
          description: Its title.
          examples:
            - Employment contract
          maxLength: 200
          minLength: 1
          type: string
        viewers:
          description: The roles who may see it; employee means the person themselves.
          examples:
            - - hr_admin
              - employee
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - doc_type
        - title
        - retention_class
        - content_type
        - content_base64
        - viewers
      type: object
    AddPassInputBody:
      additionalProperties: false
      properties:
        expires_on:
          description: The day it expires.
          examples:
            - "2027-12-31"
          format: date
          type: string
        issued_on:
          description: The day it was issued.
          examples:
            - "2026-01-01"
          format: date
          type: string
        number:
          description: The pass number.
          examples:
            - EP12345678
          type: string
        pass_type:
          description: The kind of pass.
          enum:
            - employment_pass
            - s_pass
            - work_permit
            - dp_work_permit
          examples:
            - employment_pass
          type: string
      required:
        - pass_type
        - number
        - issued_on
        - expires_on
      type: object
    AdvertInputBody:
      additionalProperties: false
      properties:
        posted_on:
          description: The day the advert went up on MyCareersFuture.
          examples:
            - "2026-10-05"
          format: date
          type: string
        reference:
          description: The advert's reference.
          examples:
            - MCF-2026-0042
          maxLength: 100
          type: string
      required:
        - posted_on
      type: object
    AiAskInputBody:
      additionalProperties: false
      properties:
        question:
          description: "What to ask: about your own leave balance, your pay day, a rule of the Singapore pack or a line of your payslip."
          examples:
            - How much leave do I have left?
          maxLength: 1000
          minLength: 1
          type: string
      required:
        - question
      type: object
    AiDraftsOutputBody:
      additionalProperties: false
      properties:
        drafts:
          description: The drafts attached to the request, newest first.
          items:
            $ref: "#/components/schemas/AIDraft"
          type:
            - array
            - "null"
      required:
        - drafts
      type: object
    AiProposalsOutputBody:
      additionalProperties: false
      properties:
        proposals:
          description: Newest first, up to 200.
          items:
            $ref: "#/components/schemas/AIProposal"
          type:
            - array
            - "null"
      required:
        - proposals
      type: object
    AppliedOutputBody:
      additionalProperties: false
      properties:
        days:
          description: The days reserved for it.
          examples:
            - "5.00"
          type: string
        id:
          description: The new request.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e80
          format: uuid
          type: string
      required:
        - id
        - days
      type: object
    Availability:
      additionalProperties: false
      properties:
        available_hours:
          description: "The hours available: working days less days away, at the hours of a day."
          examples:
            - "154.00"
          type: string
        away_days:
          description: Of them, the days away on approved leave, sick leave or government-paid leave.
          examples:
            - "3.50"
          type: string
        hours_per_day:
          description: "Hours in a working day: the week's hours over the days worked."
          examples:
            - "8.80"
          type: string
        working_days:
          description: Working days by the person's pattern, public holidays left out.
          examples:
            - "21.00"
          type: string
      required:
        - working_days
        - away_days
        - hours_per_day
        - available_hours
      type: object
    AwayPerson:
      additionalProperties: false
      properties:
        from:
          description: Their first day away.
          examples:
            - "2026-04-06"
          format: date
          type: string
        name:
          description: The colleague.
          examples:
            - Ben Lim
          type: string
        to:
          description: Their last day away.
          examples:
            - "2026-04-08"
          format: date
          type: string
      required:
        - name
        - from
        - to
      type: object
    BankChange:
      additionalProperties: false
      properties:
        account_masked:
          description: The proposed account, masked.
          examples:
            - "****7890"
          type: string
        id:
          description: The change.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e73
          format: uuid
          type: string
        person_id:
          description: The person whose account it is.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        state:
          description: Where the change is.
          enum:
            - proposed
            - approved
            - refused
            - confirmed
          examples:
            - proposed
          type: string
      required:
        - id
        - person_id
        - account_masked
        - state
      type: object
    BankReconfirmView:
      additionalProperties: false
      properties:
        found_at:
          description: When Fyniq's answer showed it.
          examples:
            - "2026-11-25T09:00:00Z"
          format: date-time
          type: string
        held_version:
          description: The bank-detail version Fyniq holds.
          examples:
            - 2
          format: int64
          type: integer
        nemura_version:
          description: Nemura's own version when this was found.
          examples:
            - 1
          format: int64
          type: integer
        person_id:
          description: The person.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
      required:
        - person_id
        - held_version
        - nemura_version
        - found_at
      type: object
    CalendarEntry:
      additionalProperties: false
      properties:
        date:
          description: The day.
          examples:
            - "2026-05-04"
          format: date
          type: string
        kind:
          description: A public holiday as the person observes it; away with no type; approved leave with its type; a request waiting; sick leave (the person and the HR officer and administrator only).
          enum:
            - holiday
            - away
            - leave
            - pending
            - sick
          examples:
            - away
          type: string
        label:
          description: The holiday's name, the leave type, or Away.
          examples:
            - Away
          type: string
      required:
        - date
        - kind
        - label
      type: object
    CalendarPerson:
      additionalProperties: false
      properties:
        entries:
          description: What falls on their days this month, by date.
          items:
            $ref: "#/components/schemas/CalendarEntry"
          type:
            - array
            - "null"
        name:
          description: Their name.
          examples:
            - Ben Lim
          type: string
        person_id:
          description: The person.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        weekdays:
          description: "The days they work, ISO: 1 Monday to 7 Sunday; none when no pattern is set."
          examples:
            - - 1
              - 2
              - 3
              - 4
              - 5
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - person_id
        - name
        - weekdays
        - entries
      type: object
    CarryOutputBody:
      additionalProperties: false
      properties:
        carried:
          description: The days carried into the next year; zero when nothing was unused or all was carried already.
          examples:
            - "5.00"
          type: string
      required:
        - carried
      type: object
    CertificateInputBody:
      additionalProperties: false
      properties:
        content_base64:
          description: The photo or e-MC, base64, up to 5 MB.
          examples:
            - /9j/4AAQ
          type: string
        content_type:
          description: The file's media type.
          examples:
            - image/jpeg
          type: string
        issuer:
          description: The clinic, hospital or doctor on the certificate.
          examples:
            - Raffles Medical Clinic
          maxLength: 200
          minLength: 1
          type: string
      required:
        - issuer
        - content_type
        - content_base64
      type: object
    ChangeEvidence:
      additionalProperties: false
      properties:
        content_base64:
          description: The file, base64-encoded; up to 5 MB.
          examples:
            - JVBERi0x
          type: string
        content_type:
          description: The file's type.
          examples:
            - application/pdf
          type: string
        title:
          description: What the file is.
          examples:
            - Deed poll
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - content_type
        - content_base64
      type: object
    ChangeJobInputBody:
      additionalProperties: false
      properties:
        effective_from:
          description: The day the new job record starts; the current one ends that day.
          examples:
            - "2026-09-01"
          format: date
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: The new job record.
      required:
        - effective_from
        - job
      type: object
    ChecksOutputBody:
      additionalProperties: false
      properties:
        findings:
          description: What the people checks found, ✖ first.
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
      required:
        - findings
      type: object
    ClaimEventInputBody:
      additionalProperties: false
      properties:
        amount:
          description: SGD received, for a receipt; none for a rejection.
          examples:
            - "2500.00"
          type: string
        kind:
          description: A receipt of some or all of the amount, or a rejection.
          enum:
            - receipt
            - rejection
          examples:
            - receipt
          type: string
        note:
          description: What the portal said.
          examples:
            - Paid in two parts.
          maxLength: 500
          type: string
        "on":
          description: The day it happened.
          examples:
            - "2026-08-10"
          format: date
          type: string
      required:
        - kind
        - "on"
      type: object
    ClaimInputBody:
      additionalProperties: false
      properties:
        amount:
          description: SGD claimed, as a decimal string with at most two places.
          examples:
            - "6000.00"
          type: string
        filed_on:
          description: The day it was filed on the portal.
          examples:
            - "2026-07-20"
          format: date
          type: string
        reference:
          description: The portal's reference.
          examples:
            - GPL-001
          maxLength: 100
          type: string
      required:
        - amount
        - filed_on
      type: object
    ClaimOutputBody:
      additionalProperties: false
      properties:
        id:
          description: The new claim.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e95
          format: uuid
          type: string
        over_guide:
          description: The amount is above what the scheme's cap suggests.
          examples:
            - false
          type: boolean
      required:
        - id
        - over_guide
      type: object
    Classification:
      additionalProperties: false
      properties:
        birth_date:
          description: Date of birth, for the retirement and re-employment cohort.
          examples:
            - "1980-03-04"
          format: date
          type: string
        contract_type:
