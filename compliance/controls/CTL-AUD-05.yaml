# CTL-AUD-05: PRD-001 Appendix F (F.2). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-AUD-05
section: "F.2"
control: "Exports and sensitive reads are logged"
mapping: "ISO 8.15; PDPA protection"
automated_check: "CI test; nightly sample reconciliation"
frequency: "CI, N ((rev 0.11) N: the nightly sample reconciliation of exports and sensitive reads to the audit log)"
evidence: "Audit events"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestEveryFileAndRevealIsAudited"
    evidence: "opening an evidence file and revealing a masked value each write their audit event; CI artefact test-report (90 days)"
  - frequency: N
    status: running
    how: "verify audit.exports-reconciled"
    evidence: "the latest run for the organisation (fyniq.control_run): every report export of the last day has its audit event, and up to 1,000 of each audited read keep their request details beside the chain"
