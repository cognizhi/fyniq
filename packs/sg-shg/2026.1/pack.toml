# sg-shg@2026.1: the monthly contributions to the four self-help group funds (CDAC, ECF, MBMF, SINDA) by the employee's
# monthly total wages, and who contributes to which (PRD-001 §10.6, ENG-30; p1-statutory-packs 4.1).
# Never edit this version once it is active anywhere: a correction is sg-shg@2026.2 (fyniq-sg-statutory).
id = "sg-shg@2026.1"
title = "Singapore self-help group funds: the monthly contribution to CDAC, ECF, MBMF and SINDA by monthly total wages, and who contributes"
effective_from = "2026-01-01"
review_date = "2027-01-31"
verifier = "Claude Code against the CPF Board's page on 18 Nov 2026 (p1-statutory-packs) and its copies of 31 Jan 2023, 19 Jan 2024 and 22 Jan 2025; the accountant's review is pending (FR-UX-41)"
conditions = "Employees working in Singapore who belong to the fund's community, as the funds table states: the fund follows the race on the NRIC (the first race listed for two races), and the MBMF follows religion; the amount is the one of the band the employee's monthly total wages fall in, a band 'up to' an amount including it and a band '>' an amount starting a cent above it. The CPF Board's page states no effective date: the amounts are the same on its page last updated 22 Sep 2026 and on its copies of Jan 2023, Jan 2024 and Jan 2025, so the version starts with the 2026 calendar year as sg-sdl@2026.1 does. An employee who does not wish to contribute, or wishes to contribute a different amount, contacts the fund: the page gives no opt-out rule, so none is held here"

[[sources]]
id = "cpf-shg"
title = "CPF Board: Contributions to self-help groups"
url = "https://www.cpf.gov.sg/employer/employer-obligations/contributions-to-self-help-groups"
section = "Who should contribute to the SHG funds?; SHG contribution rates (CDAC, ECF, MBMF and SINDA contribution rates)"
kind = "official guidance"
retrieved = "2026-11-18"
quote = "Employees working in Singapore should contribute to the respective SHG funds shown below. Employees who do not wish to contribute or wish to contribute a different amount can contact the respective SHGs for more information. Contributions to the MBMF are based on the employee's religion. Contributions to other SHGs are based on the employee's race indicated on the NRIC. For employees with two races listed on their NRIC (e.g., Indian-Chinese), the first race listed determines the applicable SHG."

[[sources]]
id = "cpf-shg-2025"
title = "CPF Board: Contributions to self-help groups, the page as archived on 22 Jan 2025 (Internet Archive)"
url = "https://web.archive.org/web/20250122185048/https://www.cpf.gov.sg/employer/employer-obligations/contributions-to-self-help-groups"
section = "SHG contribution rates"
kind = "official guidance"
retrieved = "2026-11-18"
quote = "CDAC: $2,000 or less $0.50; > $2,000 to $3,500 $1; > $3,500 to $5,000 $1.50; > $5,000 to $7,500 $2; > $7,500 $3. The same amounts, band for band and fund for fund, as the page of 22 Sep 2026 and its copies of 31 Jan 2023 and 19 Jan 2024."

[[tables]]
name = "funds"
file = "funds.csv"
description = "Each fund, who administers it, whether race or religion decides it, and who contributes"

[[tables]]
name = "bands"
file = "bands.csv"
description = "The monthly contribution of a fund for monthly total wages above wage_above (blank: from nothing) and up to wage_to (blank: no limit), for months from effective_from to effective_to"

