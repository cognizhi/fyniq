# The web image's server (Dockerfile.web). An add_header in a location replaces the server's, so
# every location includes the security headers.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback; index.html is never cached, so a new release loads at once.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
