# CTL-MCP-02: PRD-001 Appendix F (F.7a). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-MCP-02
section: "F.7a"
control: "MCP tool surface = registry minus the never-list; definitions match pinned hashes (AI-40)"
mapping: "AG; OWASP LLM01, LLM06"
automated_check: "QA-MCP-01"
frequency: "CI"
evidence: "Tool manifest"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestTheManifestIsWhatTheToolsAndTheScopeMapGive"
    evidence: "contracts/ai/mcp-manifest.json is what the registry and the scope map give, each definition pinned by its SHA-256, so a change to a tool, its schema or its scope shows in the pull request; CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestThePlantedToolsThatBreakTheNeverListFailTheBuild"
    evidence: "a planted tool that writes, approves, pays, exports, changes a setting, files, voids or reopens, runs outside the API, is open-world or needs payroll or equity fails the build; the shipped surface is the registry minus the never-list, default-deny; CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestAnAlteredDefinitionIsRefused"
    evidence: "an altered description, schema, annotation or scope, a tool added or dropped or an edited pin is refused before the server serves anything; CI artefact test-report (90 days)"
