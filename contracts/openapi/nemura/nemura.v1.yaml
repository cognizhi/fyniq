# The contract of Nemura's public API (PRD-002 NM-ARC-03, ADR-N1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    AccrualCountOutputBody:
      additionalProperties: false
      properties:
        lines:
          description: How many people have days on the accrual.
          examples:
            - 3
          format: int64
          type: integer
      required:
        - lines
      type: object
    AccrualInputBody:
      additionalProperties: false
      properties:
        month:
          description: The month, as 2026-05.
          examples:
            - 2026-05
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          type: string
      required:
        - month
      type: object
    AccrualLine:
      additionalProperties: false
      properties:
        annual_left:
          description: All annual leave left, for the accountant's information.
          examples:
            - "18.00"
          type: string
        carried_days:
          description: "Carried-forward annual leave untaken at the month's end: what the accrual recognises by default."
          examples:
            - "4.00"
          type: string
        id:
          description: The line.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1ed0
          format: uuid
          type: string
        person_id:
          description: The person.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        person_name:
          description: Their name.
          examples:
            - Ben Lim
          type: string
        state:
          description: A draft waiting for approval, or approved and ready for the Fyniq link.
          enum:
            - draft
            - approved
          examples:
            - draft
          type: string
      required:
        - id
        - person_id
        - person_name
        - state
        - carried_days
        - annual_left
      type: object
    AccrualListOutputBody:
      additionalProperties: false
      properties:
        lines:
          description: The month's accrual by person.
          items:
            $ref: "#/components/schemas/AccrualLine"
          type:
            - array
            - "null"
      required:
        - lines
      type: object
    AddDependantInputBody:
      additionalProperties: false
      properties:
        adoption_intent:
          description: The formal intent to adopt, when there is no date of birth yet.
          examples:
            - false
          type: boolean
        birth_date:
          description: The child's date of birth.
          examples:
            - "2025-05-06"
          format: date
          type: string
        citizenship:
          description: The child's citizenship.
          enum:
            - citizen
            - permanent_resident
            - other
          examples:
            - citizen
          type: string
        declared_on:
          description: The day the employee made the declaration.
          examples:
            - "2026-01-02"
          format: date
          type: string
        effective_from:
          description: The day the record starts.
          examples:
            - "2026-01-02"
          format: date
          type: string
        relationship:
          description: How the child is related.
          enum:
            - child
            - adopted_child
            - stepchild
          examples:
            - child
          type: string
      required:
        - relationship
        - citizenship
        - declared_on
        - effective_from
      type: object
    AddDocumentInputBody:
      additionalProperties: false
      properties:
        content_base64:
          description: The file, base64, up to 5 MB.
          examples:
            - JVBERi0xLjQK
          type: string
        content_type:
          description: Its media type.
          examples:
            - application/pdf
          type: string
        doc_type:
          description: The kind of document.
          enum:
            - contract
            - kets
            - letter
            - pass_copy
            - certificate
            - other
          examples:
            - contract
          type: string
        retention_class:
          description: The retention rule it falls under (a key of the retention schedule).
          examples:
            - employment-records
          type: string
        title:
          description: Its title.
          examples:
            - Employment contract
          maxLength: 200
          minLength: 1
          type: string
        viewers:
          description: The roles who may see it; employee means the person themselves.
          examples:
            - - hr_admin
              - employee
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - doc_type
        - title
        - retention_class
        - content_type
        - content_base64
        - viewers
      type: object
    AddPassInputBody:
      additionalProperties: false
      properties:
        expires_on:
          description: The day it expires.
          examples:
            - "2027-12-31"
          format: date
          type: string
        issued_on:
          description: The day it was issued.
          examples:
            - "2026-01-01"
          format: date
          type: string
        number:
          description: The pass number.
          examples:
            - EP12345678
          type: string
        pass_type:
          description: The kind of pass.
          enum:
            - employment_pass
            - s_pass
            - work_permit
            - dp_work_permit
          examples:
            - employment_pass
          type: string
      required:
        - pass_type
        - number
        - issued_on
        - expires_on
      type: object
    AppliedOutputBody:
      additionalProperties: false
      properties:
        days:
          description: The days reserved for it.
          examples:
            - "5.00"
          type: string
        id:
          description: The new request.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e80
          format: uuid
          type: string
      required:
        - id
        - days
      type: object
    Availability:
      additionalProperties: false
      properties:
        available_hours:
          description: "The hours available: working days less days away, at the hours of a day."
          examples:
            - "154.00"
          type: string
        away_days:
          description: Of them, the days away on approved leave, sick leave or government-paid leave.
          examples:
            - "3.50"
          type: string
        hours_per_day:
          description: "Hours in a working day: the week's hours over the days worked."
          examples:
            - "8.80"
          type: string
        working_days:
          description: Working days by the person's pattern, public holidays left out.
          examples:
            - "21.00"
          type: string
      required:
        - working_days
        - away_days
        - hours_per_day
        - available_hours
      type: object
    AwayPerson:
      additionalProperties: false
      properties:
        from:
          description: Their first day away.
          examples:
            - "2026-04-06"
          format: date
          type: string
        name:
          description: The colleague.
          examples:
            - Ben Lim
          type: string
        to:
          description: Their last day away.
          examples:
            - "2026-04-08"
          format: date
          type: string
      required:
        - name
        - from
        - to
      type: object
    BankChange:
      additionalProperties: false
      properties:
        account_masked:
          description: The proposed account, masked.
          examples:
            - "****7890"
          type: string
        id:
          description: The change.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e73
          format: uuid
          type: string
        person_id:
          description: The person whose account it is.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        state:
          description: Where the change is.
          enum:
            - proposed
            - approved
            - refused
            - confirmed
          examples:
            - proposed
          type: string
      required:
        - id
        - person_id
        - account_masked
        - state
      type: object
    CalendarEntry:
      additionalProperties: false
      properties:
        date:
          description: The day.
          examples:
            - "2026-05-04"
          format: date
          type: string
        kind:
          description: A public holiday as the person observes it; away with no type; approved leave with its type; a request waiting; sick leave (the person and the HR officer and administrator only).
          enum:
            - holiday
            - away
            - leave
            - pending
            - sick
          examples:
            - away
          type: string
        label:
          description: The holiday's name, the leave type, or Away.
          examples:
            - Away
          type: string
      required:
        - date
        - kind
        - label
      type: object
    CalendarPerson:
      additionalProperties: false
      properties:
        entries:
          description: What falls on their days this month, by date.
          items:
            $ref: "#/components/schemas/CalendarEntry"
          type:
            - array
            - "null"
        name:
          description: Their name.
          examples:
            - Ben Lim
          type: string
        person_id:
          description: The person.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        weekdays:
          description: "The days they work, ISO: 1 Monday to 7 Sunday; none when no pattern is set."
          examples:
            - - 1
              - 2
              - 3
              - 4
              - 5
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      required:
        - person_id
        - name
        - weekdays
        - entries
      type: object
    CarryOutputBody:
      additionalProperties: false
      properties:
        carried:
          description: The days carried into the next year; zero when nothing was unused or all was carried already.
          examples:
            - "5.00"
          type: string
      required:
        - carried
      type: object
    CertificateInputBody:
      additionalProperties: false
      properties:
        content_base64:
          description: The photo or e-MC, base64, up to 5 MB.
          examples:
            - /9j/4AAQ
          type: string
        content_type:
          description: The file's media type.
          examples:
            - image/jpeg
          type: string
        issuer:
          description: The clinic, hospital or doctor on the certificate.
          examples:
            - Raffles Medical Clinic
          maxLength: 200
          minLength: 1
          type: string
      required:
        - issuer
        - content_type
        - content_base64
      type: object
    ChangeEvidence:
      additionalProperties: false
      properties:
        content_base64:
          description: The file, base64-encoded; up to 5 MB.
          examples:
            - JVBERi0x
          type: string
        content_type:
          description: The file's type.
          examples:
            - application/pdf
          type: string
        title:
          description: What the file is.
          examples:
            - Deed poll
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - content_type
        - content_base64
      type: object
    ChangeJobInputBody:
      additionalProperties: false
      properties:
        effective_from:
          description: The day the new job record starts; the current one ends that day.
          examples:
            - "2026-09-01"
          format: date
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: The new job record.
      required:
        - effective_from
        - job
      type: object
    ChecksOutputBody:
      additionalProperties: false
      properties:
        findings:
          description: What the people checks found, ✖ first.
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
      required:
        - findings
      type: object
    ClaimEventInputBody:
      additionalProperties: false
      properties:
        amount:
          description: SGD received, for a receipt; none for a rejection.
          examples:
            - "2500.00"
          type: string
        kind:
          description: A receipt of some or all of the amount, or a rejection.
          enum:
            - receipt
            - rejection
          examples:
            - receipt
          type: string
        note:
          description: What the portal said.
          examples:
            - Paid in two parts.
          maxLength: 500
          type: string
        "on":
          description: The day it happened.
          examples:
            - "2026-08-10"
          format: date
          type: string
      required:
        - kind
        - "on"
      type: object
    ClaimInputBody:
      additionalProperties: false
      properties:
        amount:
          description: SGD claimed, as a decimal string with at most two places.
          examples:
            - "6000.00"
          type: string
        filed_on:
          description: The day it was filed on the portal.
          examples:
            - "2026-07-20"
          format: date
          type: string
        reference:
          description: The portal's reference.
          examples:
            - GPL-001
          maxLength: 100
          type: string
      required:
        - amount
        - filed_on
      type: object
    ClaimOutputBody:
      additionalProperties: false
      properties:
        id:
          description: The new claim.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e95
          format: uuid
          type: string
        over_guide:
          description: The amount is above what the scheme's cap suggests.
          examples:
            - false
          type: boolean
      required:
        - id
        - over_guide
      type: object
    Classification:
      additionalProperties: false
      properties:
        birth_date:
          description: Date of birth, for the retirement and re-employment cohort.
          examples:
            - "1980-03-04"
          format: date
          type: string
        contract_type:
          description: A contract of service (an employee) or for service (a contractor, who gets no statutory employee entitlement).
          enum:
            - service
            - for_service
          examples:
            - service
          type: string
        ea_covered:
          description: Whether the Employment Act covers the person.
          examples:
            - true
          type: boolean
        part_iv_class:
          description: The Part IV class, which needs Employment Act cover.
          enum:
            - none
            - workman
            - non_workman
          examples:
            - none
          type: string
        pr_start_date:
          description: "The day permanent residence began: for a permanent resident only."
          examples:
            - "2024-05-01"
          format: date
          type: string
        residency:
          description: Citizen, permanent resident or foreigner.
          enum:
            - citizen
            - permanent_resident
            - foreigner
          examples:
            - citizen
          type: string
      required:
        - contract_type
        - ea_covered
        - part_iv_class
        - residency
      type: object
    Client:
      additionalProperties: false
      properties:
        audience:
          description: "The audience its tokens name: the API's."
          examples:
            - nemura-api
          type: string
        client_id:
          description: The OAuth client ID the system signs in with at the token endpoint.
          examples:
            - 4f6c1b52-8d2a-4c93-9a43-0c2d7e9b1a11
          type: string
        id:
          description: The client's ID in Nemura.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e60
          format: uuid
          type: string
        name:
          description: The system that calls.
          examples:
            - Payroll bureau
          type: string
        scopes:
          description: What its tokens may do.
          examples:
            - - directory.read
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - scopes
        - client_id
        - audience
      type: object
    ClientsOutputBody:
      additionalProperties: false
      properties:
        clients:
          description: The organisation's live API clients.
          items:
            $ref: "#/components/schemas/Client"
          type:
            - array
            - "null"
      required:
        - clients
      type: object
    Code:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_NOT_FOUND
          type: string
        fix:
          description: The usual way to fix it.
          examples:
            - Choose a code from the catalogue.
          type: string
        status:
          description: The HTTP status the code comes with.
          examples:
            - 404
          format: int64
          type: integer
        title:
          description: A short summary that never changes between occurrences.
          examples:
            - Not found
          type: string
      required:
        - code
        - status
        - title
        - fix
      type: object
    ConfirmInputBody:
      additionalProperties: false
      properties:
        credential:
          additionalProperties: {}
          description: The PublicKeyCredential the browser returned for the step-up, as JSON.
          type: object
      required:
        - credential
      type: object
    ConfirmedOutputBody:
      additionalProperties: false
      properties:
        confirmed:
          description: "True: the session is confirmed with a passkey for the next five minutes."
          examples:
            - true
          type: boolean
      required:
        - confirmed
      type: object
    CreateClientInputBody:
      additionalProperties: false
      properties:
        algorithm:
          description: "The algorithm its assertions are signed with: ES256, RS256 or EdDSA."
          examples:
            - ES256
          type: string
        name:
          description: The system that will call Nemura.
          examples:
            - Payroll bureau
          maxLength: 100
          minLength: 1
          type: string
        public_key:
          additionalProperties: {}
          description: Its public key as a JWK (RFC 7517), never the private key.
          type: object
        scopes:
          description: What its tokens may do, from GET /v1/api-clients/scopes.
          examples:
            - - directory.read
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - scopes
        - algorithm
        - public_key
      type: object
    CreatePersonInputBody:
      additionalProperties: false
      properties:
        classification:
          $ref: "#/components/schemas/Classification"
          description: Their legal classification, from their start date.
        id:
          description: The new person's ID, chosen by the caller so a repeat is refused, not done twice.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: Their first job, from their start date.
        person:
          $ref: "#/components/schemas/PersonInput"
          description: Their own fields.
      required:
        - id
        - person
        - job
      type: object
    CreatedOutputBody:
      additionalProperties: false
      properties:
        id:
          description: The new record.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e70
          format: uuid
          type: string
      required:
        - id
      type: object
    DayCost:
      additionalProperties: false
      properties:
        cost:
          description: "Days it costs: 1.00, 0.50 or 0.00."
          examples:
            - "0.00"
          type: string
        date:
          description: The day.
          examples:
            - "2026-04-03"
          format: date
          type: string
        why:
          description: "Why it costs nothing: a rest day or the name of the public holiday."
          examples:
            - Good Friday
          type: string
      required:
        - date
        - cost
      type: object
    DecideBankInputBody:
      additionalProperties: false
      properties:
        approve:
          description: Whether to approve the change.
          examples:
            - true
          type: boolean
        reason:
          description: "Why it is refused: required for a refusal."
          examples:
            - The number does not match the bank letter.
          maxLength: 2000
          type: string
      required:
        - approve
      type: object
    DecideInputBody:
      additionalProperties: false
      properties:
        key:
          description: The row's key.
          examples:
            - "1"
          type: string
        reason:
          description: Why the company uses the researched value.
          examples:
            - We read MOM's page and it matches our contracts.
          maxLength: 2000
          minLength: 10
          type: string
        table:
          description: The table of the pack.
          examples:
            - annual_leave
          type: string
      required:
        - table
        - key
        - reason
      type: object
    DecisionInputBody:
      additionalProperties: false
      properties:
        decision:
          description: Approve or refuse.
          enum:
            - approve
            - refuse
          examples:
            - approve
          type: string
        reason:
          description: Why; required to refuse.
          examples:
            - The release freezes that week.
          maxLength: 500
          type: string
      required:
        - decision
      type: object
    DelegateInputBody:
      additionalProperties: false
      properties:
        ends_on:
          description: "The day it ends: after today and at most twelve months from today."
          examples:
            - "2027-11-20"
          format: date
          type: string
        monthly_limit:
          description: How many letters may be issued under it in a calendar month.
          examples:
            - 50
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
        type:
          description: The letter type to delegate.
          examples:
            - employment_confirmation
          type: string
      required:
        - type
        - monthly_limit
        - ends_on
      type: object
    Delegation:
      additionalProperties: false
      properties:
        created_on:
          description: The day it was made.
          examples:
            - "2026-11-20"
          format: date
          type: string
        ends_on:
          description: "The day it ends: at most twelve months after it was made."
          examples:
            - "2027-11-20"
          format: date
          type: string
        fields:
          description: The fields the approved template shows; never salary.
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: The delegation.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1f10
          format: uuid
          type: string
        issued_this_month:
          description: How many it has issued this month.
          examples:
            - 3
          format: int64
          type: integer
        monthly_limit:
          description: How many letters may be issued under it in a calendar month.
          examples:
            - 50
          format: int64
          type: integer
        revoked_reason:
          description: Why it was revoked.
          examples:
            - No longer needed.
          type: string
        state:
          description: Active; revoked by a signatory; ended on its date; or replaced because the template changed.
          enum:
            - active
            - revoked
            - ended
            - replaced
          examples:
            - active
          type: string
        type:
          description: The letter type.
          examples:
            - employment_confirmation
          type: string
        who:
          description: "Who may ask: active employees not serving notice."
          enum:
            - active_employees
          examples:
            - active_employees
          type: string
      required:
        - id
        - type
        - who
        - fields
        - monthly_limit
        - issued_this_month
        - created_on
        - ends_on
        - state
      type: object
    DelegationRevokeInputBody:
      additionalProperties: false
      properties:
        reason:
          description: Why it is revoked.
          examples:
            - No longer needed.
          maxLength: 500
          type: string
      type: object
    DelegationsOutputBody:
      additionalProperties: false
      properties:
        delegations:
          description: The delegations, newest first.
          items:
            $ref: "#/components/schemas/Delegation"
          type:
            - array
            - "null"
      required:
        - delegations
      type: object
    Dependant:
      additionalProperties: false
      properties:
        adoption_intent:
          description: The formal intent to adopt, instead of a date of birth.
          examples:
            - false
          type: boolean
        birth_date:
          description: The child's date of birth; hidden at the masked level.
          examples:
            - "2025-05-06"
          format: date
          type: string
        citizenship:
          description: The child's citizenship.
          enum:
            - citizen
            - permanent_resident
            - other
          examples:
            - citizen
          type: string
        effective_from:
          description: The day the record starts.
          examples:
            - "2026-01-02"
          format: date
          type: string
        effective_to:
          description: The day it ends.
          examples:
            - "2030-01-02"
          format: date
          type: string
        id:
          description: The dependant record.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e71
          format: uuid
          type: string
        relationship:
          description: How the child is related.
          enum:
            - child
            - adopted_child
            - stepchild
          examples:
            - child
          type: string
      required:
        - id
        - relationship
        - adoption_intent
        - citizenship
        - effective_from
      type: object
    DependantsOutputBody:
      additionalProperties: false
      properties:
        dependants:
