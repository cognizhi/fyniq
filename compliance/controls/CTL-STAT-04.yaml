# CTL-STAT-04: PRD-001 Appendix F (F.8). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-STAT-04
section: "F.8"
control: "ECI, Form C-S/C, ACRA annual return, AGM on time"
mapping: "Income Tax Act; Companies Act"
automated_check: "Calendar monitor"
frequency: "D"
evidence: "Filing record"
owner: Owner
checks:
  - frequency: D
    status: running
    how: "check compliance.deadlines"
    evidence: "the statutory calendar's ECI, Form C-S/C, annual return and AGM deadlines (C.2 #15); the check's latest result for each organisation, on Checks"
