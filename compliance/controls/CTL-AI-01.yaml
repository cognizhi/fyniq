# CTL-AI-01: PRD-001 Appendix F (F.7). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-AI-01
section: "F.7"
control: "AI identities hold no write privilege except proposal insert (and knowledge-base drafts by the compiler job, rev 0.4)"
mapping: "AG (bound risks); OWASP LLM06 / ASI02–03"
automated_check: "IAM and database grant tests (CMP-AI-01)"
frequency: "CI, N"
evidence: "Grant snapshot"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestTheAIRoleHoldsNoWritePrivilege"
    evidence: "fyniq_ai holds no write privilege on any table, view or sequence and executes no function of fyniq's (CMP-AI-01); CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "make infra-check"
    evidence: "the environment module's test the_ai_service_account_writes_nothing: the AI orchestrator's account holds no key, secret, queue, project or job role (CMP-AI-01); the Infrastructure CI job's log"
  - frequency: CI
    status: running
    how: "test TestTheAIToolsAreReadOnly"
    evidence: "every tool of the AI tool registry is read-only; it passes, saying so, until p1-ai-assistant adds the registry; CI artefact test-report (90 days)"
  - frequency: N
    status: running
    how: "job schema.verify"
    evidence: "the job's run in the platform's job slots: the database's grants, guard triggers and row-level security against the snapshots the release carries; a difference fails the run, naming the role, table and privilege, and raises the absence alert"
