# The contract of the API's internal operations (PRD-001 §9.3 rev 0.277; p1-ai-assistant design D4): the AI
# service's alone, under /internal/v1, never routed by the edge. Reviewed in every pull request that changes it: CI fails
# when the code and this file differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
components:
  schemas:
    AIEvidenceRef:
      additionalProperties: false
      properties:
        id:
          description: Its ID, or the key it is known by.
          examples:
            - agm-2027
          maxLength: 100
          minLength: 1
          type: string
        kind:
          description: The kind of record, such as task, invoice or document.
          examples:
            - task
          pattern: ^[a-z][a-z_]{1,40}$
          type: string
        title:
          description: What it is, in a few words.
          examples:
            - Hold the AGM
          maxLength: 200
          type: string
      required:
        - kind
        - id
      type: object
    AIModelCall:
      additionalProperties: false
      properties:
        agent:
          description: "The agent the call is for: its route decides the connection and model (AI-74). A turn's is chat; a scheduled agent's run's is the run's agent."
          enum:
            - chat
            - company_secretary
          examples:
            - chat
          type: string
        classes:
          description: The classes of data the AI service says the call carries. The API routes it for these and every class the turn has read, whichever the AI service names (AI-83).
          items:
            description: "A class of data: restricted data never goes to an AI provider (AI-75)."
            enum:
              - know-how
              - business-figures
              - personal-data
              - payroll
            examples:
              - business-figures
            type: string
          type: array
        request:
          $ref: "#/components/schemas/AIModelRequest"
      required:
        - agent
        - classes
        - request
      type: object
    AIModelCallResult:
      additionalProperties: false
      properties:
        classes:
          description: "The classes it was routed for: the AI service's and every class the turn has read."
          items:
            description: "A class of data: restricted data never goes to an AI provider (AI-75)."
            enum:
              - know-how
              - business-figures
              - personal-data
              - payroll
            examples:
              - business-figures
            type: string
          type: array
        connection_id:
          examples:
            - 0193a3f2-7c1e-7a2b-9c4d-5e6f70819a2b
          format: uuid
          type: string
        response:
          $ref: "#/components/schemas/ModelResponse"
        run:
          description: The run its attempts share in the AI activity log (AI-12).
          examples:
            - 0193a3f2-7c1e-7a2b-9c4d-5e6f70819a42
          format: uuid
          type: string
        step:
          description: The route's step that served it.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - run
        - step
        - connection_id
        - classes
        - response
      type: object
    AIModelRequest:
      additionalProperties: false
      properties:
        max_tokens:
          description: The answer's output limit.
          examples:
            - 1024
          format: int64
          maximum: 64000
          minimum: 1
          type: integer
        messages:
          description: "The conversation, in parts: text, images, PDFs, tool calls and their results."
          items:
            $ref: "#/components/schemas/ModelMessage"
          type: array
        output:
          $ref: "#/components/schemas/ModelSchema"
          description: A strict structured output the answer must match (AI-27).
        proposals:
          description: "The task types the model may propose, by catalogue ID: each offered as its propose_ tool with the catalogue's own definition, only to a turn that may propose and only while it is on for the organisation (AI-P3, AI-32; p1-ai-proposals-core design D7)."
          items:
            description: A task type of the catalogue (§9.6).
            examples:
              - sec.create_task
            maxLength: 56
            pattern: ^[a-z]+\.[a-z]+(_[a-z]+)*$
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        system:
          description: The system prompt, versioned in contracts/ai/prompts/ (AI-24).
          type: string
        tools:
          description: "The read tools the model may call, by name: it is offered the registry's own definitions, never one the AI service writes (AI-49, AI-19)."
          items:
            description: A read tool of the registry (AI-49).
            enum:
              - calc
              - checks.explain
              - checks.list
              - lineage.explain
              - metrics.query
              - packs.get
              - records.get
              - records.search
            examples:
              - metrics.query
            type: string
          type:
            - array
            - "null"
      required:
        - messages
        - max_tokens
      type: object
    AIModelText:
      additionalProperties: false
      properties:
        part:
          $ref: "#/components/schemas/ModelPart"
        text:
          type: string
      type: object
    AIPropose:
      additionalProperties: false
      properties:
        evidence:
          description: The records and documents it relied on.
          items:
            $ref: "#/components/schemas/AIEvidenceRef"
          maxItems: 50
          type:
            - array
            - "null"
        model:
          description: The model the turn ran on.
          examples:
            - claude-opus-5-5
          maxLength: 200
          minLength: 1
          type: string
        payload:
          additionalProperties: {}
          description: "What to do, as the task type's input schema describes it: what executes once a person approves it."
          type: object
        prompt:
          description: The system prompt the turn ran with.
          examples:
            - chat@2
          pattern: ^[a-z][a-z_]{1,30}@[1-9][0-9]{0,3}$
          type: string
        rationale:
          description: "Why, in the model's words: shown to the approver apart from the platform's summary, as AI text."
          examples:
            - The AGM is due by 30 June 2027 and has no task yet.
          maxLength: 4000
          type: string
        revises:
          description: "A proposal made by a turn for the same person, of the same task type, still waiting, which this one replaces: once this one is Pending, that one is Superseded and its approval request void (§9.5)."
          examples:
            - 0193a3c2-6d0e-7a1b-9c4d-5e6f7a8b9c0c
          format: uuid
          type: string
        task_type:
          description: The catalogue's task type (contracts/ai/tasks).
          examples:
            - sec.create_task
          maxLength: 56
          pattern: ^[a-z]+\.[a-z]+(_[a-z]+)*$
          type: string
      required:
        - task_type
        - payload
        - rationale
        - model
        - prompt
      type: object
    AIProposed:
      additionalProperties: false
      properties:
        expires_at:
          description: When it expires undecided.
          examples:
            - "2026-11-18T09:00:00Z"
          format: date-time
          type: string
        id:
          examples:
            - 0193a3c2-6d0e-7a1b-9c4d-5e6f7a8b9c0d
          format: uuid
          type: string
        payload_sha256:
          description: The SHA-256 of the payload a person approves, in hex.
          examples:
            - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          type: string
        reason:
          description: Why it is invalid, in plain words, for the model to tell the person or correct.
          examples:
            - "payload.title: expected length >= 2"
          type: string
        status:
          description: "pending: it waits for a person's approval; invalid: it was not kept, as reason says."
          enum:
            - pending
            - invalid
          examples:
            - pending
          type: string
        summary:
          description: What it would do, in the platform's words (AI-07).
          examples:
            - Creates the task Hold the AGM, due 30 June 2027
          type: string
        task_type:
          examples:
            - sec.create_task
          type: string
        task_version:
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - task_type
        - task_version
        - status
        - payload_sha256
        - expires_at
      type: object
    AIToolCall:
      additionalProperties: false
      properties:
        input:
          additionalProperties: {}
          description: The input the model gave it, checked against the tool's input schema.
          type: object
        tool:
          description: The read tool the model called, by its registry name.
          enum:
            - calc
            - checks.explain
            - checks.list
            - lineage.explain
            - metrics.query
            - packs.get
            - records.get
            - records.search
          examples:
            - records.search
          type: string
      required:
        - tool
        - input
      type: object
    AIToolResult:
      additionalProperties: false
      properties:
        content:
          description: What the operation answered, cut to the tool's limits, its figures replaced by their facts; absent when the facts are all.
        facts:
          description: Every figure the tool read (AI-68).
          items:
            $ref: "#/components/schemas/Fact"
          type: array
        ledger_revision:
          description: The ledger revision it was read at (ENG-46).
          examples:
            - 1204
          format: int64
          type: integer
        omitted:
          description: "What the limits left out: of each list, how many it shows of how many there are."
          items:
            $ref: "#/components/schemas/Omission"
          type: array
        tool:
          examples:
            - records.search
          type: string
        version:
          description: The tool's version in the registry, which the turn records.
          examples:
            - 1
          format: int64
          type: integer
        withheld:
          description: What screening found in the result's free text, which is withheld, every quoted text with it (AI-18).
          examples:
            - an instruction to ignore earlier instructions
          type: string
      required:
        - tool
        - version
        - facts
        - omitted
        - ledger_revision
      type: object
    AgentRunFinding:
      additionalProperties: false
      properties:
        detail:
          description: What, why and what to do next.
          examples:
            - The GST return for Oct to Dec 2026 is due on 31 Jan 2027 and is not filed.
          maxLength: 2000
          type: string
        due_on:
          description: When it is due.
          examples:
            - "2027-01-31"
          format: date
          type: string
        evidence:
          description: The records and documents behind it, as links in the web app.
          items:
            examples:
              - /compliance/calendar
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        key:
          description: The finding's stable key.
          examples:
            - calendar:gst_f5:2027-01-31
          maxLength: 200
          type: string
        next:
          description: The next step.
          examples:
            - Record it in Compliance › Statutory calendar once it is filed
          maxLength: 500
          type: string
        pack:
          description: The statutory pack read.
          examples:
            - sg-gst@2026.1
          maxLength: 100
          type: string
        rule:
          description: The rule it applies.
          examples:
            - gst.return-due
          maxLength: 200
          type: string
        source:
          description: The rule's source.
          examples:
            - https://www.iras.gov.sg/taxes/goods-services-tax-(gst)/filing-gst/filing-gst-returns
          maxLength: 500
          type: string
        status:
          description: "Its status: ✔, ⚠, ✖, ⏰ or Not assessed."
          enum:
            - ok
            - review
            - blocked
            - due
            - not_assessed
          examples:
            - due
          type: string
        task:
          description: Its compliance task.
          examples:
            - 0193a3c2-6d0e-7a1b-9c4d-5e6f7a8b9c0d
          maxLength: 64
          type: string
        title:
          description: In plain words.
          examples:
            - File the GST return
          maxLength: 300
          type: string
        window:
          description: "The deadline window it is in: 30, 14, 7 or 1 days ahead, or overdue."
          examples:
            - "14"
          maxLength: 20
          type: string
      required:
        - key
        - status
        - title
      type: object
    AgentRunModelOutcome:
      additionalProperties: false
      properties:
        model:
          description: The model the step ran on, as its provider reported it.
          examples:
            - claude-opus-5-5
          type: string
        proposals:
          description: The proposals it made, each waiting for a person or invalid.
          examples:
            - 1
          format: int64
          type: integer
        stop:
          description: How it ended.
          enum:
            - answered
            - tool_limit
            - budget
          examples:
            - answered
          type: string
        text:
          description: "The model's words for the run report, as written: labelled AI wherever they are shown."
          type: string
        tokens:
          description: The tokens the step used.
          examples:
            - 12000
          format: int64
          type: integer
        tool_calls:
          description: The reads it made.
          examples:
            - 4
          format: int64
          type: integer
        tools:
          description: The read tools it called, by name, each read it made once (CTL-AI-09).
          examples:
            - - checks.list
              - packs.get
          items:
            type: string
          maxItems: 200
          type: array
      required:
        - model
        - text
        - tokens
        - tool_calls
        - tools
        - proposals
        - stop
      type: object
    AgentRunModelStep:
      additionalProperties: false
      properties:
        findings:
          description: The run's deterministic findings.
          items:
            $ref: "#/components/schemas/AgentRunFinding"
          maxItems: 500
          type: array
        organisation_id:
          description: The run's organisation.
          examples:
            - 0193a3c2-6d0e-7a1b-9c4d-5e6f7a8b9c0d
          format: uuid
          type: string
      required:
        - organisation_id
        - findings
      type: object
    Fact:
      additionalProperties: false
      properties:
        as_at:
          description: The day a record's figure was read.
          examples:
            - "2026-10-15"
          format: date
          type: string
        currency:
          description: An amount's currency.
          examples:
            - SGD
          type: string
        dimension:
          description: "What the member is: a semantic dimension, or the kind of record."
          examples:
            - invoice
          type: string
        from:
          description: The period's first day; a stock's date.
          examples:
            - "2026-07-01"
          format: date
          type: string
        id:
          description: The fact's ID, which an answer cites (AI-08).
          examples:
            - F3a9c0d1e2b4f5a6
          type: string
        inputs:
          description: A calculated fact's input facts, by ID (AI-68, AI-P6).
          examples:
            - - F3a9c0d1e2b4f5a6
          items:
            type: string
          type:
            - array
            - "null"
        ledger_revision:
          description: The ledger revision it was read at (ENG-46).
          examples:
            - 1204
          format: int64
          type: integer
        lineage:
          description: The API path it was read from.
          examples:
            - /v1/invoices/0193a3f2-7c1e-7a2b-9c4d-5e6f70819a2b
          type: string
        measure:
          description: "What it is: a measure of the semantic layer, or a record's field, such as invoice.total."
          examples:
            - invoice.total
          type: string
        member:
          description: The member or record it belongs to.
          examples:
            - 0193a3f2-7c1e-7a2b-9c4d-5e6f70819a2b
          type: string
        member_name:
          examples:
            - Acme Pte Ltd
          type: string
        name:
          description: The measure's name; for a record's field, where it is in the record.
          examples:
            - lines[2].net
          type: string
        pack:
          description: A statutory value's pack (AI-53).
          examples:
            - sg-gst
          type: string
        pack_version:
          description: A statutory value's pack version (AI-53).
          examples:
            - sg-gst@2026.3
          type: string
        sign:
          description: How the value is signed.
          examples:
            - as the record shows it
          type: string
        source:
          description: What it is, in words.
          examples:
            - the invoice's total
          type: string
        to:
          description: The period's last day; a stock's date.
          examples:
            - "2026-09-30"
          format: date
          type: string
        undefined:
          description: "Why the fact has no value: never 0."
          examples:
            - no revenue in the month
          type: string
        unit:
          enum:
            - amount
            - count
            - number
            - percent
            - months
            - ratio
            - days
          examples:
            - amount
          type: string
        value:
          description: Exact decimal text; absent when the fact has no value.
          examples:
            - "1250.00"
          type: string
        words:
          description: What stands for the value, such as Not burning.
          examples:
            - Not burning
          type: string
      required:
        - id
        - measure
        - unit
        - sign
        - ledger_revision
        - source
        - lineage
      type: object
    FieldProblem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - LEDGER-04
          type: string
        field:
          description: "The JSON path of the field: in the request body (body.…), the query (query.…), a header (header.…), or the saved record a command acts on."
          examples:
            - lines[0].account_id
          type: string
        fix:
          description: How to fix it.
          examples:
            - Choose an account from the chart of accounts
          type: string
        message:
          description: What is wrong with it.
          examples:
            - the account does not exist in this organisation
          type: string
      required:
        - code
        - field
        - message
        - fix
      type: object
    ModelMessage:
      additionalProperties: false
      properties:
        parts:
          items:
            $ref: "#/components/schemas/ModelPart"
          type:
            - array
            - "null"
        role:
          type: string
      required:
        - role
        - parts
      type: object
    ModelPart:
      additionalProperties: false
      properties:
        call_id:
          type: string
        data:
          contentEncoding: base64
          type: string
        input: {}
        is_error:
          type: boolean
        kind:
          type: string
        media_type:
          type: string
        raw: {}
        text:
          type: string
        tool:
          type: string
      required:
        - kind
      type: object
    ModelResponse:
      additionalProperties: false
      properties:
        model:
          type: string
        parts:
          items:
            $ref: "#/components/schemas/ModelPart"
          type:
            - array
            - "null"
        stop_reason:
          type: string
        usage:
          $ref: "#/components/schemas/ModelUsage"
        version:
          type: string
      required:
        - parts
        - stop_reason
        - usage
        - model
      type: object
    ModelSchema:
      additionalProperties: false
      properties:
        name:
          type: string
        schema: {}
      required:
        - name
        - schema
      type: object
    ModelUsage:
      additionalProperties: false
      properties:
        cache_read:
          format: int64
          type: integer
        cache_write:
          format: int64
          type: integer
        input:
          format: int64
          type: integer
        output:
          format: int64
          type: integer
        reasoning:
          format: int64
          type: integer
      required:
        - input
        - output
      type: object
    Omission:
      additionalProperties: false
      properties:
        of:
          examples:
            - 120
          format: int64
          type: integer
        path:
          description: The list, as a path in the result.
          examples:
            - lines
          type: string
        shown:
          examples:
            - 50
          format: int64
          type: integer
      required:
        - path
        - shown
        - of
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code (ENG-23).
          examples:
            - JOURNAL-02
          type: string
        detail:
          description: What went wrong this time, in plain English.
          examples:
            - The journal is posted, not a draft.
          type: string
        errors:
          description: Every invalid field, all at once.
          items:
            $ref: "#/components/schemas/FieldProblem"
          type:
            - array
            - "null"
        fix:
          description: How to fix it.
          examples:
            - Only a draft can be posted; reverse a posted journal instead.
          type: string
        instance:
          description: The request this occurrence belongs to; quote it to support.
          examples:
            - urn:fyniq:request:01JA2B3C4D5E6F7G8H9J0K1M2N
          format: uri
          type: string
        status:
          description: The HTTP status code.
          examples:
            - 409
          format: int64
          type: integer
        title:
          description: A short summary of the problem type; it never changes between occurrences.
          examples:
            - The journal is not a draft
          type: string
        type:
          description: A URI naming the problem; one per code.
          examples:
            - urn:fyniq:problem:JOURNAL-02
          format: uri
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
info:
  description: "The operations only the AI service calls (PRD-001 §9.3 rev 0.277): the model calls, reads and proposals of the assistant's turns and the scheduled agents' runs, run by the API so the provider keys, the budgets and the metering stay in the API. Never routed by the edge. Each call carries the AI service's service token (X-Fyniq-Service-Token) and the turn's or the run's delegated token (Authorization: Bearer fyai_…), which names the person it is for. The one exception is runAgentModel, which the worker calls with its own service token alone (rev 0.281)."
  license:
    identifier: MIT
    name: MIT
  title: Fyniq internal API
  version: 0.1.0 # x-release-please-version
openapi: 3.1.0
paths:
  /internal/v1/agent-runs/{run_id}/model:
    post:
      description: "The worker's one call to the API (PRD-001 rev 0.281), with its own service token and no other: a scheduled agent's run's model step (AI-64). The API checks the run is running, its skill unchanged and the agent still on, unpaused, with the AI on and the person it acts for still an Owner. It then issues the run's delegated token, reading as that Owner with the skill's tools alone and proposing only its outputs that are on (AI-63), and asks the AI service with the skill, the findings and the reasons people rejected the agent's earlier proposals (AI-14), within the run's caps (AI-67). The model's words come back grounded and screened; the token ends as the step does. Side effects: the run's grant, and whatever the AI service's model calls and proposals record through the API."
      operationId: runAgentModel
      parameters:
        - description: The run.
          in: path
          name: run_id
          required: true
          schema:
            description: The run.
            examples:
              - 0193a3c2-6d0e-7a1b-9c4d-5e6f7a8b9c0d
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunModelStep"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunModelOutcome"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Ask the model for a scheduled agent's run
      tags:
        - Assistant
      x-fyniq-error-codes:
        - AI-AGENT-01
        - AI-ASSISTANT-02
        - AI-SCREEN-02
        - API-AUTH-01
        - API-FAILURE-01
        - API-INPUT-02
        - API-NOT-FOUND-01
  /internal/v1/model-calls:
    post:
      description: "Runs the agent's route for the turn's person (AI-74, AI-76): the AI switch, the budgets (AI-86), the data-class policy for the classes the AI service names and every class the turn has read (AI-83), failover only to an eligible step, and the record of every attempt in the AI activity log (AI-12). The provider keys stay in the API (PRD-001 §9.3 rev 0.277)."
      operationId: callAIModel
      requestBody:
        content:
          application/json:
            schema:
