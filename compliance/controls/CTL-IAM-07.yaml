# CTL-IAM-07: PRD-001 Appendix F (F.3). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-IAM-07
section: "F.3"
control: "(rev 0.6) First-run setup is completed once, with the deployment's one-time setup code; Super admin changes need step-up and, with two Super admins, dual control; sign-ins through any provider still require the platform's MFA"
mapping: "ISO 5.15–5.18, 8.5; SOC2 CC6.1–6.3"
automated_check: "CI: setup-wizard tests (no code, reused code, second run); provider sign-in tests with MFA; nightly count of Super admins ≥ 1"
frequency: "CI, N"
evidence: "Test reports; audit events"
owner: Administrator
checks:
  - frequency: CI
    status: running
    how: "make test"
    evidence: "TestFirstRunSetup, the setup-wizard tests (no code, wrong code, two at once, reused code, a new code after setup, OAuth clients and the AI refused), and TestSuperAdmins, the Super admin change tests (step-up, OAuth clients and the AI refused, at most two, never none, two-proof recovery, deployment recovery, every change in the installation's trail, no code in a log); CI artefact test-report (90 days)"
  - frequency: N
    status: running
    how: "job superadmins.verify"
    evidence: "the night's compliance.evidence record (compliance/evidence/<date>/ in the evidence store); control.check.failed in the installation's trail when no Super admin can sign in"
