# CTL-MCP-01: PRD-001 Appendix F (F.7a). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-MCP-01
section: "F.7a"
control: "Agent-class tokens cannot write except by `propose` (AI-34)"
mapping: "AG (bound risks); OWASP ASI02–03"
automated_check: "QA-MCP-01; nightly sample of agent-class writes = 0"
frequency: "CI, N"
evidence: "Test report"
owner: Owner
checks:
  - frequency: CI
    status: running
    how: "test TestAnMCPToolCallPassesEveryGateOrIsRefused"
    evidence: "an agent-class token's write to the public API is refused (403), and the MCP service's one operation runs a read tool only, for the MCP service's own service token and a delegated agent token, with every other caller refused; QA-MCP-01; CI artefact test-report (90 days)"
  - frequency: CI
    status: running
    how: "test TestTheMCPServiceCarriesNoDatabaseCode"
    evidence: "the MCP service's binary carries no database adapter, no domain command and no write path, in both flavours, whichever of the shell and the server runs; CI artefact test-report (90 days)"
  - frequency: N
    status: running
    how: "verify mcp.agent-writes"
    evidence: "the latest run in each organisation (fyniq.control_run), nightly: every audit event of the last day made by an AI app's delegated token (actor mcp:<client>) is a proposal's (ai_proposal.*) or its own approval request, the one write an agent-class token has; each other is listed by event (target 0)"
