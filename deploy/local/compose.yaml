# The local stack (PRD-001 §12.8, ADR-T4; skill fyniq-local-dev).
#   make deps-up → the dependencies only: postgres, mailpit, gcs
#   make up      → the dependencies plus our services, from the local flavour of the images
#                  (`make images`), behind Caddy on http://localhost:8080
#   make dev     → the dependencies here; the services run on the host with hot reload
# Every port binds to 127.0.0.1. Credentials here are for local use only and never valid
# anywhere else. The sign-in emulator joins with p0-identity-oauth-first-run's SignIn port.
name: fyniq

x-hardened: &hardened             # our images run as in production (NFR-IMG-02)
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped

# Each service connects as its own database role (SEC-03); services without a role get no
# FYNIQ_DATABASE_URL at all. `migrate up` creates the roles; locally they share the password
# fyniq-local-only, which is valid nowhere else.
x-fyniq-env: &fyniq-env
  FYNIQ_ENV: local
  PORT: "8080"
  FYNIQ_DATABASE_URL: ""
  FYNIQ_GCS_ENDPOINT: http://gcs:4443/storage/v1/
  FYNIQ_SMTP_ADDR: mailpit:1025
  # Background work (ADR-T7, PRD rev 0.23): the push dispatcher's targets, and a writable place for
  # the local bucket and signing key (the containers' root is read-only).
  FYNIQ_WORKER_URL: http://worker:8080
  FYNIQ_EXECUTOR_URL: http://executor:8080
  FYNIQ_DATA_DIR: /tmp/fyniq

x-health: &health
  test: ["CMD", "/app", "healthcheck"]   # no shell in distroless: the binary probes /readyz
  interval: 3s
  timeout: 3s
  retries: 20

services:
  # ------------------------------------------------------------ dependencies (always)
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873   # same major as Cloud SQL (ADR-D1)
    environment:
      POSTGRES_DB: fyniq
      POSTGRES_USER: fyniq
      POSTGRES_PASSWORD: fyniq-local-only
    ports:
      - "127.0.0.1:${FYNIQ_PG_PORT:-55432}:5432"   # 55432 avoids clashing with a host PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql             # PostgreSQL 18 images keep data under a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyniq -d fyniq"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:                                    # catches every outgoing email; UI at http://localhost:8025
    image: axllent/mailpit:v1.31@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:${FYNIQ_MAIL_UI_PORT:-8025}:8025"
      - "127.0.0.1:${FYNIQ_SMTP_PORT:-1025}:1025"

  gcs:                                        # Cloud Storage JSON API emulator (Bucket Lock is not emulated)
    image: fsouza/fake-gcs-server:1.56@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-backend", "memory"]
    ports:
      - "127.0.0.1:${FYNIQ_GCS_PORT:-4443}:4443"

  # ------------------------------------------------------------ our services (profile core)
  migrate:
    <<: *hardened
    image: fyniq-migrate:local
    profiles: [core]
    restart: "no"
    command: ["up"]
    environment:
      <<: *fyniq-env
      FYNIQ_DATABASE_URL: postgres://fyniq_migrator:fyniq-local-only@postgres:5432/fyniq?sslmode=disable
      # the container's superuser, used only to create fyniq_migrator in an empty database
      FYNIQ_DATABASE_ADMIN_URL: postgres://fyniq:fyniq-local-only@postgres:5432/fyniq?sslmode=disable
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *hardened
    image: fyniq-api:local
    profiles: [core]
    environment:
      <<: *fyniq-env
      FYNIQ_DATABASE_URL: postgres://fyniq_api:fyniq-local-only@postgres:5432/fyniq?sslmode=disable
      FYNIQ_OAUTH_ADMIN_URL: http://oauth:4445              # Hydra's admin API: never through Caddy
      FYNIQ_API_AUDIENCE: http://localhost:8080/api
      FYNIQ_MCP_AUDIENCE: http://localhost:8080/mcp
    ports: ["127.0.0.1:${FYNIQ_API_PORT:-8081}:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *health

  ai:
    <<: *hardened
    image: fyniq-ai:local
    profiles: [core]
    environment: { <<: *fyniq-env }   # no database credential at all (§12.3)
    healthcheck: *health

  mcp:
    <<: *hardened
    image: fyniq-mcp:local
    profiles: [core]
    environment: { <<: *fyniq-env }   # reaches data only through the API (§12.3)
    healthcheck: *health

  worker:
    <<: *hardened
    image: fyniq-worker:local
    profiles: [core]
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      <<: *fyniq-env
      FYNIQ_DATABASE_URL: postgres://fyniq_worker:fyniq-local-only@postgres:5432/fyniq?sslmode=disable
    healthcheck: *health

  executor:                                   # own identity and database role (§12.3)
    <<: *hardened
    image: fyniq-executor:local
    profiles: [core]
    depends_on: { migrate: { condition: service_completed_successfully } }
    environment:
      <<: *fyniq-env
      FYNIQ_DATABASE_URL: postgres://fyniq_executor:fyniq-local-only@postgres:5432/fyniq?sslmode=disable
    healthcheck: *health

  render:
    <<: *hardened
    image: fyniq-render:local
    profiles: [core]
    environment: { <<: *fyniq-env }
    healthcheck: *health

  oauth-migrate:                              # Hydra's schema, in its own database (ADR-T3)
    <<: *hardened
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    profiles: [core]
    restart: "no"
    command: ["migrate", "sql", "up", "-e", "--yes"]
    environment:
      DSN: postgres://hydra:fyniq-local-only@postgres:5432/hydra?sslmode=disable
    depends_on: { migrate: { condition: service_completed_successfully } }

  oauth:                                      # Ory Hydra, Apache-2.0 v26.2.0: the OAuth 2.1 server (ADR-T3)
    <<: *hardened
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    profiles: [core]
    # --dev allows the http issuer of the local stack; staging and production run without it.
    command: ["serve", "all", "--dev", "--sqa-opt-out"]
    environment:
      DSN: postgres://hydra:fyniq-local-only@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: http://localhost:8080/oauth/
      URLS_LOGIN: http://localhost:8080/api/auth/login
      URLS_CONSENT: http://localhost:8080/api/auth/consent
      SECRETS_SYSTEM: fyniq-local-only-oauth-system-key   # local only; Secret Manager in the cloud
      OAUTH2_PKCE_ENFORCED: "true"                         # the authorisation code with PKCE only (AI-36)
      STRATEGIES_ACCESS_TOKEN: opaque                      # introspected, so revocation is seen (AI-38)
      TTL_ACCESS_TOKEN: 1h                                 # at most 60 minutes (AI-38)
    depends_on: { oauth-migrate: { condition: service_completed_successfully } }

  web:                                        # the built web app on nginx-unprivileged
    <<: *hardened
    image: fyniq-web:local
    profiles: [core]
    user: "101:101"
    tmpfs: ["/tmp:size=16m", "/var/cache/nginx:size=16m"]

  caddy:                                      # one origin, like the production load balancer
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [core]
    ports: ["127.0.0.1:${FYNIQ_HTTP_PORT:-8080}:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      api: { condition: service_healthy }
      ai: { condition: service_healthy }
      mcp: { condition: service_healthy }
      web: { condition: service_started }
      oauth: { condition: service_started }

volumes:
  pgdata:
