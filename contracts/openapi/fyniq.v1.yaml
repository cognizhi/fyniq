          type: boolean
      required:
        - done
      type: object
    SignInProvider:
      additionalProperties: false
      properties:
        id:
          description: "The provider's ID: the web app sends the browser to /api/auth/signin?provider=<id> to sign in with it."
          examples:
            - google
          type: string
        name:
          description: The provider's name, as the sign-in page shows it.
          examples:
            - Google
          type: string
      required:
        - id
        - name
      type: object
    SignInProviders:
      additionalProperties: false
      properties:
        items:
          description: The providers, in the order to offer them; empty when sign-in is not configured.
          items:
            $ref: "#/components/schemas/SignInProvider"
          type:
            - array
            - "null"
        next_cursor:
          description: Send it as cursor for the next page; absent on the last page.
          examples:
            - eyJhZnRlciI6Imdvb2dsZSJ9
          type: string
      required:
        - items
      type: object
    SuperAdminInvitation:
      additionalProperties: false
      properties:
        display_name:
          description: Your name, as other users will see it; ignored when you are a user already.
          examples:
            - Wei Jie Lim
          maxLength: 200
          minLength: 1
          type: string
        invitation_code:
          description: The invitation a Super admin created for you. Case, spaces and dashes do not matter.
          examples:
            - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
          maxLength: 100
          minLength: 20
          type: string
      required:
        - invitation_code
        - display_name
      type: object
    SuperAdminRecovery:
      additionalProperties: false
      properties:
        confirmation_code:
          description: The other Super admin's confirmation of your recovery, or the deployment recovery code (docs/runbooks/super-admin-recovery.md).
          examples:
            - FGHIJ-KLMNO-PQRST-UVWXY-ZABCD-E
          maxLength: 100
          minLength: 20
          type: string
        recovery_code:
          description: One of your printed recovery codes. Required with the other Super admin's confirmation; optional with a deployment recovery.
          examples:
            - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
          maxLength: 100
          minLength: 20
          type: string
      required:
        - confirmation_code
      type: object
  securitySchemes:
    bearer:
      description: An access token from Fyniq's OAuth server (ADR-T3), for integrations and MCP clients. The local build also accepts the local issuer's dev tokens.
      scheme: bearer
      type: http
    session:
      description: "The web app's first-party session (SEC-05, SEC-08), set by signing in at /auth/signin: an HttpOnly cookie the web app never reads (fyniq_session on http://localhost). A request it authenticates may change state only from the web app's own origin (Sec-Fetch-Site: same-origin)."
      in: cookie
      name: __Host-fyniq_session
      type: apiKey
info:
  contact:
    name: Fyniq
    url: https://github.com/cognizhi/fyniq
  description: |-
    Fyniq's public API. The web app uses only this API (FR-INT-01).

    Conventions (PRD-001 §8.18.1):
    - Errors are RFC 9457 problem details (application/problem+json) with a stable code, the field path,
      what is wrong and how to fix it; validation errors list every invalid field at once (FR-INT-07).
    - Every POST that creates or changes state accepts an Idempotency-Key header, kept 24 hours per
      client: a repeat returns the original response; the same key with a different request returns 422
      (FR-INT-08). The installation's operations that take or return a one-time code (first-run setup,
      Super admins) take none: the code makes them one-time, and a response with a code is never stored.
    - Versioned records return an ETag; commands that change one require If-Match and return 412 when
      the record changed since, 428 without it (FR-INT-09).
    - Lists are cursor-paginated (page_size up to 500, an opaque next_cursor). Money is a decimal string
      with its currency, never a JSON number; dates are ISO 8601; IDs are UUIDv7 strings (FR-INT-10).
    - Writes accept Prefer: return=preview: the command runs with every check its commit would, and nothing
      is saved; the answer carries Preference-Applied: return=preview (FR-INT-14). The one-time-code
      operations take no preview.
    - Bulk operations take up to 250 items and answer with one result per item, in order (FR-INT-11).
    - Each client may make 600 reads and 120 writes a minute in an organisation; RateLimit and
      RateLimit-Policy say what is left, and 429 comes with Retry-After (FR-INT-16).
    - A deprecated operation carries Deprecation, Sunset and a Link to its migration note, at least six
      months before its sunset (FR-INT-06).
    - Every operation states the right it needs (x-fyniq-permission, from PRD-001 Appendix D) and the
      error codes it returns (x-fyniq-error-codes).
  license:
    identifier: MIT
    name: MIT
  title: Fyniq API
  version: 0.0.0 # x-release-please-version
