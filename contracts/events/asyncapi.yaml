# The event catalogue (PRD-001 §12.10, FR-INT-12): one channel and one message per event type, the data schema of each
# in schemas/<type>.schema.json. Written by `go test ./internal/notify -run TestTheEventCatalogue -update` from the
# schemas; edit a schema, then rewrite this file. A breaking change to an event's data is a new version, a new file.
asyncapi: 3.0.0
