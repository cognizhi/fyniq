info:
  contact:
    name: Nemura
    url: https://github.com/cognizhi/fyniq
  description: |-
    Nemura's public API: the optional people platform of PRD-002. Its web app uses only this API (QA-API-03).

    Conventions (PRD-002 NM-ARC-03, PRD-001 §8.18.1):
    - Errors are RFC 9457 problem details (application/problem+json) with a stable code from the catalogue at GET /v1/errors, what is
      wrong, and how to fix it; validation errors list every invalid field at once.
    - Every write that creates or changes state accepts an Idempotency-Key header, kept 24 hours per person: a repeat returns the first
      response with Idempotent-Replayed: true, the same key with a different request returns 422, and two identical requests at once run
      once. A response that may carry pay, a bank account, an NRIC or the text of a question is not stored (only its status is): a repeat
      of such a write that returned a body answers 409 and the result is read from the record.
    - Versioned records return an ETag; commands that change one require If-Match and return 412 when the record changed since, 428
      without it.
    - Changes inside /v1 are additive: a field, an operation or an enum value may be added, and nothing is removed or changed in meaning.
    - Money is a decimal string with its currency, never a JSON number; dates are ISO 8601; IDs are UUIDv7 strings.
  license:
    identifier: MIT
    name: MIT
  title: Nemura API
  version: 0.1.0 # x-release-please-version
openapi: 3.1.0
paths:
  /v1/api-clients:
    get:
      description: "Lists the organisation's live API clients: name, scopes and OAuth client ID, never a key. Only the Owner. It changes nothing."
      operationId: listApiClients
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: List the API clients
      tags:
        - API clients
    post:
      description: Registers a system that calls Nemura's API on its own with the client-credentials grant, signing in with the key pair it holds (private_key_jwt), for the API's audience and the scopes given. Only the Owner, confirmed with a passkey in the last five minutes. It is audited; the private key never reaches Nemura.
      operationId: createApiClient
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
        - description: "A key you choose (a UUID is best) that makes the request safe to send again for 24 hours: a repeat from the same person returns the first answer with `Idempotent-Replayed: true`, the same key with a different request returns 422, and two identical requests at once run once. An operation whose answer may carry pay, a bank account or an NRIC does not store its answer: a repeat of one that returned a body answers 409, and the result is read from the record."
          example: 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
          in: header
          name: Idempotency-Key
          schema:
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
            maxLength: 255
            minLength: 0
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Register an API client
      tags:
        - API clients
  /v1/api-clients/{id}:
    delete:
      description: "Revokes a client: its tokens are deleted and it can sign in no more. Only the Owner, confirmed with a passkey in the last five minutes. It is audited. A client that is not registered is NM_NOT_FOUND."
      operationId: revokeApiClient
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
        - description: The client to revoke.
          in: path
          name: id
          required: true
          schema:
            description: The client to revoke.
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e60
            format: uuid
            type: string
        - description: "A key you choose (a UUID is best) that makes the request safe to send again for 24 hours: a repeat from the same person returns the first answer with `Idempotent-Replayed: true`, the same key with a different request returns 422, and two identical requests at once run once. An operation whose answer may carry pay, a bank account or an NRIC does not store its answer: a repeat of one that returned a body answers 409, and the result is read from the record."
          example: 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
          in: header
          name: Idempotency-Key
          schema:
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
            maxLength: 255
            minLength: 0
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Revoke an API client
      tags:
        - API clients
  /v1/assistant/ask:
    post:
      description: Answers a question about the signed-in person's own leave balance, their pay day, a rule of the Singapore pack (cited, with a note to confirm it with HR when it has not been verified a second time) or what a line of their payslip is, as a rule with no figure. The read tools run as the person asking, so the assistant reads what they can and nothing else; no pay figure and no sealed field reaches a model, and every figure of the answer came from a tool in this turn. A question that asks it to approve, change, issue, pay or read another person's records is refused in words. The assistant must be on. The question is not stored; the audit event names the tools that ran. It changes nothing.
      operationId: askAssistant
      parameters:
        - description: The browser's cookies; the session cookie is read from them.
          in: header
          name: Cookie
          schema:
            description: The browser's cookies; the session cookie is read from them.
            examples:
              - nemura_session=…
            type: string
        - description: "A key you choose (a UUID is best) that makes the request safe to send again for 24 hours: a repeat from the same person returns the first answer with `Idempotent-Replayed: true`, the same key with a different request returns 422, and two identical requests at once run once. An operation whose answer may carry pay, a bank account or an NRIC does not store its answer: a repeat of one that returned a body answers 409, and the result is read from the record."
          example: 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
          in: header
          name: Idempotency-Key
          schema:
            examples:
              - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1faa
            maxLength: 255
            minLength: 0
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAskInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAnswer"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
