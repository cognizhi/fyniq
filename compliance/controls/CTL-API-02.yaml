# CTL-API-02: PRD-001 Appendix F (F.7a). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-API-02
section: "F.7a"
control: "Integration clients have an owner, a class, an expiry and least-privilege scopes"
mapping: "ISO 5.15, 5.18; SOC2 CC6.1–6.3"
automated_check: "Nightly: expired or ownerless clients = 0; quarterly review"
frequency: "N, Q"
evidence: "Client inventory"
owner: Owner
checks:
  - frequency: N
    status: running
    how: "verify integrations.owned"
    evidence: "the latest run in each organisation (fyniq.control_run), nightly: every integration client that is not revoked has an owner who is an active member, a class of integration or agent, an end date that had not passed when the day's window began, and only its class's scopes; each exception is listed by client (target 0)"
  - frequency: Q
    status: running
    how: "attestation access-review"
    evidence: "the quarterly access review (GET /v1/access-review) lists every integration client that is not revoked with its owner, class, scopes and end date, and its attestation records the report's hash (FR-CTL-06, C.2 #7)"
  - frequency: CI
    status: running
    how: "test TestAttackOnlyTheLinkHoldsTheLinkScopes"
    evidence: "the link's seven scopes (identity.sessions.write among them) can be held by the link's client alone: the database refuses each to an integration client, a personal token and an agent, and the link's client an ordinary scope; threat model docs/security/threat-models/nemura-link-identity.md; CI artefact test-report (90 days)"
