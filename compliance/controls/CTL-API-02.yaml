# CTL-API-02: PRD-001 Appendix F (F.7a). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-API-02
section: "F.7a"
control: "Integration clients have an owner, a class, an expiry and least-privilege scopes"
mapping: "ISO 5.15, 5.18; SOC2 CC6.1–6.3"
automated_check: "Nightly: expired or ownerless clients = 0; quarterly review"
frequency: "N, Q"
evidence: "Client inventory"
owner: Owner
checks:
  - frequency: N
    status: planned
    how: "verify integrations.owned"
    arrives: "p1-compliance-center (slice 4)"
  - frequency: Q
    status: running
    how: "check controls.access-review-overdue"
    evidence: "the access review lists the integration clients with their owners and end dates, and an Owner attests it each quarter (FR-CTL-06); overdue 14 days after a quarter ends (C.2 #7); the check's latest result for each organisation, on Checks"
