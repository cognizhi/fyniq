# CTL-FIN-09: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-09
section: "F.1"
control: "Monthly close: checks clean, reconciliations signed, attestation by a non-preparer"
mapping: "COSO P16; SOC2 PI1"
automated_check: "Close cannot complete without them"
frequency: "E (close)"
evidence: "Close record"
owner: Controller
checks:
  - frequency: E
    status: running
    how: "check close.checklist"
    evidence: "the close's checklist is finished before the month closes (C.2 #58); the check's latest result for each organisation, on Checks"
  - frequency: E
    status: running
    how: "check close.month-unclosed"
    evidence: "no month stays open more than 15 days after its end (C.2 #18); the check's latest result for each organisation, on Checks"
  - frequency: E
    status: running
    how: "attestation close-signoff"
    evidence: "each month's close attestation, who gave it and when; on Compliance › Reviews and attestations, the close record on Periods and close"
