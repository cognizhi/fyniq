# The pinned toolchain (PRD-001 §12.8, DEV-03). `make setup` runs `mise install`; CI installs the
# same versions with jdx/mise-action, and the dev container bakes them in (.devcontainer/).
# Change a version here only in a reviewed pull request.
[tools]
go = "1.27.1"
node = "24.21.0"
pnpm = "10.33.3"
python = "3.13.7"
uv = "0.13.1"
typst = "0.15.1"
opentofu = "1.13.1"
golangci-lint = "2.14.0"
watchexec = "2.8.0"
"aqua:pressly/goose" = "3.28.0"           # same version as the goose library in go.mod
sqlc = "1.31.1"
"npm:squawk-cli" = "2.66.0"
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"   # mutation testing (QA-ENG-04)
"go:github.com/oasdiff/oasdiff" = "1.33.0"                      # breaking changes to the API contract (QA-API-02)
# The security scans of `make scan` (SEC-21, CTL-CHG-03, CTL-CHG-11; scripts/scan.py)
"aqua:securego/gosec" = "2.29.0"                                # SAST for Go
"pipx:semgrep" = "1.178.0"                                      # SAST for Go, TypeScript, React, Dockerfiles
"aqua:gitleaks/gitleaks" = "8.30.1"                             # secrets in the history
"aqua:anchore/grype" = "0.119.0"                                # vulnerable dependencies (and images, p0-ci-images-release)
"pipx:checkov" = "3.3.20"                                       # Dockerfiles and workflows (OpenTofu with p0-infra-opentofu)
"go:github.com/google/go-licenses/v2" = "2.0.1"                 # licences of the Go dependencies
"aqua:rhysd/actionlint" = "1.7.12"                              # workflow syntax
"pipx:zizmor" = "1.30.1"                                        # workflow security
"npm:@fission-ai/openspec" = "1.14.1"

[env]
OPENSPEC_TELEMETRY = "0"
