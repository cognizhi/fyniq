# CTL-FIN-04: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-04
section: "F.1"
control: "Subledgers agree with control accounts (AR, AP, payroll, assets, GST)"
mapping: "SOC2 PI1"
automated_check: "Nightly verification job"
frequency: "N"
evidence: "Verification log"
owner: Controller
checks:
  - frequency: N
    status: running
    how: "check ledger.sub-ledgers"
    evidence: "receivables, payables, deposits, prepayments, deferred revenue and the directors' accounts against their control accounts (INV-07, C.2 #2); payroll and GST join with their modules; the check's latest result for each organisation, on Checks"
  - frequency: N
    status: running
    how: "check assets.register"
    evidence: "the asset register against its accounts (C.1 #22); the check's latest result for each organisation, on Checks"
