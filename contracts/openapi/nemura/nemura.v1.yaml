# The contract of Nemura's public API (PRD-002 NM-ARC-03, ADR-N1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    AddDependantInputBody:
      additionalProperties: false
      properties:
        adoption_intent:
          description: The formal intent to adopt, when there is no date of birth yet.
          examples:
            - false
          type: boolean
        birth_date:
          description: The child's date of birth.
          examples:
            - "2025-05-06"
          format: date
          type: string
        citizenship:
          description: The child's citizenship.
          enum:
            - citizen
            - permanent_resident
            - other
          examples:
            - citizen
          type: string
        declared_on:
          description: The day the employee made the declaration.
          examples:
            - "2026-01-02"
          format: date
          type: string
        effective_from:
          description: The day the record starts.
          examples:
            - "2026-01-02"
          format: date
          type: string
        relationship:
          description: How the child is related.
          enum:
            - child
            - adopted_child
            - stepchild
          examples:
            - child
          type: string
      required:
        - relationship
        - citizenship
        - declared_on
        - effective_from
      type: object
    AddDocumentInputBody:
      additionalProperties: false
      properties:
        content_base64:
          description: The file, base64, up to 5 MB.
          examples:
            - JVBERi0xLjQK
          type: string
        content_type:
          description: Its media type.
          examples:
            - application/pdf
          type: string
        doc_type:
          description: The kind of document.
          enum:
            - contract
            - kets
            - letter
            - pass_copy
            - certificate
            - other
          examples:
            - contract
          type: string
        retention_class:
          description: The retention rule it falls under (a key of the retention schedule).
          examples:
            - employment-records
          type: string
        title:
          description: Its title.
          examples:
            - Employment contract
          maxLength: 200
          minLength: 1
          type: string
        viewers:
          description: The roles who may see it; employee means the person themselves.
          examples:
            - - hr_admin
              - employee
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - doc_type
        - title
        - retention_class
        - content_type
        - content_base64
        - viewers
      type: object
    AddPassInputBody:
      additionalProperties: false
      properties:
        expires_on:
          description: The day it expires.
          examples:
            - "2027-12-31"
          format: date
          type: string
        issued_on:
          description: The day it was issued.
          examples:
            - "2026-01-01"
          format: date
          type: string
        number:
          description: The pass number.
          examples:
            - EP12345678
          type: string
        pass_type:
          description: The kind of pass.
          enum:
            - employment_pass
            - s_pass
            - work_permit
            - dp_work_permit
          examples:
            - employment_pass
          type: string
      required:
        - pass_type
        - number
        - issued_on
        - expires_on
      type: object
    AppliedOutputBody:
      additionalProperties: false
      properties:
        days:
          description: The days reserved for it.
          examples:
            - "5.00"
          type: string
        id:
          description: The new request.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e80
          format: uuid
          type: string
      required:
        - id
        - days
      type: object
    AwayPerson:
      additionalProperties: false
      properties:
        from:
          description: Their first day away.
          examples:
            - "2026-04-06"
          format: date
          type: string
        name:
          description: The colleague.
          examples:
            - Ben Lim
          type: string
        to:
          description: Their last day away.
          examples:
            - "2026-04-08"
          format: date
          type: string
      required:
        - name
        - from
        - to
      type: object
    BankChange:
      additionalProperties: false
      properties:
        account_masked:
          description: The proposed account, masked.
          examples:
            - "****7890"
          type: string
        id:
          description: The change.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e73
          format: uuid
          type: string
        person_id:
          description: The person whose account it is.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        state:
          description: Where the change is.
          enum:
            - proposed
            - approved
            - refused
            - confirmed
          examples:
            - proposed
          type: string
      required:
        - id
        - person_id
        - account_masked
        - state
      type: object
    CarryOutputBody:
      additionalProperties: false
      properties:
        carried:
          description: The days carried into the next year; zero when nothing was unused or all was carried already.
          examples:
            - "5.00"
          type: string
      required:
        - carried
      type: object
    ChangeJobInputBody:
      additionalProperties: false
      properties:
        effective_from:
          description: The day the new job record starts; the current one ends that day.
          examples:
            - "2026-09-01"
          format: date
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: The new job record.
      required:
        - effective_from
        - job
      type: object
    ChecksOutputBody:
      additionalProperties: false
      properties:
        findings:
          description: What the people checks found, ✖ first.
          items:
            $ref: "#/components/schemas/Finding"
          type:
            - array
            - "null"
      required:
        - findings
      type: object
    Classification:
      additionalProperties: false
      properties:
        birth_date:
          description: Date of birth, for the retirement and re-employment cohort.
          examples:
            - "1980-03-04"
          format: date
          type: string
        contract_type:
          description: A contract of service (an employee) or for service (a contractor, who gets no statutory employee entitlement).
          enum:
            - service
            - for_service
          examples:
            - service
          type: string
        ea_covered:
          description: Whether the Employment Act covers the person.
          examples:
            - true
          type: boolean
        part_iv_class:
          description: The Part IV class, which needs Employment Act cover.
          enum:
            - none
            - workman
            - non_workman
          examples:
            - none
          type: string
        pr_start_date:
          description: "The day permanent residence began: for a permanent resident only."
          examples:
            - "2024-05-01"
          format: date
          type: string
        residency:
          description: Citizen, permanent resident or foreigner.
          enum:
            - citizen
            - permanent_resident
            - foreigner
          examples:
            - citizen
          type: string
      required:
        - contract_type
        - ea_covered
        - part_iv_class
        - residency
      type: object
    Client:
      additionalProperties: false
      properties:
        audience:
          description: "The audience its tokens name: the API's."
          examples:
            - nemura-api
          type: string
        client_id:
          description: The OAuth client ID the system signs in with at the token endpoint.
          examples:
            - 4f6c1b52-8d2a-4c93-9a43-0c2d7e9b1a11
          type: string
        id:
          description: The client's ID in Nemura.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e60
          format: uuid
          type: string
        name:
          description: The system that calls.
          examples:
            - Payroll bureau
          type: string
        scopes:
          description: What its tokens may do.
          examples:
            - - directory.read
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - scopes
        - client_id
        - audience
      type: object
    ClientsOutputBody:
      additionalProperties: false
      properties:
        clients:
          description: The organisation's live API clients.
          items:
            $ref: "#/components/schemas/Client"
          type:
            - array
            - "null"
      required:
        - clients
      type: object
    Code:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_NOT_FOUND
          type: string
        fix:
          description: The usual way to fix it.
          examples:
            - Choose a code from the catalogue.
          type: string
        status:
          description: The HTTP status the code comes with.
          examples:
            - 404
          format: int64
          type: integer
        title:
          description: A short summary that never changes between occurrences.
          examples:
            - Not found
          type: string
      required:
        - code
        - status
        - title
        - fix
      type: object
    ConfirmInputBody:
      additionalProperties: false
      properties:
        credential:
          additionalProperties: {}
          description: The PublicKeyCredential the browser returned for the step-up, as JSON.
          type: object
      required:
        - credential
      type: object
    ConfirmedOutputBody:
      additionalProperties: false
      properties:
        confirmed:
          description: "True: the session is confirmed with a passkey for the next five minutes."
          examples:
            - true
          type: boolean
      required:
        - confirmed
      type: object
    CreateClientInputBody:
      additionalProperties: false
      properties:
        algorithm:
          description: "The algorithm its assertions are signed with: ES256, RS256 or EdDSA."
          examples:
            - ES256
          type: string
        name:
          description: The system that will call Nemura.
          examples:
            - Payroll bureau
          maxLength: 100
          minLength: 1
          type: string
        public_key:
          additionalProperties: {}
          description: Its public key as a JWK (RFC 7517), never the private key.
          type: object
        scopes:
          description: What its tokens may do, from GET /v1/api-clients/scopes.
          examples:
            - - directory.read
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - name
        - scopes
        - algorithm
        - public_key
      type: object
    CreatePersonInputBody:
      additionalProperties: false
      properties:
        classification:
          $ref: "#/components/schemas/Classification"
          description: Their legal classification, from their start date.
        id:
          description: The new person's ID, chosen by the caller so a repeat is refused, not done twice.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        job:
          $ref: "#/components/schemas/JobInput"
          description: Their first job, from their start date.
        person:
          $ref: "#/components/schemas/PersonInput"
          description: Their own fields.
      required:
        - id
        - person
        - job
      type: object
    CreatedOutputBody:
      additionalProperties: false
      properties:
        id:
          description: The new record.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e70
          format: uuid
          type: string
      required:
        - id
      type: object
    DayCost:
      additionalProperties: false
      properties:
        cost:
          description: "Days it costs: 1.00, 0.50 or 0.00."
          examples:
            - "0.00"
          type: string
        date:
          description: The day.
          examples:
            - "2026-04-03"
          format: date
          type: string
        why:
          description: "Why it costs nothing: a rest day or the name of the public holiday."
          examples:
            - Good Friday
          type: string
      required:
        - date
        - cost
      type: object
    DecideBankInputBody:
      additionalProperties: false
      properties:
        approve:
          description: Whether to approve the change.
          examples:
            - true
          type: boolean
        reason:
          description: "Why it is refused: required for a refusal."
          examples:
            - The number does not match the bank letter.
          maxLength: 2000
          type: string
      required:
        - approve
      type: object
    DecideInputBody:
      additionalProperties: false
      properties:
        key:
          description: The row's key.
          examples:
            - "1"
          type: string
        reason:
          description: Why the company uses the researched value.
          examples:
            - We read MOM's page and it matches our contracts.
          maxLength: 2000
          minLength: 10
          type: string
        table:
          description: The table of the pack.
          examples:
            - annual_leave
          type: string
      required:
        - table
        - key
        - reason
      type: object
    DecisionInputBody:
      additionalProperties: false
      properties:
        decision:
          description: Approve or refuse.
          enum:
            - approve
            - refuse
          examples:
            - approve
          type: string
        reason:
          description: Why; required to refuse.
          examples:
            - The release freezes that week.
          maxLength: 500
          type: string
      required:
        - decision
      type: object
    Dependant:
      additionalProperties: false
      properties:
        adoption_intent:
          description: The formal intent to adopt, instead of a date of birth.
          examples:
            - false
          type: boolean
        birth_date:
          description: The child's date of birth; hidden at the masked level.
          examples:
            - "2025-05-06"
          format: date
          type: string
        citizenship:
          description: The child's citizenship.
          enum:
            - citizen
            - permanent_resident
            - other
          examples:
            - citizen
          type: string
        effective_from:
          description: The day the record starts.
          examples:
            - "2026-01-02"
          format: date
          type: string
        effective_to:
          description: The day it ends.
          examples:
            - "2030-01-02"
          format: date
          type: string
        id:
          description: The dependant record.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e71
          format: uuid
          type: string
        relationship:
          description: How the child is related.
          enum:
            - child
            - adopted_child
            - stepchild
          examples:
            - child
          type: string
      required:
        - id
        - relationship
        - adoption_intent
        - citizenship
        - effective_from
      type: object
    DependantsOutputBody:
      additionalProperties: false
      properties:
        dependants:
          description: The person's dependants.
          items:
            $ref: "#/components/schemas/Dependant"
          type:
            - array
            - "null"
      required:
        - dependants
      type: object
    DirectoryEntry:
      additionalProperties: false
      properties:
        department:
          description: Their department on the day asked.
          examples:
            - Engineering
          type: string
        id:
          description: The person's ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          format: uuid
          type: string
        job_title:
          description: Their job title on the day asked.
          examples:
            - Engineer
          type: string
        manager_id:
          description: Their line manager's ID on the day asked.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e62
          format: uuid
          type: string
        manager_name:
          description: Their line manager's name.
          examples:
            - Ben Lim
          type: string
        name:
          description: The legal name.
          examples:
            - Ana Tan
          type: string
        preferred_name:
          description: The name they go by.
          examples:
            - Anna
          type: string
        work_email:
          description: Their work email.
          examples:
            - ana@acme.example
          type: string
      required:
        - id
        - name
      type: object
    DirectoryOutputBody:
      additionalProperties: false
      properties:
        people:
          description: Everyone who works for the organisation on the day, by name.
          items:
            $ref: "#/components/schemas/DirectoryEntry"
          type:
            - array
            - "null"
      required:
        - people
      type: object
    Document:
      additionalProperties: false
      properties:
        content_type:
          description: Its media type.
          examples:
            - application/pdf
          type: string
        created_at:
          description: When it was added.
          examples:
            - "2026-01-05T09:00:00Z"
          format: date-time
          type: string
        doc_type:
          description: The kind of document.
          enum:
            - contract
            - kets
            - letter
            - pass_copy
            - certificate
            - other
          examples:
            - contract
          type: string
        id:
          description: The document.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e72
          format: uuid
          type: string
        retention_class:
          description: The retention rule it falls under.
          examples:
            - employment-records
          type: string
        size_bytes:
          description: Its size in bytes.
          examples:
            - 20480
          format: int64
          type: integer
        title:
          description: Its title.
          examples:
            - Employment contract
          type: string
        viewers:
          description: The roles who may see it.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - doc_type
        - title
        - retention_class
        - content_type
        - size_bytes
        - viewers
        - created_at
      type: object
    DocumentOutputBody:
      additionalProperties: false
      properties:
        content_base64:
          description: The file, base64.
          examples:
            - JVBERi0xLjQK
          type: string
        content_type:
          description: Its media type.
          examples:
            - application/pdf
          type: string
      required:
        - content_type
        - content_base64
      type: object
    DocumentsOutputBody:
      additionalProperties: false
      properties:
        documents:
          description: The documents the caller may see.
          items:
            $ref: "#/components/schemas/Document"
          type:
            - array
            - "null"
      required:
        - documents
      type: object
    ErrorsOutputBody:
      additionalProperties: false
      properties:
        codes:
          description: Every stable error code, in order.
          items:
            $ref: "#/components/schemas/Code"
          type:
            - array
            - "null"
      required:
        - codes
      type: object
    Feature:
      additionalProperties: false
      properties:
        external_system:
          description: The system that holds its data, when external.
          examples:
            - Acme Payroll
          type: string
        id:
          description: The feature's key.
          examples:
            - leave
          type: string
        name:
          description: As the screen names it.
          examples:
            - Leave
          type: string
        needs:
          description: The features that must be on, or external, for this one to be on.
          items:
            type: string
          type:
            - array
            - "null"
        phase:
          description: When it is built; a feature of a later phase cannot be switched on yet.
          enum:
            - P1
            - P2
            - P3
          examples:
            - P1
          type: string
        state:
          description: On, off, or held by another system.
          enum:
            - "on"
            - "off"
            - external
          examples:
            - "on"
          type: string
      required:
        - id
        - name
        - phase
        - state
        - needs
      type: object
    FeaturesOutputBody:
      additionalProperties: false
      properties:
        features:
          description: Every optional feature, in the order the screen shows them. People records is always on and is not listed.
          items:
            $ref: "#/components/schemas/Feature"
          type:
            - array
            - "null"
      required:
        - features
      type: object
    FieldProblem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - NM_INVALID
          type: string
        field:
          description: "The JSON path of the field: in the request body (body.…), the query (query.…), the path (path.…) or a header (header.…)."
          examples:
            - path.code
          type: string
        fix:
          description: How to fix it.
          examples:
            - Error codes look like NM_NOT_FOUND.
          type: string
        message:
          description: What is wrong with it.
          examples:
            - is not an error code
          type: string
      required:
        - code
        - field
        - message
        - fix
      type: object
    Finding:
      additionalProperties: false
      properties:
        area:
          description: People or Packs.
          examples:
            - People
          type: string
        check:
          description: The row of Appendix C N.1.
          examples:
            - 3
          format: int64
          type: integer
        message:
          description: What is wrong and how to fix it, in plain words.
          examples:
            - "A work pass expires on 2026-12-20: record the renewed pass or the leaving date."
          type: string
        status:
          description: Fail blocks, warn needs a look, due is coming up.
          enum:
            - fail
            - warn
            - due
          examples:
            - fail
          type: string
        subject:
          description: "What it is about: a person's ID or a pack version."
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e61
          type: string
      required:
        - check
        - area
        - status
        - subject
        - message
      type: object
    InfoOutputBody:
      additionalProperties: false
      properties:
        service:
          description: The service this answers as.
          examples:
            - nemura-api
          type: string
        version:
          description: The build's version.
          examples:
            - 0.1.0
          type: string
      required:
        - service
        - version
      type: object
    Item:
      additionalProperties: false
      properties:
        arrangement:
          description: How it will be handled instead.
          examples:
            - Approved in the old system until 31 Jan
          maxLength: 500
          type: string
        what:
          description: The outstanding thing, as the refusal named it.
          examples:
            - leave requests waiting for approval
          type: string
      required:
        - what
        - arrangement
      type: object
    Job:
      additionalProperties: false
      properties:
        department:
          description: The department.
          examples:
            - Engineering
          type: string
        effective_from:
          description: The day this job record starts.
          examples:
            - "2026-04-01"
          format: date
          type: string
        effective_to:
          description: The day it ends (the day the next starts); empty while current.
          examples:
            - "2026-09-01"
          format: date
          type: string
        employment_type:
          description: The kind of employment.
          enum:
            - full_time
            - part_time
            - contract
            - intern
          examples:
            - full_time
          type: string
        job_title:
          description: The job title.
          examples:
            - Senior Engineer
          type: string
        manager_id:
          description: The line manager's person ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e62
          format: uuid
          type: string
        worksite:
          description: The worksite's country code and optional region.
          examples:
            - SG
          type: string
      required:
        - effective_from
        - job_title
        - worksite
        - employment_type
      type: object
    JobInput:
      additionalProperties: false
      properties:
        department:
          description: The department.
          examples:
            - Engineering
          maxLength: 200
          type: string
        employment_type:
          description: The kind of employment.
          enum:
            - full_time
            - part_time
            - contract
            - intern
          examples:
            - full_time
          type: string
        job_title:
          description: The job title.
          examples:
            - Engineer
          maxLength: 200
          minLength: 1
          type: string
        manager_id:
          description: The line manager's person ID.
          examples:
            - 0194f5a0-7c3e-7d11-8b3e-3f5c2a9d1e62
          format: uuid
          type: string
        worksite:
          description: The worksite's country code and optional region.
          examples:
            - SG
          type: string
      required:
        - job_title
        - worksite
        - employment_type
      type: object
    LeaveAsk:
      additionalProperties: false
      properties:
        end_half:
          description: Only half of the last day.
          examples:
            - false
          type: boolean
        from:
          description: The first day.
          examples:
            - "2026-04-06"
          format: date
          type: string
        note:
