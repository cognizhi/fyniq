# The contract of Fyniq's public API (PRD-001 §8.18, ADR-T1): OpenAPI 3.1, as the code serves it at
# /v1/openapi.json. Reviewed in every pull request that changes it: CI fails when the code and this file
# differ. Regenerate it with `make openapi` and review the diff; never edit it by hand.
# info.version follows the platform version (release-please updates it).
components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        active:
          description: An inactive account takes no new postings.
          examples:
            - true
          type: boolean
        code:
          description: The account code.
          examples:
            - "6100"
          type: string
        group:
          description: "A group account is a heading: postings go to the accounts under it."
          examples:
            - false
          type: boolean
        id:
          description: The account's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          format: uuid
          type: string
        name:
          description: The account name.
          examples:
            - Rent
          type: string
        parent_id:
          description: The group account it sits under, or null.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d61
          format: uuid
          type:
            - string
            - "null"
        type:
          description: The account type.
          enum:
            - asset
            - liability
            - equity
            - revenue
            - expense
          examples:
            - expense
          type: string
        version:
          description: The record's version; it also makes the ETag.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - code
        - name
        - type
        - parent_id
        - group
        - active
        - version
      type: object
    AccountPage:
      additionalProperties: false
      properties:
        items:
          description: The accounts on this page, by code.
          items:
            $ref: "#/components/schemas/Account"
          type:
            - array
            - "null"
        next_cursor:
          description: Send it as cursor for the next page; absent on the last page.
          examples:
            - eyJhZnRlciI6IjYxMDAifQ
          type: string
      required:
        - items
      type: object
    BulkResult:
      additionalProperties: false
      properties:
        etag:
          description: The saved record's ETag, for If-Match; absent when the item was refused or previewed.
          examples:
            - "\"1-draft\""
          type: string
        id:
          description: The saved record's ID; absent when the item was refused or previewed.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d70
          format: uuid
          type: string
        index:
          description: The item's position in the request, from 0.
          examples:
            - 0
          format: int64
          type: integer
        problem:
          $ref: "#/components/schemas/Problem"
          description: Why the item was refused (RFC 9457), with its stable code; absent when it was saved or previewed.
        status:
          description: "What the item's own request would have answered: 201 saved, 200 previewed (nothing saved), or the status of its problem."
          examples:
            - 201
          format: int64
          type: integer
      required:
        - index
        - status
      type: object
    BulkResults:
      additionalProperties: false
      properties:
        refused:
          description: How many items were refused; each has its problem in results.
          examples:
            - 2
          format: int64
          type: integer
        results:
          description: One result per item, in the order sent; an item is never left out.
          items:
            $ref: "#/components/schemas/BulkResult"
          type:
            - array
            - "null"
        saved:
          description: How many items were saved (or, in a preview, would be).
          examples:
            - 998
          format: int64
          type: integer
      required:
        - results
        - saved
        - refused
      type: object
    Entry:
      additionalProperties: false
      properties:
        id:
          description: The entry's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d80
          format: uuid
          type: string
        ledger_revision:
          description: The organisation's ledger revision this entry made (ENG-46).
          examples:
            - 42
          format: int64
          type: integer
        lines:
          description: Its lines.
          items:
            $ref: "#/components/schemas/EntryLine"
          type:
            - array
            - "null"
        memo:
          description: The entry's memo.
          examples:
            - October rent accrual
          type: string
        period_id:
          description: The accounting period it falls in.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d90
          format: uuid
          type: string
        posting_date:
          description: The date it posts on.
          examples:
            - "2026-10-31"
          format: date
          type: string
        posting_identity:
          description: "What was posted, under which rule: the same thing never posts twice."
          examples:
            - manual_journal:01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d70:v1:journal@1
          type: string
        recorded_at:
          description: When it was recorded.
          examples:
            - "2026-10-31T09:30:00Z"
          format: date-time
          type: string
        reverses_entry_id:
          description: For a reversal, the entry it reverses.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d81
          format: uuid
          type: string
        rule_version:
          description: The posting rule and its version (ENG-03).
          examples:
            - journal@1
          type: string
      required:
        - id
        - ledger_revision
        - posting_date
        - period_id
        - posting_identity
        - rule_version
        - recorded_at
        - lines
      type: object
    EntryLine:
      additionalProperties: false
      properties:
        account_id:
          description: The account posted to.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          format: uuid
          type: string
        amount:
          $ref: "#/components/schemas/Money"
          description: "In the line's currency: debit positive, credit negative."
        base_amount:
          $ref: "#/components/schemas/Money"
          description: In the base currency, computed once at posting (RND-FX).
        description:
          description: What the line is for.
          examples:
            - October office rent
          type: string
        fx_rate:
          description: Base currency per unit of the line's currency (1 for the base currency).
          examples:
            - "1"
          type: string
        fx_rate_source:
          description: Where the rate came from.
          examples:
            - base
          type: string
        line_no:
          description: The line's number in the entry.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - line_no
        - account_id
        - amount
        - fx_rate
        - fx_rate_source
        - base_amount
      type: object
    FieldProblem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code.
          examples:
            - LEDGER-04
          type: string
        field:
          description: "The JSON path of the field: in the request body (body.…), the query (query.…), a header (header.…), or the saved record a command acts on."
          examples:
            - lines[0].account_id
          type: string
        fix:
          description: How to fix it.
          examples:
            - Choose an account from the chart of accounts
          type: string
        message:
          description: What is wrong with it.
          examples:
            - the account does not exist in this organisation
          type: string
      required:
        - code
        - field
        - message
        - fix
      type: object
    Journal:
      additionalProperties: false
      properties:
        date:
          description: The date it belongs to.
          examples:
            - "2026-10-31"
          format: date
          type: string
        id:
          description: The journal's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d70
          format: uuid
          type: string
        lines:
          description: The lines as entered.
          items:
            $ref: "#/components/schemas/JournalLineDraft"
          type:
            - array
            - "null"
        memo:
          description: What it is for.
          examples:
            - October rent accrual
          type: string
        status:
          description: Draft (✎), posted, or reversed by a reversing entry.
          enum:
            - draft
            - posted
            - reversed
          examples:
            - draft
          type: string
        version:
          description: The version of its content; with the status it makes the ETag.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - status
        - version
        - lines
      type: object
    JournalDraft:
      additionalProperties: false
      properties:
        date:
          description: The date the journal belongs to.
          examples:
            - "2026-10-31"
          format: date
          type: string
        lines:
          description: Debits positive, credits negative.
          items:
            $ref: "#/components/schemas/JournalLineDraft"
          maxItems: 1000
          type:
            - array
            - "null"
        memo:
          description: What the journal is for.
          examples:
            - October rent accrual
          maxLength: 1000
          type: string
      required:
        - lines
      type: object
    JournalDrafts:
      additionalProperties: false
      properties:
        items:
          description: Up to 250 drafts, each saved on its own (FR-INT-11).
          items:
            $ref: "#/components/schemas/JournalDraft"
          maxItems: 250
          minItems: 1
          type:
            - array
            - "null"
      required:
        - items
      type: object
    JournalLineDraft:
      additionalProperties: false
      properties:
        account_id:
          description: "The account to post to: a leaf account, active."
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d60
          format: uuid
          type: string
        amount:
          $ref: "#/components/schemas/Money"
          description: Debit positive, credit negative, in the line's currency.
        description:
          description: What the line is for.
          examples:
            - October office rent
          maxLength: 500
          type: string
        fx_rate:
          description: "Only for a line not in the base currency: base currency per unit of the line's currency. A base-currency line takes none; posting refuses one (ENG-03)."
          examples:
            - "1.3472"
          pattern: ^(0|[1-9][0-9]{0,9})(\.[0-9]{1,10})?$
          type: string
        fx_rate_source:
          description: Where the rate came from. A rate you send is the document's, so its source is document, set for you when you leave it out; any other source is refused (ENG-03, ENG-40).
          examples:
            - document
          maxLength: 100
          type: string
      required:
        - account_id
        - amount
      type: object
    JournalPosting:
      additionalProperties: false
      properties:
        entry:
          $ref: "#/components/schemas/Entry"
          description: "The entry the command posted: the journal's entry, or its reversing entry."
        journal:
          $ref: "#/components/schemas/Journal"
          description: The journal after the command.
      required:
        - journal
        - entry
      type: object
    Money:
      additionalProperties: false
      allOf:
        - if:
            properties:
              currency:
                enum:
                  - JPY
                  - KRW
                  - VND
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})$
        - if:
            properties:
              currency:
                enum:
                  - AUD
                  - CAD
                  - CHF
                  - CNY
                  - EUR
                  - GBP
                  - HKD
                  - IDR
                  - INR
                  - MYR
                  - NZD
                  - PHP
                  - SGD
                  - THB
                  - TWD
                  - USD
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
        - if:
            properties:
              currency:
                enum:
                  - BHD
                  - KWD
                  - OMR
                  - TND
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,3})?$
        - if:
            properties:
              currency:
                enum:
                  - CLF
            required:
              - currency
          then:
            properties:
              amount:
                pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,4})?$
      properties:
        amount:
          description: "An exact decimal: debits positive, credits negative; at most the currency's decimals."
          examples:
            - "1250.00"
          pattern: ^-?(0|[1-9][0-9]{0,15})(\.[0-9]{1,4})?$
          type: string
        currency:
          description: The ISO 4217 currency code.
          examples:
            - SGD
          pattern: ^[A-Z]{3}$
          type: string
      required:
        - amount
        - currency
      type: object
    NewOrganisation:
      additionalProperties: false
      properties:
        base_currency:
          description: The ISO 4217 currency its books are kept in.
          examples:
            - SGD
          pattern: ^[A-Z]{3}$
          type: string
        name:
          description: The organisation's name.
          examples:
            - Northwind Analytics Pte. Ltd.
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
        - base_currency
      type: object
    NewSuperAdmin:
      additionalProperties: false
      properties:
        recovery_codes:
          description: "Ten recovery codes, each usable once. They are shown once: print them and keep them offline. With the other Super admin's confirmation, one gives your access back if you lose your sign-in (FR-ADM-09). Any earlier unused codes no longer work."
          items:
            description: A recovery code, usable once.
            examples:
              - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
        user_id:
          description: "Your user: now a Super admin."
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d04
          format: uuid
          type: string
      required:
        - user_id
        - recovery_codes
      type: object
    OneTimeCode:
      additionalProperties: false
      properties:
        code:
          description: The one-time code. It is shown once and cannot be shown again; give it to the person it is for by a channel you trust. Case, spaces and dashes do not matter.
          examples:
            - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
          type: string
        expires_at:
          description: When the code stops working, if unused.
          examples:
            - "2026-10-22T09:00:00Z"
          format: date-time
          type: string
      required:
        - code
        - expires_at
      type: object
    Organisation:
      additionalProperties: false
      properties:
        base_currency:
          description: The currency the books are kept in.
          examples:
            - SGD
          type: string
        base_minor_units:
          description: How many decimals the base currency has.
          examples:
            - 2
          format: int64
          type: integer
        id:
          description: The organisation's ID.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d5e
          format: uuid
          type: string
        name:
          description: Its name.
          examples:
            - Northwind Analytics Pte. Ltd.
          type: string
        version:
          description: The record's version; it also makes the ETag.
          examples:
            - 1
          format: int64
          type: integer
      required:
        - id
        - name
        - base_currency
        - base_minor_units
        - version
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable error code (ENG-23).
          examples:
            - JOURNAL-02
          type: string
        detail:
          description: What went wrong this time, in plain English.
          examples:
            - The journal is posted, not a draft.
          type: string
        errors:
          description: Every invalid field, all at once.
          items:
            $ref: "#/components/schemas/FieldProblem"
          type:
            - array
            - "null"
        fix:
          description: How to fix it.
          examples:
            - Only a draft can be posted; reverse a posted journal instead.
          type: string
        instance:
          description: The request this occurrence belongs to; quote it to support.
          examples:
            - urn:fyniq:request:01JA2B3C4D5E6F7G8H9J0K1M2N
          format: uri
          type: string
        status:
          description: The HTTP status code.
          examples:
            - 409
          format: int64
          type: integer
        title:
          description: A short summary of the problem type; it never changes between occurrences.
          examples:
            - The journal is not a draft
          type: string
        type:
          description: A URI naming the problem; one per code.
          examples:
            - urn:fyniq:problem:JOURNAL-02
          format: uri
          type: string
      required:
        - type
        - title
        - status
        - detail
        - code
      type: object
    RecoveredSuperAdmin:
      additionalProperties: false
      properties:
        recovery_codes:
          description: "Ten recovery codes, each usable once. They are shown once: print them and keep them offline. With the other Super admin's confirmation, one gives your access back if you lose your sign-in (FR-ADM-09). Any earlier unused codes no longer work."
          items:
            description: A recovery code, usable once.
            examples:
              - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
        user_id:
          description: Your user.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d01
          format: uuid
          type: string
      required:
        - user_id
        - recovery_codes
      type: object
    RecoveryCodes:
      additionalProperties: false
      properties:
        recovery_codes:
          description: "Ten recovery codes, each usable once. They are shown once: print them and keep them offline. With the other Super admin's confirmation, one gives your access back if you lose your sign-in (FR-ADM-09). Any earlier unused codes no longer work."
          items:
            description: A recovery code, usable once.
            examples:
              - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
      required:
        - recovery_codes
      type: object
    Reversal:
      additionalProperties: false
      properties:
        date:
          description: The date of the reversing entry; it must be in an open period.
          examples:
            - "2026-11-01"
          format: date
          type: string
        reason:
          description: Why it is reversed; the audit trail records it (FR-GL-12).
          examples:
            - Posted to the wrong account
          maxLength: 500
          minLength: 1
          type: string
      required:
        - date
        - reason
      type: object
    SessionInfo:
      additionalProperties: false
      properties:
        organisation_id:
          description: The organisation your session is in; absent when you are a member of none.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d02
          format: uuid
          type: string
        provider:
          description: The sign-in provider of a browser session (FR-ADM-08); absent for a local dev token.
          examples:
            - google
          type: string
        roles:
          description: Your roles in that organisation (PRD-001 §7.1); they are read on every request, so a change applies at once.
          items:
            description: A role of PRD-001 §7.1, such as owner, accountant or bookkeeper.
            examples:
              - owner
            type: string
          type:
            - array
            - "null"
        stepped_up_until:
          description: Until when your last step-up (a second factor at sign-in) counts for the actions that need one; absent when it does not.
          examples:
            - "2026-10-15T09:05:00Z"
          format: date-time
          type: string
        super_admin:
          description: Whether you are a Super admin of this installation (FR-ADM-07).
          examples:
            - false
          type: boolean
        user_id:
          description: Your Fyniq user; absent until you have one (a new installation before setup, or before you accept an invitation).
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d01
          format: uuid
          type: string
      required:
        - roles
        - super_admin
      type: object
    SetupRequest:
      additionalProperties: false
      properties:
        display_name:
          description: Your name, as other users will see it.
          examples:
            - Mei Ling Tan
          maxLength: 200
          minLength: 1
          type: string
        organisation:
          $ref: "#/components/schemas/NewOrganisation"
          description: The first organisation; you become its Owner.
        setup_code:
          description: The one-time code created at deployment (printed by migrate setup-code; Secret Manager in the cloud). Case, spaces and dashes do not matter.
          examples:
            - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
          maxLength: 100
          minLength: 20
          type: string
      required:
        - setup_code
        - display_name
        - organisation
      type: object
    SetupResult:
      additionalProperties: false
      properties:
        installation_organisation_id:
          description: The installation's own audit trail.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d03
          format: uuid
          type: string
        organisation_id:
          description: The first organisation, of which you are the Owner.
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d02
          format: uuid
          type: string
        recovery_codes:
          description: "Ten recovery codes, each usable once. They are shown once: print them and keep them offline. With the other Super admin's confirmation, one gives your access back if you lose your sign-in (FR-ADM-09). Any earlier unused codes no longer work."
          items:
            description: A recovery code, usable once.
            examples:
              - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
            type: string
          maxItems: 10
          minItems: 10
          type:
            - array
            - "null"
        user_id:
          description: "Your user: the Super admin."
          examples:
            - 01928f6e-7a3b-7c41-9d2e-5f8a1b3c4d01
          format: uuid
          type: string
      required:
        - user_id
        - organisation_id
        - installation_organisation_id
        - recovery_codes
      type: object
    SetupStatus:
      additionalProperties: false
      properties:
        done:
          description: Whether first-run setup has been completed; the setup wizard shows only while it has not.
          examples:
            - false
          type: boolean
      required:
        - done
      type: object
    SignInProvider:
      additionalProperties: false
      properties:
        id:
          description: "The provider's ID: the web app sends the browser to /api/auth/signin?provider=<id> to sign in with it."
          examples:
            - google
          type: string
        name:
          description: The provider's name, as the sign-in page shows it.
          examples:
            - Google
          type: string
      required:
        - id
        - name
      type: object
    SignInProviders:
      additionalProperties: false
      properties:
        items:
          description: The providers, in the order to offer them; empty when sign-in is not configured.
          items:
            $ref: "#/components/schemas/SignInProvider"
          type:
            - array
            - "null"
        next_cursor:
          description: Send it as cursor for the next page; absent on the last page.
          examples:
            - eyJhZnRlciI6Imdvb2dsZSJ9
          type: string
      required:
        - items
      type: object
    SuperAdminInvitation:
      additionalProperties: false
      properties:
        display_name:
          description: Your name, as other users will see it; ignored when you are a user already.
          examples:
            - Wei Jie Lim
          maxLength: 200
          minLength: 1
          type: string
        invitation_code:
          description: The invitation a Super admin created for you. Case, spaces and dashes do not matter.
          examples:
            - ABCDE-FGHIJ-KLMNO-PQRST-UVWXY-Z
          maxLength: 100
          minLength: 20
          type: string
      required:
        - invitation_code
        - display_name
      type: object
    SuperAdminRecovery:
      additionalProperties: false
      properties:
        confirmation_code:
          description: The other Super admin's confirmation of your recovery, or the deployment recovery code (docs/runbooks/super-admin-recovery.md).
          examples:
            - FGHIJ-KLMNO-PQRST-UVWXY-ZABCD-E
          maxLength: 100
          minLength: 20
          type: string
        recovery_code:
          description: One of your printed recovery codes. Required with the other Super admin's confirmation; optional with a deployment recovery.
