paths:
  /v1/accounts:
    get:
      description: Returns the organisation's accounts by code, a page at a time (cursor pagination). Read-only; no side effects.
      operationId: listAccounts
      parameters:
        - description: How many items per page, up to 500.
          explode: false
          in: query
          name: page_size
          schema:
            default: 100
            description: How many items per page, up to 500.
            examples:
              - 100
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: The next_cursor of the previous page; leave it out for the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: The next_cursor of the previous page; leave it out for the first page.
            examples:
              - eyJhZnRlciI6IjEwMDAifQ
            maxLength: 1000
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
          description: OK
          headers:
            RateLimit:
              description: What is left of the limit (r) and the seconds until the window ends (t).
              schema:
                examples:
                  - "\"reads\";r=599;t=42"
                type: string
            RateLimit-Policy:
              description: "The client's limits a minute in this organisation: reads (GET) or writes (FR-INT-16; draft-ietf-httpapi-ratelimit-headers)."
              schema:
                examples:
                  - "\"reads\";q=600;w=60"
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: `API-AUTH-01` Sign-in required."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: `API-AUTHZ-01` Not allowed for your roles; `API-AUTHZ-02` No organisation; `API-AUTHZ-03` Operation not authorised."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: `API-CURSOR-01` The cursor is not valid; `API-INPUT-02` A field is not valid."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Too Many Requests: `API-RATE-01` Too many requests."
          headers:
            RateLimit:
              description: What is left of the limit (r) and the seconds until the window ends (t).
              schema:
                examples:
                  - "\"reads\";r=599;t=42"
                type: string
            RateLimit-Policy:
              description: "The client's limits a minute in this organisation: reads (GET) or writes (FR-INT-16; draft-ietf-httpapi-ratelimit-headers)."
              schema:
                examples:
                  - "\"reads\";q=600;w=60"
                type: string
            Retry-After:
              description: Seconds to wait before sending the request again.
              schema:
                examples:
                  - "42"
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: `API-FAILURE-01` Something went wrong."
      summary: List the chart of accounts
      tags:
        - Chart of accounts
      x-fyniq-error-codes:
        - API-AUTH-01
        - API-AUTHZ-01
        - API-AUTHZ-02
        - API-AUTHZ-03
        - API-CURSOR-01
        - API-FAILURE-01
        - API-INPUT-02
        - API-RATE-01
      x-fyniq-permission:
        capability: Chart of accounts, dimensions
        right: V
    post:
      description: "Adds an account to the chart (FR-COA-01, FR-COA-02), as a leaf or as a group under which others sit (FR-COA-05). Its code, type and role never change. Side effects: the account and its audit event. Approval policy: the Owner and the Controller approve chart changes once the approval engine arrives (P1). Idempotent with Idempotency-Key; Prefer: return=preview checks it and saves nothing."
      operationId: createAccount
      parameters:
        - description: "A key you choose (a UUID is best) that makes the request safe to send again for 24 hours: a repeat returns the original response, and the same key with a different request returns 422 (FR-INT-08)."
          in: header
