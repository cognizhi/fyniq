# Merge gates (PRD-001 §12.8, §16.2). Job names are required checks on main: rename only together
# with branch protection. p0-ci-images-release adds images, scans and the release path.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: Conventional Commits (REL-01)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, pinned by commit (SEC-28)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title (squash merges use it)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          scripts/hooks/commit-msg "$RUNNER_TEMP/pr-title"
      - name: Commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"   # first push: check every commit reachable from HEAD
          else
            RANGE="$BASE..$HEAD"
          fi
          scripts/check-commits.sh "$RANGE"

  checks:
    name: Design tokens and configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: make check

  test:
    name: Go, web and checks (make test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # jdx/mise-action v5.1.2, pinned by commit (SEC-28): installs the toolchain of mise.toml
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: pnpm install --frozen-lockfile
      - run: make test

  mutation:
    name: Mutation tests (make mutation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: make mutation   # QA-ENG-04: efficacy of at least 90% on money, rounding and the engine

  e2e:
    name: Web smoke test (make test-e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      - run: pnpm install --frozen-lockfile
      - run: make test-e2e   # uses the runner's Google Chrome; no browser download

  local-mode:
    name: Local mode timings (make setup && make dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Only mise itself: `make setup` installs the toolchain inside the timed first run (DEV-01).
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install: false
          cache: false
      - run: scripts/devx-timing.sh
      - if: failure()
        run: tail -n 50 .data/devx-*.log .data/dev/*.log || true

  devcontainer:
    name: Dev container builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -f .devcontainer/Dockerfile -t fyniq-devcontainer .
      - run: docker run --rm fyniq-devcontainer bash -lc 'cd /tmp/toolchain && mise ls --current'
