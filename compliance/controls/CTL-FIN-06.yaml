# CTL-FIN-06: PRD-001 Appendix F (F.1). The fields from section to evidence are the PRD's row,
# kept equal to it by `make check` (scripts/controls.py sync rewrites them); owner and checks are ours.
id: CTL-FIN-06
section: "F.1"
control: "Statutory parameter packs are sourced, dual-approved and pinned-tested"
mapping: "IRAS; CPF Act; SOC2 PI1"
automated_check: "CI fails if the current year's pack is missing, unsourced or fails pinned tests"
frequency: "CI, E (January)"
evidence: "Pack record; test report"
owner: Controller
checks:
  - frequency: CI
    status: planned
    arrives: "P1"
  - frequency: E
    status: planned
    arrives: "P1"
