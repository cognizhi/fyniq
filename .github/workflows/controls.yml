# Scheduled control checks (PRD-001 Appendix F, compliance/controls/): the ones that read the
# repository's settings rather than its code. Each leaves its report as an artefact (the evidence).
name: controls

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 1 * * *"   # daily
  workflow_dispatch:

permissions: {}

jobs:
  repo-settings:
    name: Repository settings and merge audit (CTL-CHG-01)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/repo-check.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: control-ctl-chg-01
          path: .data/controls/
          retention-days: 90   # the most GitHub keeps for a public repository; the evidence bucket arrives with p0-infra-opentofu
