# Nemura's personal-data inventory (PRD-002 NM-SEC-03; PRD-001 CMP-PD-02): each class of personal data Nemura holds, what it is, why,
# where, who reads it, how long it is kept, and how it is protected. internal/nemura/datacat keeps it complete: every column of
# Nemura's schema whose name looks personal is in a class here (and in the code's registry) or marked not personal with why, and a
# test fails when this file and the registry differ. A record type that arrives with a later change adds its class in the same commit.
schema: nemura-data-inventory@1
classes:
  - key: members
    what: "Members' display names, the people each organisation's Nemura knows, and their roles and reporting lines"
    why: "To let people sign in and do their work, to name who did what, and to route approvals and leave to their manager"
    where: "Nemura's database, in Singapore (Cloud SQL, asia-southeast1; locally the developer's database)"
    who: "Appendix B's directory: every member sees colleagues' names; roles and reporting lines by Appendix B"
    retention: "While a member and for the audit trail's retention afterwards; a name in an audit event stays with it"
    protection: "Row-level security per organisation; the audit trail's personal values are masked or sealed (SEC-15, AUD-02)"
    transfers: "None"
    columns: [member.display_name]
  - key: sign-in-identities
    what: "Each person's name at the identity provider: its issuer, subject and tenant, and the invitations and sessions that let them in (kept as hashes)"
    why: "To recognise a person who signs in, never by email alone, and to keep them signed in until they sign out or are deactivated"
    where: "Nemura's database, in Singapore; the identity provider is the deployment's (Identity Platform, or the local sign-in page)"
    who: "The person themselves and the services that authenticate them; no role reads the directory directly"
    retention: "Kept while a member; a deactivated member's identity is switched off and kept for the audit trail"
    protection: "A global table no application role can read, reached only through functions that return the caller's own memberships; tokens and codes kept only as SHA-256"
    transfers: "The identity provider: the flow sign-in, assessed when it is outside Singapore (CMP-PD-06)"
    columns: [identity_directory.subject, passkey.name, owner_recovery.operators]
  - key: people-records
    what: "A person's legal and preferred name, work email, phone, start and leaving, with their job, manager and department history"
    why: "To run employment: who works here, in what role and under whom, and to meet the employer's record-keeping duties (Employment Act)"
    where: "Nemura's database, in Singapore"
    who: "Appendix B's people records (not restricted): HR officer and administrator, Payroll administrator, the Owner, a line manager for their reports; everyone sees the directory"
    retention: "MOM: employment records of a former employee are kept for 1 year after they leave"
    protection: "Row-level security per organisation; every change is audited; job history is never edited, only ended"
    transfers: "None"
    columns: [person.legal_name, person.preferred_name, person.work_email, person.phone, person.leaving_reason, join_task.note]
  - key: legal-classification
    what: "A person's legal classification: contract of service or for service, Employment Act cover and Part IV class, residency and the date residence began, and date of birth"
    why: "To apply the right statutory rules to the person (leave, hours, retirement and re-employment) and no others"
    where: "Nemura's database, in Singapore"
    who: "Appendix B's people records (not restricted): HR officer and administrator, Payroll administrator, the Owner; never the directory"
    retention: "Kept with the employment record: MOM requires employment records for 1 year after the person leaves"
    protection: "Row-level security per organisation; every change is audited; the audit event never carries the date of birth"
    transfers: "None"
    columns: [person_classification.birth_date, person_classification.pr_start_date]
  - key: restricted-identifiers
    what: "A person's NRIC or FIN and salary bank account, each sealed by the key service and kept with a masked form and a keyed fingerprint"
    why: "To file with the authorities (CPF, IRAS, MOM) and to pay salary: NRIC only for statutory filings, never to sign in"
    where: "Nemura's database, in Singapore, sealed with a key held in the key service (locally a key under .data or the stack's own)"
    who: "Appendix B's NRIC or FIN and Salary bank account rows: masked for the HR officer, in full only with the right, the person their own; every read is audited"
    retention: "Statutory filings are kept 5 years; the identifier goes with them"
    protection: "Envelope encryption bound to the record; a masked form for screens; the audit event never carries the value; a change of bank account needs a second person and the employee's passkey"
    transfers: "None"
    columns: [person_secret.nric_sealed, person_secret.nric_masked, person_secret.nric_fingerprint, person_secret.bank_sealed, person_secret.bank_masked, person_secret.bank_fingerprint, person_secret.bank_code, person_secret.bank_name, bank_account_change.new_bank_code, bank_account_change.new_bank_name, person_secret.ir8a_sealed]
  - key: dependants
    what: "A dependant's date of birth for family leave: relationship, citizenship and the employee's declaration"
    why: "To work out which family leave an employee is entitled to, per scheme and period (NM-PPL-07)"
    where: "Nemura's database, in Singapore"
    who: "Appendix B's Dependants row: the HR officer, the Payroll administrator where pay depends on it, the person their own"
    retention: "Kept with the employment record while a leave claim may need it"
    protection: "Row-level security; every read is audited; the audit event never carries the date of birth"
    transfers: "None"
    columns: [person_dependant.birth_date]
  - key: leave-records
    what: "A person's working pattern, their leave ledger (each grant, use, reservation and correction by type and year, with its note) their leave requests, with the person's note and the approver's reason, and their government-paid leave with the claims filed for it what the portal answered, their hours worked on special days and what leave gives their pay"
    why: "To keep an exact balance of leave, to show how it was worked out, and to meet the employer's record-keeping duties for leave (Employment Act)"
    where: "Nemura's database, in Singapore"
    who: "The person their own; the line manager their reports'; HR (Appendix B's leave records)"
    retention: "MOM: employment records, leave included, of a former employee are kept for 1 year after they leave"
    protection: "Row-level security; the ledger is append-only and every entry is audited; the notes are never in the audit event, and the approver's reason is its reason (never a diagnosis: leave requests carry no medical detail)"
    transfers: "None"
    columns: [leave_ledger.note, leave_request.note, leave_request.decision_reason, gov_claim_event.note, overtime_entry.note, overtime_entry.decision_reason, pay_input.note]
  - key: sick-leave
    what: "A person's notice that they were sick: the days, whether outpatient or hospitalisation, their note, and a pointer to the medical certificate (a restricted document) with who issued it and who verified it"
    why: "To record sick leave against the statutory ceiling, to check the certificate (Employment Act) and to pay what is due"
    where: "Nemura's database, in Singapore; the certificate in Nemura's file store, in Singapore"
    who: "Appendix B's Medical certificates and notes row: the HR officer and the HR administrator; the person their own notice; a line manager, Payroll and the Owner see only that the person is away"
    retention: "MOM: employment records, sick leave included, of a former employee are kept for 1 year after they leave"
    protection: "Row-level security; a notification is evidence that takes a certificate and a verification once; the audit event carries the days and never the kind or the note; the certificate is a restricted document"
    transfers: "None"
    columns: [sick_notification.note, sick_notification.issuer]
  - key: flexible-work
    what: "A person's formal request for a flexible work arrangement, their reason, and the employer's written reply with the grounds for a refusal"
    why: "To answer a request in writing within the time the Tripartite Guidelines give, and to keep the written reply the guidelines ask the employer to keep"
    where: "Nemura's database, in Singapore"
    who: "The person their own; HR officer, HR administrator and Owner (Appendix B: Leave requests)"
    retention: "Kept with the employment record: the written reply is evidence the employer followed the guidelines"
    protection: "Row-level security; a request keeps its words, its receipt date and its deadline, and is answered once; the audit event carries the outcome, never the reason or the reply"
    transfers: "None"
    columns: [flex_request.reason, flex_request.outcome, flex_request.written_reply]
  - key: own-details
    what: "A person's own contact details (personal email, home address, postal code), up to three emergency contacts (name, relationship, phone), their requests to change a legal name, residency or NRIC or FIN with the note and the evidence, and their questions to the people team with the answers"
    why: "To reach a person and their family in an emergency, to keep the record true on the person's own word and evidence, and to answer what they ask"
    where: "Nemura's database, in Singapore; the evidence in Nemura's file store, in Singapore"
    who: "The person their own; the people team reads the details of a person it looks after and the queue of requests (Appendix B: Own profile, balances, payslips, letters, requests)"
    retention: "Kept with the employment record: MOM requires employment records for 1 year after the person leaves"
    protection: "Row-level security; a request keeps its words and its evidence and is decided once by someone else; the audit event names the fields that changed, never the details, and a request never holds an NRIC or FIN"
    transfers: "None"
    columns: [person_contact.personal_email, person_contact.address, person_contact.postal_code, emergency_contact.contact_name, emergency_contact.relationship, emergency_contact.contact_phone, details_change.new_legal_name, details_change.note, details_change.decision_reason, hr_question.question, hr_question.reply]
  - key: pay-records
    what: "A person's pay: their pay group, basic monthly salary, self-help group fund, allowances and fixed deductions, the one-off items of a month (bonuses, commissions), a permanent resident's joint election, and the year to date of CPF wages, each pay run's lines, and each person's itemised payslips (the twelve items MOM requires, with the PDF) and the state of each payment (what was paid, when, and its instruction)"
    why: "To work out each person's pay, CPF, SDL and self-help group fund exactly and to show where every figure came from (Employment Act; CPF Act)"
    where: "Nemura's database, in Singapore"
    who: "The Payroll administrator and the Owner alone (Appendix B: Pay, pay history, pay runs); the person sees their own payslip; the HR roles see that a run exists, not amounts"
    retention: "Kept with the employment record: MOM requires employment records for 1 year after the person leaves"
    protection: "Row-level security and the payroll role; a pay record is history that is only ended, once; every change is audited and the audit event says that pay was set, never what it was; no log, outbox row or error carries pay"
    transfers: "None"
    columns: [person_pay.basic_monthly, person_pay.shg_fund, person_pay.pay_group_id, person_pay_item.pay_id, person_pay_item.name, person_pay_item.amount, pay_one_off.name, pay_one_off.amount, pay_one_off.note, cpf_ytd.ow, cpf_ytd.aw_subject, cpf_ytd.aw_paid, pay_run.pay_group_id, pay_run_version.reason, pay_run_override.reason, pay_run_override.value, pay_run_line.gross, pay_run_line.cpf_employee, pay_run_line.cpf_employer, pay_run_line.net, pay_run_line.items, payslip.data, payslip.blob_key, payslip.pay_date, pay_payment_event.amount, pay_payment_event.paid_on, pay_payment_event.instruction_id, pay_payment_event.note, tax_hold.reason, tax_hold.effective_from, pay_export.total]
  - key: key-employment-terms
    what: "A person's key employment terms: main duties, notice period, medical benefits and a fixed-term contract's end, and the pay terms (salary period, basic salary, fixed allowances and deductions, overtime period, other pay)"
    why: "To give the person the key employment terms in writing (Employment Act) and to fill the letter from the record, not from memory"
    where: "Nemura's database, in Singapore"
    who: "The base terms: HR officer, HR administrator and Owner write, Payroll administrator reads; the pay terms: Payroll administrator and Owner only (Appendix B: Pay, pay history, pay runs); the person sees them in the letter issued to them"
    retention: "Kept with the employment record: MOM requires employment records for 1 year after the person leaves"
    protection: "Row-level security; a record of terms is history that is only ended, once; every change is audited and the audit event says only that pay was set, never what it was"
    transfers: "None"
    columns: [person_terms.main_duties, person_terms.notice_period, person_terms.medical_benefits, person_terms.salary_period, person_terms.basic_salary, person_terms.fixed_allowances, person_terms.fixed_deductions, person_terms.overtime_period, person_terms.other_pay]
  - key: people-assistant
    what: "What the people assistant drafted for a request (the fields of a letter, the words of a reply), the text a person approved, their reason for not using a draft, and the assistant's own reasoning for it"
    why: "To let the people team edit, approve or refuse a draft and to apply exactly the text that was approved (NM-AI-02, NM-AI-04)"
    where: "Nemura's database, in Singapore; the model route is none or local mode's scripted model until processing in Singapore is evidenced for a real one"
    who: "The HR officer, the HR administrator and the Owner decide a draft (Appendix B: Letters and templates); the assistant's own role can only insert a proposal and reads nothing"
    retention: "Kept with the letter or the reply it became: an approved draft is evidence of what the company stated about the person"
    protection: "Row-level security; a proposal keeps what the assistant proposed and is decided once, within 72 hours, by someone other than the person it acted for; the audit event holds a fingerprint of the text, never the text"
    transfers: "None"
    columns: [ai_proposal.payload, ai_proposal.final_payload, ai_draft.payload, ai_proposal.rationale, ai_proposal.decision_reason]
  - key: letters
    what: "A person's request for a letter and what it is for, the facts filled into it from their record, the issued letter's data, the company's letterhead and the notes on a template"
    why: "To issue letters the person asked for, exactly and attributably, and to keep the issued letter as evidence of what was said and who signed it"
    where: "Nemura's database, in Singapore; the PDF in Nemura's file store, in Singapore"
    who: "The person their own; HR officer, HR administrator and Owner (Appendix B: Letters and templates); a delivery link delivers one letter to whoever holds the token for seven days"
    retention: "Kept with the employment record: an issued letter is evidence of what the company stated about the person"
    protection: "Row-level security; a request, a checked letter and an issued letter are evidence that never change; the PDF's SHA-256 is checked whenever it is read; a link's token is kept as a hash; the audit event carries the reference and the hash, never the letter's text"
    transfers: "None"
    columns: [letter_request.purpose, letter_request.data, letter_request.decision_reason, letter_issued.data, letter_template_version.note, letter_delegation.revoked_reason]
  - key: grievances
    what: "A concern a member raised in confidence: what happened in their words, the people it is about (by person), who handles it, the inquiry record (notes, interviews, findings and hand-overs) and the written outcome with what it concludes"
    why: "To look into a workplace concern fairly and in confidence, to give the person who raised it a written outcome and to show the company handled it (Workplace Fairness Act and the Tripartite Guidelines, NM-SEC-06)"
    where: "Nemura's database, in Singapore"
    who: "The person who raised it, their own grievance and its outcome; the HR administrator or the Owner who handles it, the inquiry record too (Appendix B: Grievances); never a person it is about, whatever their role, and never an HR administrator or the Owner who is neither; not the assistant or the read-only role; the worker only learns by identity which ones wait and which are due for deletion"
    retention: "No statutory period is stated for the channel; kept five years so the company can show how it handled the concern, then listed for review and deleted with its inquiry record, a legal hold keeping it (NM-SEC-05) [owner to confirm the period]"
    protection: "Row-level security with a restrictive policy that hides it from the people it is about and from everyone with no acting person; the inquiry record is append-only; a decided grievance never changes; every read by a handler is audited; the audit events carry identities and states, never the words or the names"
    transfers: "None"
    columns: [grievance.summary, grievance.subject_people, grievance.outcome, grievance_entry.body, grievance_entry.subject_people]
  - key: access-requests
    what: "A person's request for their own data, the decision for each category of record and the written outcome"
    why: "To answer a request for access to personal data within 30 days and to show how it was answered (PDPA)"
    where: "Nemura's database, in Singapore"
    who: "HR (Appendix B's own file beyond routine release); the person who asked sees their own"
    retention: "Kept as the record of how the organisation met its obligation"
    protection: "Row-level security; every change is audited; an answered request and its decisions cannot change"
    transfers: "None"
    columns: [access_request.outcome, access_request_item.exception]
  - key: legal-holds
    what: "A reason a person's or a type's records are kept past their retention"
    why: "To keep records that a dispute, an inquiry or the law requires, and to say why"
    where: "Nemura's database, in Singapore"
    who: "HR administrators and the Owner"
    retention: "Kept as the record of why a deletion did not happen"
    protection: "Row-level security; every change is audited"
    transfers: "None"
    columns: [legal_hold.reason]
